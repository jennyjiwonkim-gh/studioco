<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudioCo — Creative Business Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #F8F6F1;
    --ink: #111111;
    --paper: #FFFFFF;
    --hairline: #DEDACD;
    --muted: #8A8579;
    --today-tint: #FDF9E8;
    --flash: #FFF176;
    --scrim: rgba(16, 14, 10, 0.28);
    --accent-navy: #102A43;
    --accent-royal: #120A8F;
    --accent-cobalt: #1D4ED8;
    --accent-lemon: #8F7300;
    --accent-tomato: #F24A3D;
  }
  [data-theme="dark"] {
    --cream: #16150F;
    --ink: #F2EFE6;
    --paper: #201E17;
    --hairline: #38352B;
    --muted: #9A9483;
    --today-tint: #2E2A16;
    --flash: #6B5F14;
    --accent-navy: #6FA0CC;
    --accent-royal: #8C8AF0;
    --accent-cobalt: #7FA9FF;
    --accent-lemon: #FFF176;
    --accent-tomato: #FF7A6E;
  }
  html, body { 
    margin: 0; 
    padding: 0; 
    background: var(--cream);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
  [data-theme="dark"] { color-scheme: dark; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ============ SUPABASE CLIENT ============
const SUPABASE_URL = 'https://hvqjpoqamxalitydrega.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2cWpwb3FhbXhhbGl0eWRyZWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MjE2OTcsImV4cCI6MjEwMTI5NzY5N30.fWDNqRDXanEMLrSjFkRXuVv9CPyXbU276KO_zrB1g8w';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const COLORS = {
  navy: "var(--accent-navy)",
  royalBlue: "var(--accent-royal)",
  cobalt: "var(--accent-cobalt)",
  tomato: "var(--accent-tomato)",
  lemon: "#FFF176",
  cream: "var(--cream)",
  ink: "var(--ink)",
  paper: "var(--paper)",
  hairline: "var(--hairline)",
  muted: "var(--muted)",
  todayTint: "var(--today-tint)",
  scrim: "var(--scrim)",
};

const RADIUS = 3;

// ============ LANDING PAGE ============
function LandingPage({ onLoginClick, onSignupClick }) {
  return (
    <div style={{
      minHeight: '100vh',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      padding: '24px',
      background: COLORS.cream,
    }}>
      <div style={{
        maxWidth: '600px',
        textAlign: 'center',
      }}>
        <h1 style={{
          fontSize: '48px',
          fontWeight: 700,
          marginTop: 0,
          marginBottom: '12px',
          color: COLORS.ink,
        }}>
          StudioCo
        </h1>
        <p style={{
          fontSize: '18px',
          color: COLORS.muted,
          marginBottom: '32px',
          lineHeight: 1.6,
        }}>
          A private studio management dashboard for ceramic artists. Track projects, manage content, and grow your creative business — all in one place.
        </p>
        
        <div style={{
          display: 'flex',
          gap: '12px',
          justifyContent: 'center',
          flexWrap: 'wrap',
        }}>
          <button
            onClick={onLoginClick}
            style={{
              padding: '12px 24px',
              fontSize: '14px',
              fontWeight: 600,
              backgroundColor: COLORS.navy,
              color: '#FFF',
              border: 'none',
              borderRadius: RADIUS,
              cursor: 'pointer',
              transition: 'opacity 200ms',
            }}
            onMouseEnter={(e) => e.target.style.opacity = '0.9'}
            onMouseLeave={(e) => e.target.style.opacity = '1'}
          >
            Log In
          </button>
          <button
            onClick={onSignupClick}
            style={{
              padding: '12px 24px',
              fontSize: '14px',
              fontWeight: 600,
              backgroundColor: 'transparent',
              color: COLORS.navy,
              border: `2px solid ${COLORS.navy}`,
              borderRadius: RADIUS,
              cursor: 'pointer',
              transition: 'all 200ms',
            }}
            onMouseEnter={(e) => {
              e.target.style.backgroundColor = COLORS.navy;
              e.target.style.color = '#FFF';
            }}
            onMouseLeave={(e) => {
              e.target.style.backgroundColor = 'transparent';
              e.target.style.color = COLORS.navy;
            }}
          >
            Sign Up
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ LOGIN/SIGNUP FORMS ============
function AuthForm({ isSignUp, onBack, onSuccess, onError }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    setLoading(true);

    try {
      if (isSignUp) {
        const { data, error: authError } = await supabase.auth.signUp({
          email,
          password,
        });
        if (authError) throw authError;
        onSuccess('Check your email for a confirmation link');
      } else {
        const { data, error: authError } = await supabase.auth.signInWithPassword({
          email,
          password,
        });
        if (authError) throw authError;
        onSuccess('Logged in successfully');
      }
    } catch (err) {
      setError(err.message);
      onError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{
      minHeight: '100vh',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      padding: '24px',
      background: COLORS.cream,
    }}>
      <div style={{
        maxWidth: '400px',
        width: '100%',
      }}>
        <button
          onClick={onBack}
          style={{
            background: 'none',
            border: 'none',
            color: COLORS.muted,
            cursor: 'pointer',
            marginBottom: '24px',
            fontSize: '14px',
            fontWeight: 500,
          }}
        >
          ← Back
        </button>

        <h2 style={{
          fontSize: '28px',
          fontWeight: 700,
          marginTop: 0,
          marginBottom: '24px',
          color: COLORS.ink,
        }}>
          {isSignUp ? 'Create Account' : 'Log In'}
        </h2>

        <form onSubmit={handleSubmit}>
          <div style={{ marginBottom: '16px' }}>
            <label style={{
              display: 'block',
              fontSize: '12px',
              fontWeight: 600,
              marginBottom: '6px',
              color: COLORS.ink,
              textTransform: 'uppercase',
              letterSpacing: '0.5px',
            }}>
              Email
            </label>
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              required
              disabled={loading}
              style={{
                width: '100%',
                padding: '10px 12px',
                fontSize: '14px',
                border: `1px solid ${COLORS.hairline}`,
                borderRadius: RADIUS,
                backgroundColor: COLORS.paper,
                color: COLORS.ink,
                fontFamily: 'inherit',
              }}
            />
          </div>

          <div style={{ marginBottom: '24px' }}>
            <label style={{
              display: 'block',
              fontSize: '12px',
              fontWeight: 600,
              marginBottom: '6px',
              color: COLORS.ink,
              textTransform: 'uppercase',
              letterSpacing: '0.5px',
            }}>
              Password
            </label>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              required
              disabled={loading}
              style={{
                width: '100%',
                padding: '10px 12px',
                fontSize: '14px',
                border: `1px solid ${COLORS.hairline}`,
                borderRadius: RADIUS,
                backgroundColor: COLORS.paper,
                color: COLORS.ink,
                fontFamily: 'inherit',
              }}
            />
          </div>

          {error && (
            <div style={{
              padding: '12px',
              marginBottom: '16px',
              backgroundColor: '#FEE2E2',
              color: '#991B1B',
              borderRadius: RADIUS,
              fontSize: '13px',
            }}>
              {error}
            </div>
          )}

          <button
            type="submit"
            disabled={loading}
            style={{
              width: '100%',
              padding: '12px',
              fontSize: '14px',
              fontWeight: 600,
              backgroundColor: COLORS.navy,
              color: '#FFF',
              border: 'none',
              borderRadius: RADIUS,
              cursor: loading ? 'not-allowed' : 'pointer',
              opacity: loading ? 0.6 : 1,
            }}
          >
            {loading ? 'Please wait...' : (isSignUp ? 'Sign Up' : 'Log In')}
          </button>
        </form>
      </div>
    </div>
  );
}

// ============ MAIN APP ============
export default function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [authView, setAuthView] = useState(null); // null, 'login', 'signup'
  const [message, setMessage] = useState('');
  const messageTimeoutRef = useRef(null);

  // Check auth state on mount
  useEffect(() => {
    const checkAuth = async () => {
      const { data: { session } } = await supabase.auth.getSession();
      setUser(session?.user || null);
      setLoading(false);
    };
    checkAuth();

    // Listen for auth changes
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      setUser(session?.user || null);
      setAuthView(null);
    });

    return () => subscription?.unsubscribe();
  }, []);

  const showMessage = (msg) => {
    setMessage(msg);
    if (messageTimeoutRef.current) clearTimeout(messageTimeoutRef.current);
    messageTimeoutRef.current = setTimeout(() => setMessage(''), 3000);
  };

  if (loading) {
    return (
      <div style={{
        minHeight: '100vh',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        background: COLORS.cream,
        fontSize: '14px',
        color: COLORS.muted,
      }}>
        Loading...
      </div>
    );
  }

  // Not logged in - show auth flow
  if (!user) {
    if (authView === 'login') {
      return (
        <AuthForm
          isSignUp={false}
          onBack={() => setAuthView(null)}
          onSuccess={showMessage}
          onError={showMessage}
        />
      );
    }
    if (authView === 'signup') {
      return (
        <AuthForm
          isSignUp={true}
          onBack={() => setAuthView(null)}
          onSuccess={showMessage}
          onError={showMessage}
        />
      );
    }
    return (
      <LandingPage
        onLoginClick={() => setAuthView('login')}
        onSignupClick={() => setAuthView('signup')}
      />
    );
  }

  // Logged in - show dashboard with logout button
  return (
    <div style={{ position: 'relative' }}>
      <div style={{
        position: 'fixed',
        top: '16px',
        right: '16px',
        zIndex: 9999,
      }}>
        <button
          onClick={() => {
            supabase.auth.signOut();
            setUser(null);
          }}
          style={{
            padding: '8px 16px',
            fontSize: '12px',
            fontWeight: 600,
            backgroundColor: COLORS.tomato,
            color: '#FFF',
            border: 'none',
            borderRadius: RADIUS,
            cursor: 'pointer',
            textTransform: 'uppercase',
            letterSpacing: '0.5px',
          }}
        >
          Log Out
        </button>
      </div>

      {message && (
        <div style={{
          position: 'fixed',
          top: '16px',
          left: '16px',
          padding: '12px 16px',
          backgroundColor: COLORS.navy,
          color: '#FFF',
          borderRadius: RADIUS,
          fontSize: '12px',
          zIndex: 10000,
        }}>
          {message}
        </div>
      )}

      <div style={{
        paddingTop: '60px',
        textAlign: 'center',
        padding: '60px 24px 24px',
        minHeight: '100vh',
        background: COLORS.cream,
      }}>
        <h1 style={{
          fontSize: '32px',
          fontWeight: 700,
          color: COLORS.ink,
          marginBottom: '12px',
        }}>
          Welcome to StudioCo
        </h1>
        <p style={{
          fontSize: '14px',
          color: COLORS.muted,
          marginBottom: '32px',
        }}>
          Logged in as: <strong>{user.email}</strong>
        </p>
        <p style={{
          fontSize: '14px',
          color: COLORS.muted,
          maxWidth: '500px',
          margin: '0 auto',
          lineHeight: 1.6,
        }}>
          The full dashboard is being integrated. For now, you're successfully authenticated. 
          <br /><br />
          This proves the auth layer is working. Next session: we'll integrate your full v49 dashboard and wire up data sync with Supabase.
        </p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
