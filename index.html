function YearGrid({ cursor, today, onPickMonth, viewport }) {
  const year = cursor.getFullYear();
  const cols = viewport && viewport.isPhone ? 1 : viewport && viewport.isTablet ? 2 : 4;
  return (
    <div style={{ display: "grid", gridTemplateColumns: `repeat(${cols}, 1fr)`, gap: "28px 22px" }}>
      {MONTH_NAMES.map((m, i) => {
        const isCurrentMonth = today.getFullYear() === year && today.getMonth() === i;
        const gridStart = startOfWeek(new Date(year, i, 1));
        const cells = Array.from({ length: 42 }, (_, k) => addDays(gridStart, k));
        // trim trailing all-out-of-month rows for a tighter mini calendar
        const lastInMonthIdx = cells.reduce((acc, d, idx) => (d.getMonth() === i ? idx : acc), 0);
        const rowsNeeded = Math.ceil((lastInMonthIdx + 1) / 7);
        const trimmed = cells.slice(0, rowsNeeded * 7);

        return (
          <div key={m} onClick={() => onPickMonth(new Date(year, i, 1))} style={{ cursor: "pointer" }}>
            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.04em", marginBottom: 8, color: isCurrentMonth ? COLORS.tomato : COLORS.ink }}>
              {m.toUpperCase()}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", marginBottom: 3 }}>
              {DAY_NAMES.map((d) => (
                <div key={d} style={{ fontSize: 8, color: COLORS.muted, textAlign: "center", fontWeight: 600 }}>{d[0]}</div>
              ))}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", rowGap: 2 }}>
              {trimmed.map((d, k) => {
                const inMonth = d.getMonth() === i;
                const isToday = isSameDay(d, today);
                if (!inMonth) {
                  return <div key={k} style={{ height: 18 }} />;
                }
                return (
                  <div key={k} style={{ textAlign: "center", position: "relative", height: 18 }}>
                    <span
                      style={{
                        display: "inline-flex",
                        alignItems: "center",
                        justifyContent: "center",
                        width: 16,
                        height: 16,
                        borderRadius: "50%",
                        fontSize: 9,
                        fontWeight: isToday ? 700 : 400,
                        color: isToday ? COLORS.paper : COLORS.ink,
                        background: isToday ? COLORS.tomato : "transparent",
                      }}
                    >
                      {d.getDate()}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function MonthGrid({ cursor, today, tasks, projects, projectAccent, onPickDay, onCursorMonthChange, onOpenProject }) {
  const sortedProjects = [...projects].sort((a, b) => a.name.localeCompare(b.name));
  const scrollRef = React.useRef(null);
  const monthRefs = React.useRef({});
  const MONTHS_BEFORE = 3;
  const MONTHS_AFTER = 4;

  // Build a continuous run of MONTHS (not raw weeks) centered on cursor's month.
  // Each month independently generates its own rows: first row = week containing the 1st
  // (blank cells before it), last row = week containing the last day (blank cells after it).
  // Consecutive months never share a row.
  const anchorMonth = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const monthList = React.useMemo(() => {
    const arr = [];
    for (let i = -MONTHS_BEFORE; i <= MONTHS_AFTER; i++) {
      arr.push(new Date(anchorMonth.getFullYear(), anchorMonth.getMonth() + i, 1));
    }
    return arr;
  }, [anchorMonth.getTime()]);

  const buildMonthRows = (monthDate) => {
    const year = monthDate.getFullYear();
    const month = monthDate.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    const lastOfMonth = new Date(year, month + 1, 0);
    const firstRowStart = startOfWeek(firstOfMonth);
    const totalDaysSpan = Math.round((lastOfMonth - firstRowStart) / 86400000) + 1;
    const rowCount = Math.ceil(totalDaysSpan / 7);
    const rows = [];
    for (let r = 0; r < rowCount; r++) {
      const rowStart = addDays(firstRowStart, r * 7);
      const days = Array.from({ length: 7 }, (_, i) => addDays(rowStart, i));
      rows.push(days);
    }
    return rows;
  };

  // Distinguish external cursor jumps (Today/‹/› buttons) from our own scroll-driven updates,
  // so nav buttons re-scroll the view but the user's own scrolling doesn't fight itself.
  const scrollInitiated = React.useRef(false);
  React.useEffect(() => {
    if (scrollInitiated.current) {
      scrollInitiated.current = false;
      return;
    }
    const key = anchorMonth.getFullYear() + "-" + anchorMonth.getMonth();
    const el = monthRefs.current[key];
    if (el && scrollRef.current) {
      el.scrollIntoView({ block: "start" });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [cursor.getFullYear(), cursor.getMonth()]);

  // Track scroll position to report which month is currently in view
  const onScroll = () => {
    if (!scrollRef.current) return;
    const containerTop = scrollRef.current.getBoundingClientRect().top;
    let closestMonth = null;
    let closestDist = Infinity;
    for (const m of monthList) {
      const key = m.getFullYear() + "-" + m.getMonth();
      const el = monthRefs.current[key];
      if (!el) continue;
      const dist = Math.abs(el.getBoundingClientRect().top - containerTop - 40);
      if (dist < closestDist) { closestDist = dist; closestMonth = m; }
    }
    if (closestMonth && (closestMonth.getMonth() !== cursor.getMonth() || closestMonth.getFullYear() !== cursor.getFullYear())) {
      scrollInitiated.current = true;
      onCursorMonthChange(closestMonth);
    }
  };

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 168px", gap: 20 }}>
      <div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", borderBottom: `1px solid ${COLORS.ink}`, paddingBottom: 6, marginBottom: 2 }}>
          {DAY_NAMES.map((d) => (
            <div key={d} style={{ fontSize: 10.5, fontWeight: 600, color: COLORS.muted, letterSpacing: "0.05em", textTransform: "uppercase", textAlign: "center" }}>{d}</div>
          ))}
        </div>
        <div
          ref={scrollRef}
          onScroll={onScroll}
          style={{ maxHeight: 460, overflowY: "auto", scrollSnapType: "none", WebkitOverflowScrolling: "touch" }}
        >
          {monthList.map((monthDate) => {
            const monthKey = monthDate.getFullYear() + "-" + monthDate.getMonth();
            const rows = buildMonthRows(monthDate);
            return (
              <div key={monthKey} ref={(el) => { monthRefs.current[monthKey] = el; }}>
                {rows.map((days, rowIdx) => (
                  <div key={rowIdx} style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))" }}>
                    {days.map((d, i) => {
                      const inMonth = d.getMonth() === monthDate.getMonth() && d.getFullYear() === monthDate.getFullYear();
                      const isToday = isSameDay(d, today);
                      const dayTasks = inMonth ? tasks.filter((t) => isSameDay(t.date, d)) : [];
                      const isRightEdge = (i + 1) % 7 === 0;

                      if (!inMonth) {
                        return (
                          <div
                            key={i}
                            style={{
                              minHeight: 84,
                              borderRight: isRightEdge ? "none" : `1px solid ${COLORS.hairline}`,
                              borderBottom: `1px solid ${COLORS.hairline}`,
                            }}
                          />
                        );
                      }

                      return (
                        <div
                          key={i}
                          onClick={() => onPickDay(d)}
                          style={{
                            minHeight: 84,
                            minWidth: 0,
                            padding: "6px 7px",
                            cursor: "pointer",
                            background: isToday ? COLORS.todayTint : "transparent",
                            borderRight: isRightEdge ? "none" : `1px solid ${COLORS.hairline}`,
                            borderBottom: `1px solid ${COLORS.hairline}`,
                            overflow: "hidden",
                          }}
                        >
                          <div style={{ fontSize: 12, fontWeight: isToday ? 700 : 500, color: isToday ? COLORS.tomato : COLORS.ink, marginBottom: 4 }}>{d.getDate()}</div>
                          {dayTasks.slice(0, 3).map((t) => {
                            const a = projectAccent(t.projectId);
                            return (
                              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 2, minWidth: 0 }}>
                                <div style={{ width: 5, height: 5, borderRadius: "50%", background: a.hex, flexShrink: 0 }} />
                                <div style={{ fontSize: 9.5, color: COLORS.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", minWidth: 0, flex: 1 }}>{t.title}</div>
                              </div>
                            );
                          })}
                          {dayTasks.length > 3 && <div style={{ fontSize: 9, color: COLORS.muted, marginLeft: 9 }}>+{dayTasks.length - 3} more</div>}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
        <div style={{ fontSize: 10.5, color: COLORS.muted, marginTop: 10, fontStyle: "italic" }}>Scroll continuously to browse — drag on iPad, or use the mouse wheel.</div>
      </div>

      <div style={{ borderLeft: `1px solid ${COLORS.hairline}`, paddingLeft: 16 }}>
        <SectionLabel>Projects</SectionLabel>
        <div style={{ marginTop: 10 }}>
          {sortedProjects.map((p) => {
            const a = PROJECT_ACCENTS[p.accentIdx];
            return (
              <div
                key={p.id}
                onClick={() => onOpenProject(p.id)}
                style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8, cursor: "pointer" }}
              >
                <div style={{ width: 6, height: 6, borderRadius: "50%", background: a.hex, flexShrink: 0 }} />
                <div style={{ fontSize: 11.5, lineHeight: 1.3 }}>{p.name}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function WeekGrid({ cursor, today, tasks, setTasks, projects, projectAccent, onOpenProject, setCursor, singleDay }) {
  const days = singleDay ? [cursor] : Array.from({ length: 7 }, (_, i) => addDays(startOfWeek(cursor), i));
  const HOUR_START = 7;
  const HOUR_END = 22;
  const PX_PER_MIN = 1; // 60px per hour
  const SNAP_MIN = 15;
  const totalHeight = (HOUR_END - HOUR_START) * 60 * PX_PER_MIN;
  const hours = Array.from({ length: HOUR_END - HOUR_START + 1 }, (_, i) => i + HOUR_START);

  const [dragState, setDragState] = useState(null); // { taskId, dayIso, startMinutes, pointerStartY, pointerStartX, origDayIso }
  const [edgeSide, setEdgeSide] = useState(null); // "left" | "right" | null — visual feedback while holding at the day-view edge
  const [newTaskPrompt, setNewTaskPrompt] = useState(null); // { dayIso, startMinutes }
  const [newTaskTitle, setNewTaskTitle] = useState("");
  const [newTaskProjectId, setNewTaskProjectId] = useState(projects[0]?.id || "");
  const [editDraft, setEditDraft] = useState(null); // { id, title, projectId, dateStr, timeStr, durationMinutes }
  const columnRefs = React.useRef({});
  const edgeHoldTimer = React.useRef(null);
  const edgeHoldSide = React.useRef(null);
  const cursorRef = React.useRef(cursor);
  cursorRef.current = cursor;
  const sortedProjects = [...projects].sort((a, b) => a.name.localeCompare(b.name));

  const projectName = (projectId) => projects.find((p) => p.id === projectId)?.name || "";

  // Compute side-by-side layout (column index + column count) for overlapping tasks within one day
  const layoutForDay = (dayTasks) => {
    const sorted = [...dayTasks].sort((a, b) => a.startMinutes - b.startMinutes);
    const clusters = [];
    let current = [];
    let currentEnd = -Infinity;
    for (const t of sorted) {
      if (current.length === 0 || t.startMinutes < currentEnd) {
        current.push(t);
        currentEnd = Math.max(currentEnd, t.startMinutes + t.durationMinutes);
      } else {
        clusters.push(current);
        current = [t];
        currentEnd = t.startMinutes + t.durationMinutes;
      }
    }
    if (current.length) clusters.push(current);

    const layout = {};
    for (const cluster of clusters) {
      // assign columns greedily
      const colEnds = [];
      const assigned = [];
      for (const t of cluster) {
        let col = colEnds.findIndex((end) => end <= t.startMinutes);
        if (col === -1) { col = colEnds.length; colEnds.push(0); }
        colEnds[col] = t.startMinutes + t.durationMinutes;
        assigned.push({ task: t, col });
      }
      const colCount = colEnds.length;
      for (const { task, col } of assigned) {
        layout[task.id] = { col, colCount };
      }
    }
    return layout;
  };

  // Pointerdown only "arms" a potential drag (no state update, so the task's DOM node
  // stays mounted). The drag only actually begins — swapping in the ghost, filtering the
  // task out of dayTasks — once the pointer moves past a small threshold. Without this,
  // a real double-click's first mousedown would immediately re-render and swap out the
  // element mid-click, breaking the browser's native double-click detection on the second click.
  const pendingDragRef = React.useRef(null);
  const DRAG_THRESHOLD = 4; // px of movement before a press counts as a drag rather than a click

  const startDrag = (e, task, dayIso) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    const taskRect = e.currentTarget.getBoundingClientRect();
    const colEl = e.currentTarget.closest("[data-daycol]");
    const colRect = colEl ? colEl.getBoundingClientRect() : taskRect;
    pendingDragRef.current = {
      taskId: task.id,
      origDayIso: dayIso,
      dayIso,
      startMinutes: task.startMinutes,
      pointerStartY: e.clientY,
      pointerStartX: e.clientX,
      origStartMinutes: task.startMinutes,
      // preserve the task's original on-screen width/position within its column,
      // so the drag ghost doesn't guess a new (wrong) width
      ghostWidth: taskRect.width,
      ghostLeftInCol: taskRect.left - colRect.left,
    };
  };

  const onMove = (e) => {
    let current = dragState;
    if (!current) {
      const pending = pendingDragRef.current;
      if (!pending) return;
      const moved = Math.hypot(e.clientX - pending.pointerStartX, e.clientY - pending.pointerStartY);
      if (moved < DRAG_THRESHOLD) return;
      current = pending; // just crossed the threshold — begin the drag using this same move event
    }
    const deltaY = e.clientY - current.pointerStartY;
    const deltaMinRaw = deltaY / PX_PER_MIN;
    const snappedDelta = Math.round(deltaMinRaw / SNAP_MIN) * SNAP_MIN;
    let newStart = current.origStartMinutes + snappedDelta;
    newStart = Math.max(HOUR_START * 60, Math.min(newStart, HOUR_END * 60 - 15));

    // detect which day column the pointer is over (only relevant in week view)
    let newDayIso = current.dayIso;
    if (!singleDay) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const colEl = el ? el.closest("[data-daycol]") : null;
      if (colEl) newDayIso = colEl.getAttribute("data-daycol");
    } else {
      // Day view: dragging the pointer past the left/right edge of the single visible
      // column, and holding there briefly, slides the view to the adjacent day.
      const dayIso = days[0].toISOString();
      const colEl = columnRefs.current[dayIso];
      const EDGE_ZONE = 24; // px past the column edge that triggers the hold-timer
      const HOLD_MS = 380; // how long the pointer must stay past the edge before sliding
      if (colEl) {
        const rect = colEl.getBoundingClientRect();
        const pastLeft = e.clientX < rect.left - EDGE_ZONE;
        const pastRight = e.clientX > rect.right + EDGE_ZONE;
        const side = pastLeft ? "left" : pastRight ? "right" : null;

        if (side) {
          if (edgeHoldSide.current !== side) {
            edgeHoldSide.current = side;
            setEdgeSide(side);
            if (edgeHoldTimer.current) clearTimeout(edgeHoldTimer.current);
            edgeHoldTimer.current = setTimeout(() => {
              const dir = side === "left" ? -1 : 1;
              const nextDay = addDays(cursorRef.current, dir);
              setCursor(nextDay);
              const nextDayIso = new Date(nextDay.getFullYear(), nextDay.getMonth(), nextDay.getDate()).toISOString();
              setDragState((prev) => {
                if (!prev) return prev;
                // Re-anchor the vertical reference point to the current pointer position,
                // so the task doesn't jump vertically the moment the day changes.
                return {
                  ...prev,
                  dayIso: nextDayIso,
                  pointerStartY: e.clientY,
                  origStartMinutes: prev.startMinutes,
                };
              });
              edgeHoldSide.current = null;
              edgeHoldTimer.current = null;
              setEdgeSide(null);
            }, HOLD_MS);
          }
        } else {
          edgeHoldSide.current = null;
          setEdgeSide(null);
          if (edgeHoldTimer.current) { clearTimeout(edgeHoldTimer.current); edgeHoldTimer.current = null; }
        }
      }
    }

    setDragState((prev) => ({ ...(prev || current), startMinutes: newStart, dayIso: newDayIso }));
  };

  const onUp = () => {
    if (edgeHoldTimer.current) { clearTimeout(edgeHoldTimer.current); edgeHoldTimer.current = null; }
    edgeHoldSide.current = null;
    setEdgeSide(null);
    pendingDragRef.current = null;
    if (!dragState) return;
    const newDay = new Date(dragState.dayIso);
    setTasks((prev) => prev.map((t) => (t.id === dragState.taskId ? { ...t, date: newDay, startMinutes: dragState.startMinutes } : t)));
    setDragState(null);
  };

  const fmtMinLabel = (mins) => {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    const period = h >= 12 ? "PM" : "AM";
    let hr = h % 12; if (hr === 0) hr = 12;
    return hr + (m > 0 ? ":" + String(m).padStart(2, "0") : "") + " " + period;
  };

  const fmtTimeInput = (mins) => {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  };

  const openEditTask = (t) => {
    const d = t.date;
    const pad = (n) => String(n).padStart(2, "0");
    setEditDraft({
      id: t.id,
      title: t.title,
      projectId: t.projectId,
      dateStr: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
      timeStr: fmtTimeInput(t.startMinutes),
      durationMinutes: t.durationMinutes,
    });
  };

  const saveEditTask = () => {
    if (!editDraft) return;
    const title = editDraft.title.trim();
    if (!title || !editDraft.projectId) return;
    const [y, mo, da] = editDraft.dateStr.split("-").map(Number);
    const [h, mi] = editDraft.timeStr.split(":").map(Number);
    setTasks((prev) =>
      prev.map((t) =>
        t.id === editDraft.id
          ? { ...t, title, projectId: editDraft.projectId, date: new Date(y, mo - 1, da), startMinutes: h * 60 + mi, durationMinutes: editDraft.durationMinutes }
          : t
      )
    );
    setEditDraft(null);
  };

  const deleteEditTask = () => {
    if (!editDraft) return;
    if (window.confirm("Delete this task? This cannot be undone.")) {
      setTasks((prev) => prev.filter((t) => t.id !== editDraft.id));
      setEditDraft(null);
    }
  };

  const submitNewTask = () => {
    const title = newTaskTitle.trim();
    if (!title || !newTaskProjectId || !newTaskPrompt) return;
    const day = new Date(newTaskPrompt.dayIso);
    const newTask = {
      id: newTaskProjectId + "-t-" + Date.now(),
      projectId: newTaskProjectId,
      title,
      date: day,
      startMinutes: newTaskPrompt.startMinutes,
      durationMinutes: 60,
      completed: false,
    };
    setTasks((prev) => [...prev, newTask]);
    setNewTaskPrompt(null);
    setNewTaskTitle("");
  };

  return (
    <>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 168px", gap: 20 }}>
      <div
        style={{
          overflowX: "auto",
          position: "relative",
          userSelect: dragState ? "none" : "auto",
          WebkitUserSelect: dragState ? "none" : "auto",
        }}
        onPointerMove={onMove}
        onPointerUp={onUp}
        onPointerCancel={onUp}
      >
        {singleDay && edgeSide && (
          <div
            style={{
              position: "absolute",
              top: 0,
              bottom: 0,
              [edgeSide]: 0,
              width: 6,
              background: COLORS.tomato,
              zIndex: 5,
              pointerEvents: "none",
            }}
          />
        )}
        <div style={{ display: "grid", gridTemplateColumns: `52px repeat(${days.length}, minmax(140px, 1fr))` }}>
          <div />
          {days.map((d) => {
            const isToday = isSameDay(d, today);
            return (
              <div key={d.toISOString()} style={{ textAlign: "center", padding: "6px 4px", borderBottom: `1px solid ${COLORS.hairline}`, fontSize: 11, fontWeight: 600, letterSpacing: "0.03em" }}>
                {DAY_NAMES[d.getDay()].toUpperCase()}{" "}
                <span style={{ display: "inline-block", width: 19, height: 19, lineHeight: "19px", borderRadius: "50%", background: isToday ? COLORS.tomato : "transparent", color: isToday ? COLORS.paper : COLORS.ink }}>
                  {d.getDate()}
                </span>
              </div>
            );
          })}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: `52px repeat(${days.length}, minmax(140px, 1fr))`, position: "relative" }}>
          {/* Hour label column */}
          <div style={{ position: "relative", height: totalHeight }}>
            {hours.map((h) => (
              <div key={h} style={{ position: "absolute", top: (h - HOUR_START) * 60 * PX_PER_MIN - 6, right: 6, fontSize: 9.5, color: COLORS.muted }}>
                {fmtHour(h)}
              </div>
            ))}
          </div>

          {/* Day columns */}
          {days.map((d) => {
            const dayIso = new Date(d.getFullYear(), d.getMonth(), d.getDate()).toISOString();
            let dayTasks = tasks.filter((t) => isSameDay(t.date, d) && t.id !== (dragState && dragState.taskId));
            const layout = layoutForDay(dayTasks);
            const draggingHere = dragState && dragState.dayIso === dayIso;

            return (
              <div
                key={d.toISOString()}
                data-daycol={dayIso}
                ref={(el) => { columnRefs.current[dayIso] = el; }}
                onDoubleClick={(e) => {
                  const rect = e.currentTarget.getBoundingClientRect();
                  const offsetY = e.clientY - rect.top;
                  const rawMinutes = HOUR_START * 60 + offsetY / PX_PER_MIN;
                  const snapped = Math.round(rawMinutes / SNAP_MIN) * SNAP_MIN;
                  setNewTaskPrompt({ dayIso, startMinutes: snapped });
                }}
                style={{ position: "relative", height: totalHeight, borderLeft: `1px solid ${COLORS.hairline}` }}
              >
                {hours.map((h) => (
                  <div key={h} style={{ position: "absolute", top: (h - HOUR_START) * 60 * PX_PER_MIN, left: 0, right: 0, borderTop: `1px solid ${COLORS.hairline}` }} />
                ))}

                {dayTasks.map((t) => {
                  const a = projectAccent(t.projectId);
                  const { col, colCount } = layout[t.id] || { col: 0, colCount: 1 };
                  const top = (t.startMinutes - HOUR_START * 60) * PX_PER_MIN;
                  const height = Math.max(t.durationMinutes * PX_PER_MIN - 2, 16);
                  const widthPct = 100 / colCount;
                  return (
                    <div
                      key={t.id}
                      onPointerDown={(e) => startDrag(e, t, dayIso)}
                      onDoubleClick={(e) => { e.stopPropagation(); openEditTask(t); }}
                      style={{
                        position: "absolute",
                        top,
                        left: `calc(${col * widthPct}% + 1px)`,
                        width: `calc(${widthPct}% - 3px)`,
                        height,
                        background: COLORS.paper,
                        border: `1px solid ${COLORS.hairline}`,
                        borderLeft: `3px solid ${a.hex}`,
                        color: COLORS.ink,
                        borderRadius: RADIUS,
                        fontSize: 10,
                        padding: "3px 6px",
                        cursor: "grab",
                        overflow: "hidden",
                        zIndex: 1,
                        touchAction: "none",
                        userSelect: "none",
                        WebkitUserSelect: "none",
                      }}
                      title={t.title + " — " + projectName(t.projectId) + " — drag to reschedule, double-click to edit"}
                    >
                      {t.category && (
                        <i
                          className={"ti " + (t.category === "craft" ? "ti-brush" : "ti-movie")}
                          style={{ position: "absolute", top: 3, right: 4, fontSize: 10, color: COLORS.muted }}
                          aria-hidden="true"
                        />
                      )}
                      <div style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", opacity: t.completed ? 0.5 : 1, textDecoration: t.completed ? "line-through" : "none", paddingRight: t.category ? 12 : 0 }}>
                        {t.title}
                      </div>
                      <div
                        onPointerDown={(e) => e.stopPropagation()}
                        onClick={(e) => { e.stopPropagation(); onOpenProject(t.projectId); }}
                        style={{ fontSize: 9, fontStyle: "italic", fontWeight: 300, color: COLORS.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", marginTop: 1, cursor: "pointer" }}
                      >
                        {projectName(t.projectId)}
                      </div>
                    </div>
                  );
                })}

                {/* Ghost preview while dragging into this column — keeps the task's original width, doesn't expand to fill the day */}
                {draggingHere && (() => {
                  const t = tasks.find((tt) => tt.id === dragState.taskId);
                  if (!t) return null;
                  const a = projectAccent(t.projectId);
                  const top = (dragState.startMinutes - HOUR_START * 60) * PX_PER_MIN;
                  const height = Math.max(t.durationMinutes * PX_PER_MIN - 2, 16);
                  const isOriginalColumn = dragState.dayIso === dragState.origDayIso;
                  // In the day it was dragged from, keep its exact original width/position.
                  // If dragged into a different day, fall back to a single-column width (that
                  // day's own overlap layout will resolve for real once the task actually lands there).
                  const ghostLeft = isOriginalColumn ? dragState.ghostLeftInCol : 1;
                  const ghostWidth = isOriginalColumn ? dragState.ghostWidth : undefined;
                  return (
                    <div
                      style={{
                        position: "absolute",
                        top,
                        left: ghostLeft,
                        width: ghostWidth != null ? ghostWidth : "calc(100% - 3px)",
                        height,
                        background: COLORS.paper,
                        border: `1px dashed ${a.hex}`,
                        borderLeft: `3px solid ${a.hex}`,
                        borderRadius: RADIUS,
                        fontSize: 10,
                        padding: "3px 6px",
                        zIndex: 2,
                        pointerEvents: "none",
                        boxShadow: "0 2px 8px rgba(0,0,0,0.12)",
                        overflow: "hidden",
                      }}
                    >
                      <div style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{t.title}</div>
                      <div style={{ fontSize: 9, color: COLORS.muted, marginTop: 1 }}>{fmtMinLabel(dragState.startMinutes)}</div>
                    </div>
                  );
                })()}
              </div>
            );
          })}
        </div>
        <div style={{ fontSize: 11, color: COLORS.muted, marginTop: 10, fontStyle: "italic" }}>
          Press and drag any task to reschedule — snaps to 15-minute steps. Double-click a task to edit it, or double-click a blank slot to add one.
          {singleDay && " Drag past the edge and hold to move to the next or previous day."}
        </div>
      </div>

      <div style={{ borderLeft: `1px solid ${COLORS.hairline}`, paddingLeft: 16 }}>
        <SectionLabel>Projects</SectionLabel>
        <div style={{ marginTop: 10 }}>
          {sortedProjects.map((p) => {
            const a = PROJECT_ACCENTS[p.accentIdx];
            return (
              <div
                key={p.id}
                onClick={() => onOpenProject(p.id)}
                style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8, cursor: "pointer" }}
              >
                <div style={{ width: 6, height: 6, borderRadius: "50%", background: a.hex, flexShrink: 0 }} />
                <div style={{ fontSize: 11.5, lineHeight: 1.3 }}>{p.name}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>

    {newTaskPrompt && (
      <div
        onClick={() => setNewTaskPrompt(null)}
        style={{
          position: "fixed",
          inset: 0,
          background: "rgba(17,17,17,0.35)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          zIndex: 2000,
        }}
      >
        <div
          onClick={(e) => e.stopPropagation()}
          style={{
            background: COLORS.paper,
            border: `1px solid ${COLORS.hairline}`,
            borderRadius: RADIUS,
            padding: 24,
            width: 320,
            boxShadow: "0 8px 28px rgba(0,0,0,0.18)",
          }}
        >
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 4 }}>New task</div>
          <div style={{ fontSize: 11.5, color: COLORS.muted, marginBottom: 16 }}>
            {new Date(newTaskPrompt.dayIso).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })} — {fmtMinLabel(newTaskPrompt.startMinutes)}
          </div>

          <div style={{ fontSize: 10.5, fontWeight: 600, color: COLORS.muted, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 6 }}>Task</div>
          <input
            autoFocus
            value={newTaskTitle}
            onChange={(e) => setNewTaskTitle(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submitNewTask(); if (e.key === "Escape") setNewTaskPrompt(null); }}
            placeholder="Type new task…"
            style={{
              width: "100%",
              background: COLORS.cream,
              border: `1px solid ${COLORS.hairline}`,
              borderRadius: RADIUS,
              padding: "9px 12px",
              fontSize: 13,
              fontFamily: "inherit",
              color: COLORS.ink,
              marginBottom: 14,
            }}
          />

          <div style={{ fontSize: 10.5, fontWeight: 600, color: COLORS.muted, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 6 }}>Project</div>
          <div style={{ position: "relative", marginBottom: 20 }}>
            <select
              value={newTaskProjectId}
              onChange={(e) => setNewTaskProjectId(e.target.value)}
              style={{
                width: "100%",
                background: COLORS.paper,
                border: `1px solid ${COLORS.ink}`,
                borderRadius: RADIUS,
                padding: "9px 28px 9px 12px",
                fontSize: 13,
                fontFamily: "inherit",
                fontWeight: 500,
                color: COLORS.ink,
                cursor: "pointer",
                appearance: "none",
                WebkitAppearance: "none",
              }}
            >
              {projects.map((p) => (
                <option key={p.id} value={p.id}>{p.name}</option>
              ))}
            </select>
            <DropdownArrow />
          </div>

          <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
            <button onClick={() => setNewTaskPrompt(null)} style={navBtnStyle}>Cancel</button>
            <button
              onClick={submitNewTask}
              style={{ ...navBtnStyle, background: COLORS.ink, color: COLORS.paper, border: `1px solid ${COLORS.ink}` }}
            >
              Add task
            </button>
          </div>
        </div>
      </div>
    )}

    {editDraft && (
      <div
        onClick={() => setEditDraft(null)}
        style={{
          position: "fixed",
          inset: 0,
          background: "rgba(17,17,17,0.35)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          zIndex: 2000,

      >
        <div
          onClick={(e) => e.stopPropagation()}
          style={{
            background: COLORS.paper,
            border: `1px solid ${COLORS.hairline}`,
            borderRadius: RADIUS,
            padding: 24,
            width: 320,
            boxShadow: "0 8px 28px rgba(0,0,0,0.18)",
          }}
        >
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 16 }}>Edit task</div>

          <div style={{ fontSize: 10.5, fontWeight: 600, color: COLORS.muted, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 6 }}>Task</div>
          <input
            autoFocus
            value={editDraft.title}
            onChange={(e) => setEditDraft((prev) => ({ ...prev, title: e.target.value }))}
            onKeyDown={(e) => { if (e.key === "Enter") saveEditTask(); if (e.key === "Escape") setEditDraft(null); }}
            placeholder="Task title…"
            style={{
              width: "100%",
              background: COLORS.cream,
              border: `1px solid ${COLORS.hairline}`,
              borderRadius: RADIUS,
              padding: "9px 12px",
              fontSize: 13,
              fontFamily: "inherit",
              color: COLORS.ink,
              marginBottom: 14,
            }}
          />

          <div style={{ fontSize: 10.5, fontWeight: 600, color: COLORS.muted, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 6 }}>Project</div>
          <div style={{ position: "relative", marginBottom: 14 }}>
            <select
              value={editDraft.projectId}
              onChange={(e) => setEditDraft((prev) => ({ ...prev, projectId: e.target.value }))}
              style={{
                width: "100%",
                background: COLORS.paper,
                border: `1px solid ${COLORS.ink}`,
                borderRadius: RADIUS,
                padding: "9px 28px 9px 12px",
                fontSize: 13,
                fontFamily: "inherit",
                fontWeight: 500,
                color: COLORS.ink,
                cursor: "pointer",
                appearance: "none",
                WebkitAppearance: "none",
              }}
            >
              {sortedProjects.map((p) => (
                <option key={p.id} value={p.id}>{p.name}</option>

            </select>
            <DropdownArrow />
          </div>

          <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 10.5, fontWeight: 600, color: COLORS.muted, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 6 }}>Date</div>
              <input
                type="date"
                value={editDraft.dateStr}
                onChange={(e) => setEditDraft((prev) => ({ ...prev, dateStr: e.target.value }))}
                style={{
                  width: "100%",
                  background: COLORS.cream,
                  border: `1px solid ${COLORS.hairline}`,
                  borderRadius: RADIUS,
                  padding: "8px 10px",
                  fontSize: 12.5,
                  fontFamily: "inherit",
                  color: COLORS.ink,
                }}
              />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 10.5, fontWeight: 600, color: COLORS.muted, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 6 }}>Time</div>
              <input
                type="time"
                value={editDraft.timeStr}
                onChange={(e) => setEditDraft((prev) => ({ ...prev, timeStr: e.target.value }))}
                style={{
                  width: "100%",
                  background: COLORS.cream,
                  border: `1px solid ${COLORS.hairline}`,
                  borderRadius: RADIUS,
                  padding: "8px 10px",
                  fontSize: 12.5,
                  fontFamily: "inherit",
                  color: COLORS.ink,
                }}
              />
            </div>
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <button
              onClick={deleteEditTask}
              style={{ ...navBtnStyle, color: COLORS.tomato, borderColor: COLORS.tomato }}

              Delete

            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setEditDraft(null)} style={navBtnStyle}>Cancel</button>
              <button
                onClick={saveEditTask}

    </>
  );
}

/* ---------- Project List View ---------- */
function ProjectListView({ projects, setProjects, tasks, onOpenProject }) {
  const viewport = useViewport();
  const [statusFilter, setStatusFilter] = useState("All");
  const [sortCol, setSortCol] = useState("Title");
  const [sortDir, setSortDir] = useState(1); // 1 = default direction for that column, -1 = reversed
  const [newProjectText, setNewProjectText] = useState("");
  const [editingField, setEditingField] = useState(null); // { projectId, field } | null

  const updateProject = (projectId, field, value) => {
    setProjects((prev) => prev.map((p) => (p.id === projectId ? { ...p, [field]: value } : p)));
  };

  const deriveStatus = (projectId) => {
    const pTasks = tasks.filter((t) => t.projectId === projectId);
    if (pTasks.length === 0) return "Not Started";
    if (pTasks.every((t) => t.completed)) return "Completed";
    if (pTasks.some((t) => t.completed)) return "In Progress";
    return "Not Started";
  };

  const nextTaskDate = (projectId) => {
    const upcoming = tasks.filter((t) => t.projectId === projectId && !t.completed).sort((a, b) => a.date - b.date);
    return upcoming.length ? upcoming[0].date : null;
  };

  const priorityOf = (project) => project.priority || (PROJECT_META[project.id] && PROJECT_META[project.id].priority) || "—";
  const priorityRank = { High: 0, Medium: 1, Low: 2, "—": 3 };
  const statusRank = { "Not Started": 0, "In Progress": 1, Completed: 2 };

  const filtered = projects.filter((p) => {
    const status = deriveStatus(p.id);
    return statusFilter === "All" || status === statusFilter;
  });

  const columns = [
    { key: "Title", label: "Project" },
    { key: "Status", label: "Status" },
    { key: "Priority", label: "Priority" },
    { key: "Next task", label: "Next task" },
    { key: "Date added", label: "Date added" },
  ];

  const compare = (a, b) => {
    if (sortCol === "Title") return a.name.localeCompare(b.name);
    if (sortCol === "Status") return statusRank[deriveStatus(a.id)] - statusRank[deriveStatus(b.id)];
    if (sortCol === "Priority") return priorityRank[priorityOf(a)] - priorityRank[priorityOf(b)];
    if (sortCol === "Next task") {
      const da = nextTaskDate(a.id);
      const db = nextTaskDate(b.id);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da - db; // soonest first
    }
    if (sortCol === "Date added") {
      const da = a.dateAdded ? new Date(a.dateAdded) : new Date(0);
      const db = b.dateAdded ? new Date(b.dateAdded) : new Date(0);
      return db - da; // latest first
    }
    return 0;
  };

  const sorted = [...filtered].sort((a, b) => compare(a, b) * sortDir);

  const handleHeaderClick = (key) => {
    if (sortCol === key) {
      setSortDir((d) => d * -1);
    } else {
      setSortCol(key);
      setSortDir(1);
    }
  };

  const submitNewProject = () => {
    const name = newProjectText.trim();
    if (!name) return;
    const usedAccents = new Set(projects.map((p) => p.accentIdx));
    let nextAccent = 0;
    for (let i = 0; i < PROJECT_ACCENTS.length; i++) {
      if (!usedAccents.has(i)) { nextAccent = i; break; }
      nextAccent = (projects.length) % PROJECT_ACCENTS.length;
    }
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") + "-" + Date.now();
    const todayIso = appToday().toISOString().slice(0, 10);
    setProjects((prev) => [...prev, { id, name, accentIdx: nextAccent, icon: nextProjectIcon(projects.length), dateAdded: todayIso }]);
    setNewProjectText("");
  };

  const fmtShort = (d) => (d ? `${MONTH_NAMES[d.getMonth()].slice(0, 3).toUpperCase()} ${String(d.getDate()).padStart(2, "0")}, ${d.getFullYear()}` : "—");
  const fmtShortIso = (iso) => (iso ? fmtShort(new Date(iso + "T00:00:00")) : "—");

  return (
    <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 24 }}>
      <FilterDropdown label="Status" value={statusFilter} onChange={setStatusFilter} options={["All", "Completed", "In Progress", "Not Started"]} />

      <div style={{ marginTop: 20 }}>
        {/* Table header on tablet/desktop — click to sort, click again to
            reverse. Five fixed-width columns can't fit a phone screen
            without breaking, so phone gets a Sort-by dropdown instead and
            each row becomes a stacked card further down. */}
        {viewport.isPhone ? (
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 4px 12px", borderBottom: `1px solid ${COLORS.hairline}`, marginBottom: 4 }}>
            <span style={{ fontSize: 10, fontWeight: 600, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.05em" }}>Sort by</span>
            <select
              value={sortCol}
              onChange={(e) => { setSortCol(e.target.value); setSortDir(1); }}
              style={{ fontSize: 12, fontFamily: "inherit", background: COLORS.cream, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "5px 8px", color: COLORS.ink }}
            >
              {columns.map((col) => <option key={col.key} value={col.key}>{col.label}</option>)}
            </select>
            <button
              onClick={() => setSortDir((d) => d * -1)}
              title="Reverse sort order"
              style={{ background: "none", border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "5px 9px", fontSize: 11, color: COLORS.ink, cursor: "pointer" }}
            >
              {sortDir === 1 ? "▼" : "▲"}
            </button>
          </div>
        ) : (
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "1fr 110px 90px 140px 140px",
              gap: 12,
              padding: "0 16px 8px",
              borderBottom: `1px solid ${COLORS.hairline}`,
            }}
          >
            {columns.map((col, i) => {
              const active = sortCol === col.key;
              return (
                <div
                  key={col.key}
                  onClick={() => handleHeaderClick(col.key)}
                  style={{
                    fontSize: 10,
                    fontWeight: 600,
                    color: active ? COLORS.ink : COLORS.muted,
                    letterSpacing: "0.06em",
                    textTransform: "uppercase",
                    textAlign: i === 0 ? "left" : "right",
                    cursor: "pointer",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: i === 0 ? "flex-start" : "flex-end",
                    gap: 4,
                    userSelect: "none",
                  }}
                >
                  {i !== 0 && active && <span style={{ fontSize: 9 }}>{sortDir === 1 ? "▼" : "▲"}</span>}
                  {col.label}
                  {i === 0 && active && <span style={{ fontSize: 9 }}>{sortDir === 1 ? "▼" : "▲"}</span>}
                </div>
              );
            })}
          </div>
        )}

        {sorted.map((p) => {
          const a = PROJECT_ACCENTS[p.accentIdx];
          const status = deriveStatus(p.id);
          const priority = priorityOf(p);
          const next = nextTaskDate(p.id);
          const isEditingPriority = editingField && editingField.projectId === p.id && editingField.field === "priority";
          const isEditingDate = editingField && editingField.projectId === p.id && editingField.field === "dateAdded";

          if (viewport.isPhone) {
            // Card layout: name+status on top, then the same editable
            // priority/next-task/date-added fields as labeled chips below —
            // all the same interactions as the table row, just stacked.
            return (
              <div
                key={p.id}
                onClick={() => onOpenProject(p.id)}
                style={{
                  borderLeft: `4px solid ${a.hex}`,
                  borderBottom: `1px solid ${COLORS.hairline}`,
                  padding: "12px 14px",
                  cursor: "pointer",
                }}
              >
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8 }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, fontWeight: 700, letterSpacing: "0.01em", minWidth: 0 }}>
                    <ProjectIcon icon={p.icon} color={a.hex} size={16} />
                    <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</span>
                  </span>
                  <span style={{ fontSize: 10.5, color: COLORS.muted, fontWeight: 600, letterSpacing: "0.03em", flexShrink: 0 }}>{status}</span>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 16px", fontSize: 11.5 }}>
                  <div>
                    <span style={{ color: COLORS.muted, marginRight: 4 }}>Priority:</span>
                    {isEditingPriority ? (
                      <select
                        autoFocus
                        value={p.priority || ""}
                        onClick={(e) => e.stopPropagation()}
                        onChange={(e) => { updateProject(p.id, "priority", e.target.value); setEditingField(null); }}
                        onBlur={() => setEditingField(null)}
                        style={{ fontSize: 11, background: COLORS.cream, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "2px 5px", fontFamily: "inherit", color: COLORS.ink }}
                      >
                        <option value="">—</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                      </select>
                    ) : (
                      <span onClick={(e) => { e.stopPropagation(); setEditingField({ projectId: p.id, field: "priority" }); }} style={{ cursor: "text" }}>
                        {priority}
                      </span>
                    )}
                  </div>
                  <div>
                    <span style={{ color: COLORS.muted, marginRight: 4 }}>Next:</span>
                    {fmtShort(next)}
                  </div>
                  <div>
                    <span style={{ color: COLORS.muted, marginRight: 4 }}>Added:</span>
                    {isEditingDate ? (
                      <input
                        autoFocus
                        type="date"
                        value={p.dateAdded || ""}
                        onClick={(e) => e.stopPropagation()}
                        onChange={(e) => updateProject(p.id, "dateAdded", e.target.value)}
                        onBlur={() => setEditingField(null)}
                        onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingField(null); }}
                        style={{ fontSize: 11, background: COLORS.cream, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "2px 5px", fontFamily: "inherit", color: COLORS.ink }}
                      />
                    ) : (
                      <span onClick={(e) => { e.stopPropagation(); setEditingField({ projectId: p.id, field: "dateAdded" }); }} style={{ cursor: "text" }}>
                        {fmtShortIso(p.dateAdded)}
                      </span>
                    )}
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div
              key={p.id}
              onClick={() => onOpenProject(p.id)}
              style={{
                display: "grid",
                gridTemplateColumns: "1fr 110px 90px 140px 140px",
                gap: 12,
                alignItems: "center",
                borderLeft: `4px solid ${a.hex}`,
                borderBottom: `1px solid ${COLORS.hairline}`,
                padding: "12px 16px",
                cursor: "pointer",
              }}
            >
              <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, fontWeight: 700, letterSpacing: "0.01em" }}>
                <ProjectIcon icon={p.icon} color={a.hex} size={16} />
                {p.name}
              </span>
              <span style={{ fontSize: 11, color: COLORS.muted, fontWeight: 600, letterSpacing: "0.03em", textAlign: "right" }}>{status}</span>

              {isEditingPriority ? (
                <select
                  autoFocus
                  value={p.priority || ""}
                  onClick={(e) => e.stopPropagation()}
                  onChange={(e) => { updateProject(p.id, "priority", e.target.value); setEditingField(null); }}
                  onBlur={() => setEditingField(null)}
                  style={{
                    fontSize: 11,
                    textAlign: "right",
                    background: COLORS.cream,
                    border: `1px solid ${COLORS.hairline}`,
                    borderRadius: RADIUS,
                    padding: "3px 6px",
                    fontFamily: "inherit",
                    color: COLORS.ink,
                  }}
                >
                  <option value="">—</option>
                  <option value="High">High</option>
                  <option value="Medium">Medium</option>
                  <option value="Low">Low</option>
                </select>
              ) : (
                <span
                  onClick={(e) => { e.stopPropagation(); setEditingField({ projectId: p.id, field: "priority" }); }}
                  style={{ fontSize: 11, color: COLORS.muted, textAlign: "right", cursor: "text" }}
                >
                  {priority}
                </span>
              )}

              <span style={{ fontSize: 11, color: COLORS.muted, textAlign: "right" }}>{fmtShort(next)}</span>

              {isEditingDate ? (
                <input
                  autoFocus
                  type="date"
                  value={p.dateAdded || ""}
                  onClick={(e) => e.stopPropagation()}
                  onChange={(e) => updateProject(p.id, "dateAdded", e.target.value)}
                  onBlur={() => setEditingField(null)}
                  onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingField(null); }}
                  style={{
                    fontSize: 11,
                    textAlign: "right",
                    background: COLORS.cream,
                    border: `1px solid ${COLORS.hairline}`,
                    borderRadius: RADIUS,
                    padding: "3px 6px",
                    fontFamily: "inherit",
                    color: COLORS.ink,
                    width: "100%",
                  }}
                />
              ) : (
                <span
                  onClick={(e) => { e.stopPropagation(); setEditingField({ projectId: p.id, field: "dateAdded" }); }}
                  style={{ fontSize: 11, color: COLORS.muted, textAlign: "right", cursor: "text" }}
                >
                  {fmtShortIso(p.dateAdded)}
                </span>
              )}
            </div>
          );
        })}

        <input
          value={newProjectText}
          onChange={(e) => setNewProjectText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submitNewProject(); }}
          placeholder="Start typing to add new project…"
          style={{
            width: "100%",
            background: COLORS.cream,
            border: `1px solid ${COLORS.hairline}`,
            borderRadius: RADIUS,
            padding: "12px 16px",
            fontSize: 14,
            fontFamily: "inherit",
            color: COLORS.ink,
            marginTop: 10,
          }}
        />
      </div>
    </div>
  );
}

/* ---------- Task List View ---------- */
function TaskListView({ projects, tasks, setTasks, onOpenProject }) {
  const [statusFilter, setStatusFilter] = useState("All");
  // Only one task editable at a time, identified by id — matches the pattern
  // used in CategoryTaskTable elsewhere in the app.
  const [editingId, setEditingId] = useState(null);
  const editingRowRef = React.useRef(null);

  // Clicking outside the row being edited commits and closes it, same as
  // pressing Enter/Escape — mirrors CategoryTaskTable's behavior.
  React.useEffect(() => {
    if (!editingId) return;
    const handleOutsideClick = (e) => {
      if (editingRowRef.current && !editingRowRef.current.contains(e.target)) {
        setEditingId(null);
      }
    };
    document.addEventListener("pointerdown", handleOutsideClick);
    return () => document.removeEventListener("pointerdown", handleOutsideClick);
  }, [editingId]);

  const toggleTask = (taskId) => {
    setTasks((prev) => prev.map((t) => (t.id === taskId ? { ...t, completed: !t.completed } : t)));
  };

  const updateTaskField = (taskId, field, value) => {
    setTasks((prev) => prev.map((t) => (t.id === taskId ? { ...t, [field]: value } : t)));
  };

  // Active tasks first (earliest due date/time first), completed tasks sink
  // to the bottom of their group once checked off, rather than disappearing
  // into wherever they happened to sit in the original array order.
  const sortForDisplay = (list) => {
    const active = list.filter((t) => !t.completed);
    const completed = list.filter((t) => t.completed);
    const byDue = (a, b) => {
      const dateDiff = (a.date || 0) - (b.date || 0);
      if (dateDiff !== 0) return dateDiff;
      return (a.startMinutes ?? 0) - (b.startMinutes ?? 0);
    };
    return [...active.sort(byDue), ...completed.sort(byDue)];
  };

  // Alphabetical by project name, per Jenny's request — previously followed
  // whatever order `projects` happened to be in.
  const sortedProjects = [...projects].sort((a, b) => a.name.localeCompare(b.name));

  return (
    <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 24 }}>
      <FilterDropdown label="Status" value={statusFilter} onChange={setStatusFilter} options={["All", "Completed", "In Progress", "Not Started"]} />

      <div style={{ marginTop: 20, display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 16 }}>
        {sortedProjects.map((p) => {
          const a = PROJECT_ACCENTS[p.accentIdx];
          const pTasks = tasks.filter((t) => t.projectId === p.id);
          const visible = statusFilter === "All" ? pTasks : pTasks.filter((t) => (statusFilter === "Completed" ? t.completed : !t.completed));
          const craftTasks = sortForDisplay(visible.filter((t) => t.category === "craft"));
          const contentTasks = sortForDisplay(visible.filter((t) => t.category === "content"));
          const otherTasks = sortForDisplay(visible.filter((t) => t.category !== "craft" && t.category !== "content"));

          const renderTaskRow = (t) => {
            const isEditing = editingId === t.id;
            return (
              <div
                key={t.id}
                ref={isEditing ? editingRowRef : null}
                style={{ display: "flex", alignItems: "flex-start", gap: 8, marginBottom: 9 }}
              >
                {/* Checkbox only ever toggles completion — never opens edit mode. */}
                <input
                  type="checkbox"
                  checked={t.completed}
                  onChange={() => toggleTask(t.id)}
                  style={{ marginTop: 2, accentColor: a.hex, cursor: "pointer", flexShrink: 0 }}
                />
                <div style={{ flex: 1, minWidth: 0 }}>
                  {isEditing ? (
                    <input
                      autoFocus
                      value={t.title}
                      onChange={(e) => updateTaskField(t.id, "title", e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingId(null); }}
                      style={{
                        width: "100%",
                        background: COLORS.cream,
                        border: `1px solid ${COLORS.hairline}`,
                        borderRadius: RADIUS,
                        padding: "3px 6px",
                        fontSize: 12.5,
                        fontFamily: "inherit",
                        color: COLORS.ink,
                      }}
                    />
                  ) : (
                    // Clicking the task text opens edit mode — clicking the
                    // checkbox above is the only way to check it off.
                    <span
                      onClick={() => setEditingId(t.id)}
                      style={{
                        fontSize: 12.5,
                        textDecoration: t.completed ? "line-through" : "none",
                        opacity: t.completed ? 0.45 : 1,
                        cursor: "text",
                        display: "block",
                      }}
                    >
                      {t.title}
                    </span>
                  )}

                  {isEditing ? (
                    <div style={{ display: "flex", gap: 5, marginTop: 4 }}>
                      <input
                        type="date"
                        value={dateToInputStr(t.date)}
                        onChange={(e) => updateTaskField(t.id, "date", e.target.value ? new Date(e.target.value + "T00:00:00") : t.date)}
                        onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingId(null); }}
                        style={{
                          background: COLORS.cream,
                          border: `1px solid ${COLORS.hairline}`,

                style={{ fontWeight: 700, fontSize: 12.5, marginBottom: 12, letterSpacing: "0.02em", cursor: "pointer" }}
              >
                {p.name}
              </div>

              {craftTasks.length > 0 && (
                <div>
                  {renderSubheader("ti-brush", "Craft")}
                  {craftTasks.map(renderTaskRow)}
                </div>
              )}

              {contentTasks.length > 0 && (
                <div>
                  {renderSubheader("ti-movie", "Content")}
                  {contentTasks.map(renderTaskRow)}
                </div>
              )}

              {otherTasks.length > 0 && (
                <div>
                  {(craftTasks.length > 0 || contentTasks.length > 0) && renderSubheader("ti-dots", "Other")}
                  {otherTasks.map(renderTaskRow)}
                </div>
              )}

              {visible.length === 0 && <div style={{ fontSize: 12, color: COLORS.muted }}>No tasks</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---- Product page (per-project final listing spec sheet) ----
// Field names deliberately mirror StoreCo's PIECES model (title/price/
// description/materials/dimensions) so this record can feed StoreCo, and
// eventually a real Shopify product, without renaming anything.
//
// Inventory is always tracked as `units` — a single piece is just a batch
// of one. "Sold" is never a manual status; it's derived from how many
// units are marked sold, so there's exactly one place this can drift out
// of sync from reality. This record is also the one source of truth for
// quantity/sold counts — the Sales board reads and mirrors it rather than
// keeping its own separate counter.
const DEFAULT_PRODUCT = {
  name: "",
  photos: [], // { id, dataUrl }
  primaryPhotoId: null,
  dimensions: "",
  itemWeight: "",
  shippingWeight: "",
  colors: [], // { id, hex, label }
  price: "",
  materials: "",
  careTags: [],
  notes: "",
  description: "",
  sku: "",
  status: "draft", // draft | ready | listed  — listing workflow only, not sold state
  includeOnStoreCo: false,
  isBatch: false,
  batchSize: 1,
  units: [{ id: "unit-1", sold: false, soldDate: null }],
};
const CARE_TAG_OPTIONS = [
  "Food safe",
  "Dishwasher safe",
  "Microwave safe",
  "Oven safe",
  "Hand wash only",
  "Not for hot liquids",
  "Decorative only",
];
const PRODUCT_STATUS_OPTIONS = [
  { value: "draft", label: "Draft" },
  { value: "ready", label: "Ready to list" },
  { value: "listed", label: "Listed" },
];

// Resizes the units array to match a new batch size, preserving the sold
// state of existing units at each index rather than resetting everything —
// growing a batch shouldn't un-sell anything, and shrinking it only drops
// units off the end.
function resizeUnits(existing, size) {
  const next = [];
  for (let i = 0; i < size; i++) {
    next.push(existing[i] || { id: "unit-" + (i + 1), sold: false, soldDate: null });
  }
  return next;
}

// Product records saved before batch tracking existed won't have `units` —
// migrate them in place rather than silently dropping whatever the person
// already entered (their old manual "Sold" status becomes unit 1's state).
function normalizeProduct(raw) {
  if (!raw) return DEFAULT_PRODUCT;
  if (raw.units) return raw;
  const legacySold = raw.status === "sold";
  return {
    ...DEFAULT_PRODUCT,
    ...raw,
    status: legacySold ? "listed" : (raw.status || "draft"),
    isBatch: false,
    batchSize: 1,
    units: [{ id: "unit-1", sold: legacySold, soldDate: null }],
  };
}

// Downscales an uploaded image before it's stored, since photos are kept as
// base64 in localStorage (no backend yet) and full-size camera files would
// burn through that budget after just a few pieces.
function resizeImageFile(file, maxDim) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not read image"));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function ProductPage({ project, content, setContent, onBack }) {
  const viewport = useViewport();

  if (!project) return null;

  const handleFiles = async (fileList) => {
    const files = Array.from(fileList || []).filter((f) => f.type.startsWith("image/"));
    if (files.length === 0) return;
    setUploading(true);
    try {
      const newPhotos = [];
      for (const file of files) {
        const dataUrl = await resizeImageFile(file, 1000);
        newPhotos.push({ id: "photo-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), dataUrl });
      }
      setContent((prev) => ({
        ...prev,
        photos: [...prev.photos, ...newPhotos],
        primaryPhotoId: prev.primaryPhotoId || newPhotos[0].id,
      }));
    } finally {
      setUploading(false);
    }
  };

  const removePhoto = (id) => {
    setContent((prev) => {
      const photos = prev.photos.filter((p) => p.id !== id);
      const primaryPhotoId = prev.primaryPhotoId === id ? (photos[0] ? photos[0].id : null) : prev.primaryPhotoId;
      return { ...prev, photos, primaryPhotoId };

            <button
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              disabled={uploading}
              style={{
                width: 64, height: 64, borderRadius: RADIUS, border: `1px dashed ${COLORS.hairline}`,
                background: "none", color: COLORS.muted, fontSize: 20, cursor: uploading ? "default" : "pointer",
                display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "inherit",
              }}

              {uploading ? "…" : "+"}

            <input
              ref={fileInputRef}
              type="file"
              accept="image/*"
              multiple
              onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }}
              style={{ display: "none" }}
            />
          </div>
        </div>
        {content.photos.length === 0 && (
          <div style={{ fontSize: 11.5, color: COLORS.muted, marginTop: 8, fontStyle: "italic" }}>No photos yet — click + to add some.</div>
        )}
      </div>

      {/* Core details */}
      <div style={sectionStyle}>
        <div style={{ display: "grid", gridTemplateColumns: viewport.isPhone ? "1fr" : "1fr 1fr", gap: 14, marginBottom: 14 }}>
          <div>
            <div style={labelStyle}>Name</div>
            <input value={content.name} onChange={(e) => update("name", e.target.value)} placeholder={project.name} style={fieldStyle} />
          </div>
          <div>
            <div style={labelStyle}>Price</div>
            <input
              type="number" min="0" step="0.01"
              value={content.price}
              onChange={(e) => update("price", e.target.value)}
              placeholder="0.00"
              style={fieldStyle}
            />
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: viewport.isPhone ? "1fr" : "1fr 1fr 1fr", gap: 14, marginBottom: 14 }}>
          <div>
            <div style={labelStyle}>Dimensions</div>
            <input value={content.dimensions} onChange={(e) => update("dimensions", e.target.value)} placeholder={'e.g. 6" tall x 4" wide'} style={fieldStyle} />
          </div>
          <div>
            <div style={labelStyle}>Item weight</div>
            <input value={content.itemWeight} onChange={(e) => update("itemWeight", e.target.value)} placeholder="e.g. 1.2 lb" style={fieldStyle} />
          </div>
          <div>
            <div style={labelStyle}>Packaged / shipping weight</div>
            <input value={content.shippingWeight} onChange={(e) => update("shippingWeight", e.target.value)} placeholder="e.g. 2.5 lb" style={fieldStyle} />
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: viewport.isPhone ? "1fr" : "1fr 1fr", gap: 14 }}>
          <div>
            <div style={labelStyle}>Materials</div>
            <input value={content.materials} onChange={(e) => update("materials", e.target.value)} placeholder="e.g. Stoneware, celadon glaze" style={fieldStyle} />
          </div>
          <div>
            <div style={labelStyle}>SKU</div>
            <input value={content.sku} onChange={(e) => update("sku", e.target.value)} placeholder={project.id} style={fieldStyle} />
          </div>
        </div>
      </div>

      {/* Color */}
      <div style={sectionStyle}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={labelStyle}>Color</div>
          <button
            onClick={addColor}
            style={{ background: "none", border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "3px 10px", fontSize: 11, fontWeight: 600, fontFamily: "inherit", color: COLORS.ink, cursor: "pointer" }}
          >
            + Add color
          </button>
        </div>
        {content.colors.length === 0 && (
          <div style={{ fontSize: 11.5, color: COLORS.muted, fontStyle: "italic" }}>No colors added yet.</div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {content.colors.map((c) => (
            <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <ColorPickerPopover value={c.hex} onChange={(hex) => updateColor(c.id, "hex", hex)} />
              <input
                value={c.label}
                onChange={(e) => updateColor(c.id, "label", e.target.value)}
                placeholder="e.g. Celadon green"
                style={{ ...fieldStyle, flex: 1 }}
              />
              <button
                onClick={() => removeColor(c.id)}
                title="Remove color"
                style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontSize: 15, padding: 4 }}
              >
                ×
              </button>
            </div>
          ))}
        </div>
      </div>

      {/* Care & safety */}
      <div style={sectionStyle}>
        <div style={labelStyle}>Care & safety</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 8, marginBottom: 14 }}>
          {CARE_TAG_OPTIONS.map((tag) => {
            const active = content.careTags.includes(tag);
            return (
              <button
                key={tag}
                onClick={() => toggleCareTag(tag)}
                style={{
                  fontFamily: "inherit", fontSize: 11.5, fontWeight: 600, padding: "6px 12px", borderRadius: RADIUS, cursor: "pointer",
                  background: active ? COLORS.ink : "none", color: active ? COLORS.paper : COLORS.muted,
                  border: `1px solid ${active ? COLORS.ink : COLORS.hairline}`,
                }}
              >
                {tag}
              </button>
            );
          })}
        </div>
        <div style={labelStyle}>Other notes</div>
        <textarea
          value={content.notes}
          onChange={(e) => update("notes", e.target.value)}
          placeholder="Anything else a buyer should know — care quirks, fragility, one-of-a-kind variation…"
          style={{ ...fieldStyle, minHeight: 60, resize: "vertical", marginTop: 5 }}
        />
      </div>

      {/* Listing copy */}
      <div style={sectionStyle}>
        <div style={labelStyle}>Listing description</div>
        <div style={{ fontSize: 11, color: COLORS.muted, marginBottom: 6 }}>The story/marketing copy that appears on StoreCo and in listings.</div>
        <textarea
          value={content.description}
          onChange={(e) => update("description", e.target.value)}
          placeholder="A sentence or two about this piece…"
          style={{ ...fieldStyle, minHeight: 80, resize: "vertical" }}
        />
      </div>

      {/* Inventory — the one place quantity/sold state lives. Sales board
          reads and mirrors this rather than keeping its own counter. */}

          <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, cursor: "pointer" }}>
            <input
              type="checkbox"
              checked={content.isBatch}
              onChange={(e) => {
                const isBatch = e.target.checked;
                setContent((prev) => {
                  const size = isBatch ? Math.max(2, prev.batchSize) : 1;
                  return { ...prev, isBatch, batchSize: size, units: resizeUnits(prev.units, size) };
                });
              }}
              style={{ width: 14, height: 14, cursor: "pointer" }}
            />

          </label>
        </div>

        {content.isBatch && (
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
