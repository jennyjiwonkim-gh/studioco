              value={content.batchSize}
              onChange={(e) => {
                const size = Math.max(1, parseInt(e.target.value, 10) || 1);
                setContent((prev) => ({ ...prev, batchSize: size, units: resizeUnits(prev.units, size) }));
              }}
              style={{ ...fieldStyle, width: 70 }}
            />
          </div>
        )}

        {content.isBatch && (
          <div style={{ fontSize: 11.5, color: COLORS.muted, marginBottom: 10 }}>
            {content.units.filter((u) => u.sold).length} of {content.units.length} sold
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {content.units.map((u, i) => (
            <UnitRow
              key={u.id}
              label={content.isBatch ? `Unit ${i + 1}` : "This piece"}
              unit={u}
              accentHex={a.hex}
              fieldStyle={fieldStyle}
              onToggle={() => setContent((prev) => ({
                ...prev,
                units: prev.units.map((x) => x.id !== u.id ? x : (
                  x.sold ? { ...x, sold: false, soldDate: null } : { ...x, sold: true, soldDate: x.soldDate || appToday().toISOString().slice(0, 10) }
                )),
              }))}
              onDateChange={(value) => setContent((prev) => ({
                ...prev,
                units: prev.units.map((x) => x.id === u.id ? { ...x, soldDate: value } : x),
              }))}
            />
          ))}
        </div>
      </div>

      {/* Status */}
      <div style={sectionStyle}>
        <div style={{ display: "grid", gridTemplateColumns: viewport.isPhone ? "1fr" : "1fr 1fr", gap: 14, alignItems: "start" }}>
          <div>
            <div style={labelStyle}>Status</div>
            <select value={content.status} onChange={(e) => update("status", e.target.value)} style={{ ...fieldStyle, cursor: "pointer" }}>
              {PRODUCT_STATUS_OPTIONS.map((s) => <option key={s.value} value={s.value}>{s.label}</option>)}
            </select>
          </div>
          <div>
            <div style={labelStyle}>StoreCo</div>
            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, cursor: "pointer", marginTop: 8 }}>
              <input
                type="checkbox"
                checked={content.includeOnStoreCo}
                onChange={(e) => update("includeOnStoreCo", e.target.checked)}
                style={{ width: 15, height: 15, cursor: "pointer" }}
              />
              Include on public storefront when connected
            </label>
          </div>
        </div>
      </div>
    </div>
  );
}

// A single trackable unit — used for both single pieces (one row) and each
// unit in a batch, so there's exactly one implementation of "mark sold".
function UnitRow({ label, unit, accentHex, fieldStyle, onToggle, onDateChange }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 10px", border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, background: COLORS.cream }}>
      <button
        onClick={onToggle}
        style={{
          fontFamily: "inherit", fontSize: 11, fontWeight: 700, padding: "4px 10px", borderRadius: RADIUS, cursor: "pointer",
          background: unit.sold ? accentHex : "none", color: unit.sold ? COLORS.paper : COLORS.muted,
          border: `1px solid ${unit.sold ? accentHex : COLORS.hairline}`, minWidth: 78, textAlign: "center",
        }}
      >
        {unit.sold ? "Sold" : "Available"}
      </button>
      <div style={{ fontSize: 12.5, fontWeight: 600, flex: 1 }}>{label}</div>
      {unit.sold && (
        <input
          type="date"
          value={unit.soldDate || ""}
          onChange={(e) => onDateChange(e.target.value)}
          style={{ ...fieldStyle, width: 140 }}
        />
      )}
    </div>
  );
}

/* ============ BOARD SCREEN (shared shell for all 8 pipeline boards) ============ */
function BoardScreen({ projectId, boardKey, projects, onBack, onSwitchProject, onSwitchBoard, onOpenProduct, boardContent, setBoardContent, tasks, setTasks, contentLibrary, setContentLibrary, campaignLibrary, setCampaignLibrary, contacts, setContacts }) {
  const project = projects.find((p) => p.id === projectId);
  const board = BOARD_STAGES.find((b) => b.key === boardKey);
  if (!project || !board) return null;
  const a = PROJECT_ACCENTS[project.accentIdx];
  const contentKey = projectId + ":" + boardKey;

  return (
    <div style={{ padding: "28px 32px 64px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
        <FilterDropdown
          label="Board"
          value={boardKey}
          onChange={onSwitchBoard}
          options={BOARD_STAGES.map((b) => b.key)}
          renderOption={(key) => {
            const idx = BOARD_STAGES.findIndex((b) => b.key === key);
            return String(idx + 1).padStart(2, "0") + " " + BOARD_STAGES[idx].label;
          }}
        />

        <div style={{ position: "relative" }}>
          <select
            value={projectId}
            onChange={(e) => onSwitchProject(e.target.value)}
            style={{
              background: COLORS.paper,
              border: `1px solid ${COLORS.ink}`,
              borderRadius: RADIUS,
              padding: "7px 30px 7px 12px",
              fontSize: 13,
              fontFamily: "inherit",
              fontWeight: 700,
              color: COLORS.ink,
              cursor: "pointer",
              appearance: "none",
              WebkitAppearance: "none",
            }}
          >
            {projects.map((p) => (
              <option key={p.id} value={p.id}>{p.name}</option>
            ))}
          </select>
          <DropdownArrow />
        </div>
      </div>

      <div style={{ borderTop: `3px solid ${a.hex}`, background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, overflow: "hidden" }}>
        {boardKey === "planning" ? (
          <PlanningBoard
            content={boardContent[contentKey] || { canvasItems: [], ideas: [] }}
            setContent={(updater) => setBoardContent((prev) => {
              const current = prev[contentKey] || { canvasItems: [], ideas: [] };
              const next = typeof updater === "function" ? updater(current) : updater;
              return { ...prev, [contentKey]: next };
            })}
            accentHex={a.hex}
          />
        ) : boardKey === "making" ? (
          <MakingOfBoard
            allTasks={tasks}
            setAllTasks={setTasks}
            currentProjectId={projectId}
            accentHex={a.hex}
            projects={projects}
            sourcingItems={boardContent[projectId + ":sourcing"] || []}
            setSourcingItems={(updater) => setBoardContent((prev) => {
              const sourcingKey = projectId + ":sourcing";
              const current = prev[sourcingKey] || [];
              const next = typeof updater === "function" ? updater(current) : updater;
              return { ...prev, [sourcingKey]: next };
            })}
          />
        ) : boardKey === "content" ? (
          <ContentBoard
            boardData={boardContent[contentKey] || { pieces: [] }}
            setBoardData={(updater) => setBoardContent((prev) => {
              const current = prev[contentKey] || { pieces: [] };
              const next = typeof updater === "function" ? updater(current) : updater;
              return { ...prev, [contentKey]: next };
            })}
            allTasks={tasks}
            setAllTasks={setTasks}
            currentProjectId={projectId}
            accentHex={a.hex}
            projects={projects}
            contentLibrary={contentLibrary}
            setContentLibrary={setContentLibrary}
          />
        ) : boardKey === "marketing" ? (
          <MarketingBoard
            boardData={boardContent[contentKey] || { performance: {}, campaigns: [] }}
            setBoardData={(updater) => setBoardContent((prev) => {
              const current = prev[contentKey] || { performance: {}, campaigns: [] };
              const next = typeof updater === "function" ? updater(current) : updater;
              return { ...prev, [contentKey]: next };
            })}
            contentPieces={(boardContent[projectId + ":content"] || { pieces: [] }).pieces}
            accentHex={a.hex}
            campaignLibrary={campaignLibrary}
          />
        ) : boardKey === "sales" ? (
          <SalesBoard
            boardData={boardContent[contentKey] || { leads: [], listings: [] }}
            setBoardData={(updater) => setBoardContent((prev) => {
              const current = prev[contentKey] || { leads: [], listings: [] };
              const next = typeof updater === "function" ? updater(current) : updater;
              return { ...prev, [contentKey]: next };
            })}
            contentPieces={(boardContent[projectId + ":content"] || { pieces: [] }).pieces}
            project={project}
            accentHex={a.hex}
            contacts={contacts}
            setContacts={setContacts}
            productContent={normalizeProduct(boardContent[projectId + ":product"])}
            onOpenProduct={() => onOpenProduct(projectId)}
          />
        ) : boardKey === "learnings" ? (
          <LearningsBoard
            boardData={boardContent[contentKey] || { notes: "" }}
            setBoardData={(updater) => setBoardContent((prev) => {
              const current = prev[contentKey] || { notes: "" };
              const next = typeof updater === "function" ? updater(current) : updater;
              return { ...prev, [contentKey]: next };
            })}
          />
        ) : (
          <div style={{ padding: 64, textAlign: "center" }}>
            <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6 }}>{board.label}</div>
            <div style={{ fontSize: 12.5, color: COLORS.muted }}>Coming in a future pass of Stage 3.</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Marketing Board ----------
   Two sections: (1) performance tracking against each of this project's actual
   Content pieces from Board 5, and (2) a lightweight log of broader promo
   activity (email blasts, fairs, collabs) that isn't tied to one post, plus a
   link out to the shared Campaign Library of reusable outreach templates. */
function MarketingBoard({ boardData, setBoardData, contentPieces, accentHex, campaignLibrary }) {
  const performance = boardData.performance || {};
  const campaigns = boardData.campaigns || [];

  const updatePerformance = (pieceId, field, value) => {
    setBoardData((prev) => ({
      ...prev,
      performance: { ...(prev.performance || {}), [pieceId]: { ...((prev.performance || {})[pieceId] || {}), [field]: value } },
    }));
  };

  return (
    <div style={{ padding: "24px 28px" }}>
      <SectionLabel>Performance</SectionLabel>
      <div style={{ marginTop: 10, marginBottom: 24 }}>
        {(!contentPieces || contentPieces.length === 0) && (
          <div style={{ fontSize: 12.5, color: COLORS.muted, fontStyle: "italic" }}>
            No content pieces yet — add some on the Content board to start tracking performance here.
          </div>
        )}
        {contentPieces && contentPieces.map((piece) => (
          <PerformanceRow
            key={piece.id}
            piece={piece}
            data={performance[piece.id] || {}}
            onUpdate={(field, value) => updatePerformance(piece.id, field, value)}
            accentHex={accentHex}
          />
        ))}
      </div>

      <div style={{ borderTop: `1px solid ${COLORS.hairline}`, paddingTop: 20 }}>
        <CampaignLog campaigns={campaigns} setBoardData={setBoardData} accentHex={accentHex} campaignLibrary={campaignLibrary} />
      </div>
    </div>
  );
}

const CAMPAIGN_TYPES = ["Social media", "Email", "Event", "Collaboration"];

function CampaignLog({ campaigns, setBoardData, accentHex, campaignLibrary }) {
  // Every campaign is expanded by default; collapses only when its own toggle
  // is clicked — same interaction as the Content board's accordion.
  const [collapsedIds, setCollapsedIds] = useState(() => new Set());
  const [justAddedId, setJustAddedId] = useState(null);

  const toggleCampaign = (id) => {
    setCollapsedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const addCampaign = () => {
    const newCampaign = { id: "camp-" + Date.now(), name: "", type: CAMPAIGN_TYPES[0], status: "Planning", notes: "" };
    setBoardData((prev) => ({ ...prev, campaigns: [...(prev.campaigns || []), newCampaign] }));
    setJustAddedId(newCampaign.id);
  };

  const updateCampaign = (id, field, value) => {
    setBoardData((prev) => ({
      ...prev,
      campaigns: (prev.campaigns || []).map((c) => (c.id === id ? { ...c, [field]: value } : c)),
    }));
  };

  const removeCampaign = (id) => {
    setBoardData((prev) => ({ ...prev, campaigns: (prev.campaigns || []).filter((c) => c.id !== id) }));
    setCollapsedIds((prev) => {
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 10 }}>
        <SectionLabel>Campaigns</SectionLabel>
        <span style={{ fontSize: 10.5, color: COLORS.muted }}>
          {campaignLibrary.length} reusable template{campaignLibrary.length !== 1 ? "s" : ""} in the Campaign Library
        </span>
      </div>

      {campaigns.length === 0 && (
        <div style={{ fontSize: 12.5, color: COLORS.muted, fontStyle: "italic", marginBottom: 16 }}>
          No campaigns logged yet — an email push, a fair booth, a collab reach-out.
        </div>
      )}

      <div style={{ marginBottom: 16 }}>
        {campaigns.map((c) => (
          <CampaignAccordionItem
            key={c.id}
            campaign={c}
            isExpanded={!collapsedIds.has(c.id)}
            onToggle={() => toggleCampaign(c.id)}
            onUpdate={(field, value) => updateCampaign(c.id, field, value)}
            onRemove={() => removeCampaign(c.id)}
            justAdded={justAddedId === c.id}
          />
        ))}
      </div>

      <button
        onClick={addCampaign}
        style={{
          background: "none",
          border: `1px dashed ${COLORS.hairline}`,
          borderRadius: RADIUS,
          padding: "10px 16px",
          fontSize: 12.5,
          fontWeight: 600,
          fontFamily: "inherit",
          color: COLORS.muted,
          cursor: "pointer",
          width: "100%",
          textAlign: "center",
        }}
      >
        + Add campaign
      </button>
    </div>
  );
}

function CampaignAccordionItem({ campaign, isExpanded, onToggle, onUpdate, onRemove, justAdded }) {
  const displayName = (campaign.name && campaign.name.trim()) || "Untitled campaign";
  const fieldStyle = {
    background: COLORS.cream,
    border: `1px solid ${COLORS.hairline}`,
    borderRadius: RADIUS,
    padding: "7px 10px",
    fontSize: 12.5,
    fontFamily: "inherit",

    width: "100%",

  const labelStyle = { fontSize: 10, fontWeight: 600, color: COLORS.muted, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 5 };

  return (
    <div className={justAdded ? "flash-save" : ""} style={{ border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, marginBottom: 10, overflow: "hidden" }}>
      <div
        onClick={onToggle}
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "12px 16px",
          cursor: "pointer",
          background: isExpanded ? COLORS.cream : COLORS.paper,

      >
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <i className={"ti " + (isExpanded ? "ti-chevron-down" : "ti-chevron-right")} style={{ fontSize: 14, color: COLORS.muted }} aria-hidden="true" />
          <span style={{ fontSize: 13.5, fontWeight: 700 }}>{displayName}</span>
          {campaign.type && <span style={{ fontSize: 10.5, color: COLORS.muted }}>{campaign.type}</span>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 10.5, color: COLORS.muted }}>{campaign.status}</span>
          <button
            onClick={(e) => { e.stopPropagation(); onRemove(); }}
            title="Remove campaign"
            style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 0, lineHeight: 1 }}
          >
            <i className="ti ti-x" style={{ fontSize: 14 }} aria-hidden="true" />
          </button>
        </div>
      </div>

      {isExpanded && (
        <div style={{ padding: "20px 16px", borderTop: `1px solid ${COLORS.hairline}` }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, marginBottom: 16 }}>
            <div>
              <div style={labelStyle}>Name</div>
              <input value={campaign.name || ""} onChange={(e) => onUpdate("name", e.target.value)} style={fieldStyle} placeholder="Campaign name…" />
            </div>
            <div>
              <div style={labelStyle}>Type</div>
              <select value={campaign.type} onChange={(e) => onUpdate("type", e.target.value)} style={{ ...fieldStyle, cursor: "pointer" }}>
                {CAMPAIGN_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div>
              <div style={labelStyle}>Status</div>
              <select value={campaign.status} onChange={(e) => onUpdate("status", e.target.value)} style={{ ...fieldStyle, cursor: "pointer" }}>
                <option value="Planning">Planning</option>
                <option value="Active">Active</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>
          <div>
            <div style={labelStyle}>Notes</div>
            <textarea
              value={campaign.notes || ""}
              onChange={(e) => onUpdate("notes", e.target.value)}
              placeholder="Notes on this campaign…"
              style={{ ...fieldStyle, minHeight: 60, resize: "vertical" }}
            />
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- Inspiration Board ---------- */
// Item types: "sketch" (freehand stroke path), "text" (note), "swatch" (color chip)
// Drawing colours are stored on the sketch itself, so these stay fixed hexes —
// a sketch drawn in light mode must not change colour when the theme flips.
// The exception is "Ink", which means "default pen" rather than a specific
// colour, so it follows the theme and stays visible on either background.
const SKETCH_PALETTE = [
  { hex: "#102A43", name: "Navy" },
  { hex: "#120A8F", name: "Royal blue" },
  { hex: "#1D4ED8", name: "Cobalt" },
  { hex: "#C9A400", name: "Lemon" },
  { hex: "#F24A3D", name: "Tomato" },
  { hex: "var(--ink)", name: "Ink" },
];

// ---- Small hex/RGB/HSV color-math helpers, used only by ColorPickerPopover.
function hexToRgb(hex) {
  if (typeof hex !== "string") return null;
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
  if (!m) return null;
  return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
}
function rgbToHex({ r, g, b }) {
  const h = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, "0");
  return "#" + h(r) + h(g) + h(b);
}
function rgbToHsv({ r, g, b }) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return { h, s: max === 0 ? 0 : d / max, v: max };
}
function hsvToRgb({ h, s, v }) {
  const c = v * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = v - c;
  let r1, g1, b1;
  if (h < 60) [r1, g1, b1] = [c, x, 0];
  else if (h < 120) [r1, g1, b1] = [x, c, 0];
  else if (h < 180) [r1, g1, b1] = [0, c, x];
  else if (h < 240) [r1, g1, b1] = [0, x, c];
  else if (h < 300) [r1, g1, b1] = [x, 0, c];
  else [r1, g1, b1] = [c, 0, x];
  return { r: (r1 + m) * 255, g: (g1 + m) * 255, b: (b1 + m) * 255 };
}

// Office-style color picker: brand presets + a saturation/value square + hue
// slider + hex/RGB fields, all in one popover. Replaces the old fixed
// six-swatch row. Non-hex presets (e.g. "Ink", a CSS var) pass straight
// through via onChange without engaging the custom controls.
function ColorPickerPopover({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const wrapRef = React.useRef(null);
  const svRef = React.useRef(null);
  const hueRef = React.useRef(null);
  const draggingRef = React.useRef(null); // "sv" | "hue" | null

  const fallback = hexToRgb(value) || { r: 16, g: 42, b: 67 };
  const [hsv, setHsv] = useState(() => rgbToHsv(fallback));
  const [hexText, setHexText] = useState((hexToRgb(value) ? value : rgbToHex(fallback)).toUpperCase());

  // Re-sync the custom controls to whatever color is active whenever the
  // popover opens, so it never shows stale state from a prior session.
  React.useEffect(() => {
    if (!open) return;
    const rgb = hexToRgb(value);
    if (rgb) {
      setHsv(rgbToHsv(rgb));
      setHexText(value.toUpperCase());
    }
  }, [open]);

  React.useEffect(() => {
    if (!open) return;
    const handleOutsideClick = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("pointerdown", handleOutsideClick);
    return () => document.removeEventListener("pointerdown", handleOutsideClick);
  }, [open]);

  const commitFromHsv = (nextHsv) => {
    setHsv(nextHsv);
    const hex = rgbToHex(hsvToRgb(nextHsv));
    setHexText(hex.toUpperCase());
    onChange(hex);
  };

  const svPointFromEvent = (e) => {
    const rect = svRef.current.getBoundingClientRect();
    return {
      s: Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)),
      v: 1 - Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height)),
    };
  };
  const huePointFromEvent = (e) => {
    const rect = hueRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * 360;
  };

  const handleSvDown = (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    draggingRef.current = "sv";
    commitFromHsv({ ...hsv, ...svPointFromEvent(e) });
  };
  const handleHueDown = (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    draggingRef.current = "hue";
    commitFromHsv({ ...hsv, h: huePointFromEvent(e) });
  };
  const handleDragMove = (e) => {
    if (draggingRef.current === "sv") commitFromHsv({ ...hsv, ...svPointFromEvent(e) });
    else if (draggingRef.current === "hue") commitFromHsv({ ...hsv, h: huePointFromEvent(e) });
  };
  const handleDragUp = () => { draggingRef.current = null; };

  const handleHexChange = (raw) => {
    setHexText(raw);
    const norm = raw.startsWith("#") ? raw : "#" + raw;
    const rgb = hexToRgb(norm);
    if (rgb) {
      setHsv(rgbToHsv(rgb));
      onChange(norm.toLowerCase());
    }
  };

  const rgbNow = hsvToRgb(hsv);
  const handleRgbChange = (channel, raw) => {
    const n = Math.max(0, Math.min(255, Number(raw) || 0));
    const nextRgb = { ...rgbNow, [channel]: n };
    const hex = rgbToHex(nextRgb);
    setHsv(rgbToHsv(nextRgb));
    setHexText(hex.toUpperCase());
    onChange(hex);
  };

  const hueColor = rgbToHex(hsvToRgb({ h: hsv.h, s: 1, v: 1 }));
  const validHex = /^#[0-9a-f]{6}$/i.test(hexText);

  return (
    <div style={{ position: "relative" }} ref={wrapRef}>
      <button
        onClick={() => setOpen((v) => !v)}
        title="More colors"
        style={{
          width: 22, height: 22, borderRadius: "50%", padding: 2, border: "none", cursor: "pointer",
          background: "conic-gradient(from 0deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00)",
          boxShadow: open ? `0 0 0 2px ${COLORS.ink}` : "none",
        }}
      >
        <div style={{ width: "100%", height: "100%", borderRadius: "50%", background: value, border: `1px solid ${COLORS.paper}` }} />
      </button>

      {open && (
        <div
          onPointerMove={handleDragMove}
          onPointerUp={handleDragUp}
          onPointerLeave={handleDragUp}
          style={{
            position: "absolute", left: "calc(100% + 8px)", top: -8, width: 196, zIndex: 50,
            background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS,
            boxShadow: "0 4px 14px rgba(0,0,0,0.16)", padding: 12,
          }}
        >
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.4, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
            Presets
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            {SKETCH_PALETTE.map((c) => (
              <button
                key={c.name}
                onClick={() => onChange(c.hex)}
                title={c.name}
                style={{
                  width: 20, height: 20, borderRadius: "50%", background: c.hex, padding: 0, cursor: "pointer",
                  border: value === c.hex ? `2px solid ${COLORS.ink}` : `1px solid ${COLORS.hairline}`,
                }}
              />
            ))}
          </div>

          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.4, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
            Custom
          </div>

          <div
            ref={svRef}
            onPointerDown={handleSvDown}
            style={{
              width: "100%", height: 110, borderRadius: RADIUS, position: "relative", cursor: "crosshair", marginBottom: 10,
              background: `linear-gradient(to top, #000, rgba(0,0,0,0)), linear-gradient(to right, #fff, ${hueColor})`,
              border: `1px solid ${COLORS.hairline}`, touchAction: "none",
            }}
          >
            <div style={{
              position: "absolute", left: `calc(${hsv.s * 100}% - 6px)`, top: `calc(${(1 - hsv.v) * 100}% - 6px)`,
              width: 12, height: 12, borderRadius: "50%", border: "2px solid #fff",
              boxShadow: "0 0 0 1px rgba(0,0,0,0.4)", pointerEvents: "none",
            }} />
          </div>

          <div
            ref={hueRef}
            onPointerDown={handleHueDown}
            style={{
              width: "100%", height: 14, borderRadius: RADIUS, position: "relative", cursor: "pointer", marginBottom: 12,
              background: "linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00)",
              border: `1px solid ${COLORS.hairline}`, touchAction: "none",
            }}
          >
            <div style={{
              position: "absolute", left: `calc(${(hsv.h / 360) * 100}% - 6px)`, top: -1,
              width: 12, height: 16, borderRadius: 3, border: "2px solid #fff",
              boxShadow: "0 0 0 1px rgba(0,0,0,0.4)", background: hueColor, pointerEvents: "none",
            }} />
          </div>

          <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
            <div style={{ width: 28, height: 28, borderRadius: RADIUS, border: `1px solid ${COLORS.hairline}`, background: validHex ? hexText : value, flexShrink: 0 }} />
            <input
              value={hexText}
              onChange={(e) => handleHexChange(e.target.value)}
              style={{
                flex: 1, minWidth: 0, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS,
                padding: "5px 8px", fontSize: 12, fontFamily: "inherit", color: COLORS.ink, background: COLORS.paper,
              }}
            />
          </div>

          <div style={{ display: "flex", gap: 6 }}>
            {["r", "g", "b"].map((ch) => (
              <div key={ch} style={{ flex: 1 }}>
                <div style={{ fontSize: 9, fontWeight: 700, color: COLORS.muted, textAlign: "center", marginBottom: 3, textTransform: "uppercase" }}>{ch}</div>
                <input
                  type="number" min="0" max="255"
                  value={Math.round(rgbNow[ch])}
                  onChange={(e) => handleRgbChange(ch, e.target.value)}
                  style={{
                    width: "100%", border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS,
                    padding: "5px 4px", fontSize: 12, fontFamily: "inherit", color: COLORS.ink,
                    background: COLORS.paper, textAlign: "center",
                  }}
                />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function FreeformCanvas({ items, setItems, accentHex, placeholderTitle, placeholderSub, height }) {
  const [tool, setTool] = useState("sketch"); // sketch | text | eraser
  const [activeColor, setActiveColor] = useState(SKETCH_PALETTE[0].hex);
  const canvasRef = React.useRef(null);
  const drawingRef = React.useRef(null); // { id, points } while actively drawing
  const [, forceRender] = useState(0);
  const [draggingItem, setDraggingItem] = useState(null); // { id, offsetX, offsetY }
  const [editingTextId, setEditingTextId] = useState(null);

  const relativePoint = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };

  const handleCanvasPointerDown = (e) => {
    if (e.target.closest("[data-canvas-item]")) return; // clicks on existing items are handled separately
    const pt = relativePoint(e);

    if (tool === "sketch") {
      const id = "sketch-" + Date.now();
      drawingRef.current = { id, points: [pt] };
      setItems((prev) => [...prev, { id, type: "sketch", color: activeColor, points: [pt] }]);
      e.currentTarget.setPointerCapture(e.pointerId);
    } else if (tool === "text") {
      const id = "text-" + Date.now();
      setItems((prev) => [...prev, { id, type: "text", x: pt.x, y: pt.y, text: "", color: COLORS.ink }]);
      setEditingTextId(id);
    }
  };

  const handleCanvasPointerMove = (e) => {
    if (tool === "sketch" && drawingRef.current) {
      const pt = relativePoint(e);
      drawingRef.current.points.push(pt);
      setItems((prev) => prev.map((it) => (it.id === drawingRef.current.id ? { ...it, points: drawingRef.current.points } : it)));
    }
    if (draggingItem) {
      const pt = relativePoint(e);
      setItems((prev) => prev.map((it) => (it.id === draggingItem.id ? { ...it, x: pt.x - draggingItem.offsetX, y: pt.y - draggingItem.offsetY } : it)));
    }
  };

  const handleCanvasPointerUp = () => {
    drawingRef.current = null;
    setDraggingItem(null);
  };

  const startDragItem = (e, item) => {
    if (tool === "eraser") {
      setItems((prev) => prev.filter((it) => it.id !== item.id));
      return;
    }
    e.stopPropagation();
    const pt = relativePoint(e);
    setDraggingItem({ id: item.id, offsetX: pt.x - item.x, offsetY: pt.y - item.y });
  };

  const eraseSketch = (e, item) => {
    if (tool !== "eraser") return;
    e.stopPropagation();
    setItems((prev) => prev.filter((it) => it.id !== item.id));
  };

  // Splits note text on URLs and renders those segments as clickable links,
  // while leaving the rest as plain text — so a note can mix prose and links.
  const URL_PATTERN = /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;
  const renderLinkedText = (text) => {
    if (!text) return null;
    const parts = text.split(URL_PATTERN);
    return parts.map((part, i) => {
      if (part.match(URL_PATTERN)) {
        const href = part.startsWith("http") ? part : "https://" + part;
        return (
          <a
            key={i}
            href={href}
            target="_blank"
            rel="noopener noreferrer"
            onPointerDown={(e) => e.stopPropagation()}
            onClick={(e) => e.stopPropagation()}
            style={{ color: accentHex, textDecoration: "underline", wordBreak: "break-all" }}
          >
            {part}
          </a>
        );
      }
      return <React.Fragment key={i}>{part}</React.Fragment>;
    });
  };

  const pointsToPath = (points) => {
    if (points.length === 0) return "";
    return points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(" ");
  };

  const updateTextValue = (id, val) => {
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, text: val } : it)));
  };

  const clearBoard = () => {
    setItems([]);
  };

  return (
    <div style={{ display: "flex" }}>
      {/* Toolbar */}
      <div style={{ width: 56, borderRight: `1px solid ${COLORS.hairline}`, padding: "16px 8px", display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
        <ToolButton active={tool === "sketch"} onClick={() => setTool("sketch")} title="Sketch">
          <i className="ti ti-pencil" style={{ fontSize: 17 }} aria-hidden="true" />
        </ToolButton>
        <ToolButton active={tool === "text"} onClick={() => setTool("text")} title="Text note">
          <i className="ti ti-typography" style={{ fontSize: 17 }} aria-hidden="true" />
        </ToolButton>
        <ToolButton active={tool === "eraser"} onClick={() => setTool("eraser")} title="Eraser">
          <i className="ti ti-eraser" style={{ fontSize: 17 }} aria-hidden="true" />
        </ToolButton>

        <div style={{ width: 28, height: 1, background: COLORS.hairline, margin: "4px 0" }} />

        <ColorPickerPopover value={activeColor} onChange={setActiveColor} />

        <div style={{ flex: 1 }} />

        <button
          onClick={clearBoard}
          title="Clear board"
          style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 6 }}
        >
          <i className="ti ti-trash" style={{ fontSize: 16 }} aria-hidden="true" />
        </button>
      </div>

      {/* Canvas */}
      <div
        ref={canvasRef}
        onPointerDown={handleCanvasPointerDown}
        onPointerMove={handleCanvasPointerMove}
        onPointerUp={handleCanvasPointerUp}
        onPointerLeave={handleCanvasPointerUp}
        style={{
          flex: 1,
          height: height || 520,
          position: "relative",
          background: COLORS.cream,
          cursor: tool === "sketch" ? "crosshair" : tool === "eraser" ? "cell" : tool === "text" ? "text" : "default",
          overflow: "hidden",
          touchAction: "none",
        }}
      >
        {items.length === 0 && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none" }}>
            <div style={{ textAlign: "center", color: COLORS.muted }}>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>{placeholderTitle || "Sketch, drop in text, or paste reference images"}</div>
              <div style={{ fontSize: 11.5 }}>{placeholderSub || "Pick a tool on the left to get started"}</div>
            </div>
          </div>
        )}

        <svg width="100%" height="100%" style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
          {items.filter((it) => it.type === "sketch").map((it) => (
            <path
              key={it.id}
              data-canvas-item
              d={pointsToPath(it.points)}
              stroke={it.color}
              strokeWidth={2.5}
              strokeLinecap="round"
              strokeLinejoin="round"
              fill="none"
              style={{ pointerEvents: tool === "eraser" ? "stroke" : "none" }}
              onPointerDown={(e) => eraseSketch(e, it)}
            />
          ))}
        </svg>

        {items.filter((it) => it.type === "text").map((it) => (
          <div
            key={it.id}
            data-canvas-item
            onPointerDown={(e) => startDragItem(e, it)}
            style={{
              position: "absolute",
              left: it.x,
              top: it.y,
              minWidth: 120,
              maxWidth: 240,
              cursor: tool === "eraser" ? "cell" : "grab",
            }}
          >
            {editingTextId === it.id ? (
              <textarea
                autoFocus
                value={it.text}
                onChange={(e) => updateTextValue(it.id, e.target.value)}
                onBlur={() => setEditingTextId(null)}
                placeholder="Type a note…"
                style={{
                  width: 200,
                  minHeight: 60,
                  background: COLORS.paper,
                  border: `1px solid ${accentHex}`,
                  borderRadius: RADIUS,
                  padding: 8,
                  fontSize: 12.5,
                  fontFamily: "inherit",
                  resize: "both",
                }}
              />
            ) : (
              <div
                onDoubleClick={(e) => { e.stopPropagation(); setEditingTextId(it.id); }}
                style={{
                  background: COLORS.paper,
                  border: `1px solid ${COLORS.hairline}`,
                  borderLeft: `3px solid ${accentHex}`,
                  borderRadius: RADIUS,
                  padding: "8px 10px",
                  fontSize: 12.5,
                  whiteSpace: "pre-wrap",
                  boxShadow: "0 1px 4px rgba(0,0,0,0.06)",
                }}
              >
                {it.text ? renderLinkedText(it.text) : <span style={{ color: COLORS.muted, fontStyle: "italic" }}>Empty note — double-click to edit</span>}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- Sales Board ----------
   Two sections: (1) Sales Leads — potential buyers/commissions in the pipeline
   for this project, referencing the shared Contacts list rather than duplicating
   contact info; and (2) Listings — where this project's finished piece is
   actually offered for sale, with pricing tied back to the project and a way
   to pull description text from an existing Content piece instead of retyping it.
   Shopify/Stripe/Etsy connections are honest placeholders — real integration
   needs OAuth and a backend server per platform, same as Instagram on Marketing. */
const LEAD_STATUSES = ["New", "Contacted", "Negotiating", "Won", "Lost"];

function SalesBoard({ boardData, setBoardData, contentPieces, project, accentHex, contacts, setContacts, productContent, onOpenProduct }) {
  const leads = boardData.leads || [];
  const listings = boardData.listings || [];

  const updateLeads = (updater) => setBoardData((prev) => ({ ...prev, leads: typeof updater === "function" ? updater(prev.leads || []) : updater }));
  const updateListings = (updater) => setBoardData((prev) => ({ ...prev, listings: typeof updater === "function" ? updater(prev.listings || []) : updater }));

  return (
    <div style={{ padding: "24px 28px" }}>
      <SectionLabel>Sales leads</SectionLabel>
      <div style={{ marginTop: 10, marginBottom: 28 }}>
        <SalesLeadsTable leads={leads} setLeads={updateLeads} contacts={contacts} setContacts={setContacts} accentHex={accentHex} />
      </div>

      <div style={{ borderTop: `1px solid ${COLORS.hairline}`, paddingTop: 20 }}>
        <SectionLabel>Listings</SectionLabel>
        <div style={{ marginTop: 10 }}>
          <ListingsSection listings={listings} setListings={updateListings} contentPieces={contentPieces} project={project} accentHex={accentHex} productContent={productContent} onOpenProduct={onOpenProduct} />
        </div>
      </div>
    </div>
  );
}

          background: COLORS.paper,

function SalesLeadsTable({ leads, setLeads, contacts, setContacts, accentHex }) {
  const todayIso = appToday().toISOString().slice(0, 10);
  const [collapsedIds, setCollapsedIds] = useState(() => new Set());
  const [justAddedId, setJustAddedId] = useState(null);

  const toggleLead = (id) => {
    setCollapsedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const addLead = () => {
    const id = "lead-" + Date.now();
    setLeads((prev) => [...prev, {
      id,
      opportunity: "",
      contactId: null,
      value: "",
      probability: "50",
      status: "New",
      inquiryDate: todayIso,
      followUp: "",
      notes: "",
    }]);
    setJustAddedId(id);
  };

  const updateLead = (id, field, value) => {
    setLeads((prev) => prev.map((l) => (l.id === id ? { ...l, [field]: value } : l)));
  };

  const removeLead = (id) => {
    setLeads((prev) => prev.filter((l) => l.id !== id));
    setCollapsedIds((prev) => {
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
  };

  return (
    <div>
      {leads.length === 0 && (
        <div style={{ fontSize: 12.5, color: COLORS.muted, fontStyle: "italic", marginBottom: 12 }}>
          No leads yet — a potential buyer or commission inquiry for this project.
        </div>
      )}

      {leads.map((l) => (
        <LeadAccordionItem
          key={l.id}
          lead={l}
          isExpanded={!collapsedIds.has(l.id)}
          onToggle={() => toggleLead(l.id)}
          onUpdate={(field, value) => updateLead(l.id, field, value)}
          onRemove={() => removeLead(l.id)}
          contacts={contacts}
          setContacts={setContacts}
          accentHex={accentHex}
          justAdded={justAddedId === l.id}
        />
      ))}

      <button
        onClick={addLead}
        style={{
          background: "none",
          border: `1px dashed ${COLORS.hairline}`,
          borderRadius: RADIUS,
          padding: "10px 16px",
          fontSize: 12.5,
          fontWeight: 600,
          fontFamily: "inherit",
          color: COLORS.muted,
          cursor: "pointer",
          width: "100%",
          textAlign: "center",
        }}
      >
        + Add lead
      </button>
    </div>
  );
}

function LeadAccordionItem({ lead, isExpanded, onToggle, onUpdate, onRemove, contacts, setContacts, accentHex, justAdded }) {
  const [addingContact, setAddingContact] = useState(false);
  const [newContactName, setNewContactName] = useState("");
  const todayIso = appToday().toISOString().slice(0, 10);

  const fieldStyle = {
    background: COLORS.cream,
    border: `1px solid ${COLORS.hairline}`,
    borderRadius: RADIUS,
    padding: "6px 9px",
    fontSize: 12,
    fontFamily: "inherit",
    color: COLORS.ink,
    width: "100%",
  };
  const labelStyle = { fontSize: 9.5, fontWeight: 600, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 4 };
  const displayTitle = (lead.opportunity && lead.opportunity.trim()) || "Untitled opportunity";
  const contactName = (id) => (contacts.find((c) => c.id === id) || {}).name || "—";

  const submitNewContact = () => {
    const name = newContactName.trim();
    if (!name) return;
    const id = "contact-" + Date.now();
    setContacts((prev) => [...prev, { id, name, email: "", phone: "", relationship: "Customer", notes: "", dateAdded: todayIso }]);
    onUpdate("contactId", id);
    setAddingContact(false);
    setNewContactName("");
  };

  return (
    <div className={justAdded ? "flash-save" : ""} style={{ border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, marginBottom: 10, overflow: "hidden" }}>
      <div
        onClick={onToggle}
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "12px 16px",
          cursor: "pointer",
          background: isExpanded ? COLORS.cream : COLORS.paper,
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          <i className={"ti " + (isExpanded ? "ti-chevron-down" : "ti-chevron-right")} style={{ fontSize: 14, color: COLORS.muted, flexShrink: 0 }} aria-hidden="true" />
          <span style={{ fontSize: 13.5, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{displayTitle}</span>
          {lead.contactId && <span style={{ fontSize: 11, color: COLORS.muted, flexShrink: 0 }}>{contactName(lead.contactId)}</span>}
          {lead.value && <span style={{ fontSize: 11, color: COLORS.muted, flexShrink: 0 }}>${lead.value}</span>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
          {lead.followUp && <span style={{ fontSize: 10.5, color: COLORS.muted }}>Follow up {lead.followUp}</span>}
          <span style={{ fontSize: 10.5, fontWeight: 600, color: accentHex, textTransform: "uppercase", letterSpacing: "0.04em" }}>{lead.status}</span>
          <button
            onClick={(e) => { e.stopPropagation(); onRemove(); }}
            title="Remove lead"
            style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 0, lineHeight: 1 }}
          >
            <i className="ti ti-x" style={{ fontSize: 14 }} aria-hidden="true" />
          </button>
        </div>
      </div>

      {isExpanded && (
        <div style={{ padding: "16px 16px 14px", borderTop: `1px solid ${COLORS.hairline}` }}>
          <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 10, marginBottom: 10 }}>
            <div>
              <div style={labelStyle}>Opportunity</div>
              <input value={lead.opportunity} onChange={(e) => onUpdate("opportunity", e.target.value)} style={fieldStyle} placeholder="Opportunity name…" />
            </div>
            <div>
              <div style={labelStyle}>Contact</div>
              {addingContact ? (
                <input
                  autoFocus
                  value={newContactName}
                  onChange={(e) => setNewContactName(e.target.value)}
                  onBlur={submitNewContact}
                  onKeyDown={(e) => { if (e.key === "Enter") submitNewContact(); if (e.key === "Escape") { setAddingContact(false); setNewContactName(""); } }}
                  placeholder="New contact name…"
                  style={fieldStyle}
                />
              ) : (
                <select
                  value={lead.contactId || ""}
                  onChange={(e) => { if (e.target.value === "__add") { setAddingContact(true); } else { onUpdate("contactId", e.target.value || null); } }}
                  style={{ ...fieldStyle, cursor: "pointer" }}
                >
                  <option value="">No contact</option>
                  {contacts.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                  <option value="__add">+ Add new contact…</option>
                </select>
              )}
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginBottom: 10 }}>
            <div>
              <div style={labelStyle}>Value</div>
              <input type="number" value={lead.value} onChange={(e) => onUpdate("value", e.target.value)} style={fieldStyle} placeholder="$" />
            </div>
            <div>
              <div style={labelStyle}>Probability</div>
              <input type="number" min="0" max="100" value={lead.probability} onChange={(e) => onUpdate("probability", e.target.value)} style={fieldStyle} />
            </div>
            <div>
              <div style={labelStyle}>Status</div>
              <select value={lead.status} onChange={(e) => onUpdate("status", e.target.value)} style={{ ...fieldStyle, cursor: "pointer" }}>
                {LEAD_STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
            <div>
              <div style={labelStyle}>Inquiry date</div>
              <input type="date" value={lead.inquiryDate} onChange={(e) => onUpdate("inquiryDate", e.target.value)} style={fieldStyle} />
            </div>
            <div>
              <div style={labelStyle}>Follow-up</div>
              <input type="date" value={lead.followUp} onChange={(e) => onUpdate("followUp", e.target.value)} style={fieldStyle} />
            </div>
          </div>

          <div>
            <div style={labelStyle}>Notes</div>
            <textarea
              value={lead.notes || ""}
              onChange={(e) => onUpdate("notes", e.target.value)}
              placeholder="Notes…"
              style={{ ...fieldStyle, minHeight: 44, resize: "vertical" }}
            />
          </div>
        </div>
      )}
    </div>
  );
}
