<style>
  /* Theme tokens. Light is the original editorial palette, unchanged.
     Dark is a warm neutral (not blue-grey) so it keeps the same paper-and-ink
     character rather than reading as a generic dev-tool dark theme. */
  :root {
    --cream: #F8F6F1;
    --ink: #111111;
    --paper: #FFFFFF;
    --hairline: #DEDACD;
    --muted: #8A8579;
    --today-tint: #FDF9E8;
    --flash: #FFF176;
    --scrim: rgba(16, 14, 10, 0.28);
    /* Project accents — full-saturation brand hues in light mode.
       Lemon is darkened further than the others (was #C9A400 @ 2.39:1,
       now #8F7300 @ 4.55:1) so it reads as clearly as navy/royal/cobalt/
       tomato do as a stripe, dot, icon, and small uppercase tag text. */
    --accent-navy: #102A43;
    --accent-royal: #120A8F;
    --accent-cobalt: #1D4ED8;
    --accent-lemon: #8F7300;
    --accent-tomato: #F24A3D;
  }
  [data-theme="dark"] {
    --cream: #16150F;   /* app background — warm near-black */
    --ink: #F2EFE6;     /* primary text — warm off-white */
    --paper: #201E17;   /* card/surface — one step up from background */
    --hairline: #38352B;
    --muted: #9A9483;
    --today-tint: #2E2A16;
    --flash: #6B5F14;   /* muted gold: same signal, no glare on dark */
    --scrim: rgba(0, 0, 0, 0.55);
    /* Same hues, lightened so they stay legible as both fills and text on dark.
       The originals (navy #102A43, royal #120A8F) sit at ~1.25 contrast here —
       effectively invisible — so each is raised above 4.5:1 on both surfaces. */
    --accent-navy: #6FA0CC;
    --accent-royal: #8C8AF0;
    --accent-cobalt: #7FA9FF;
    --accent-lemon: #FFF176;
    --accent-tomato: #FF7A6E;
  }
  html, body { margin: 0; padding: 0; background: var(--cream); }
  * { box-sizing: border-box; }
  select { appearance: none; -webkit-appearance: none; }
  /* Native widgets (date pickers, dropdown menus, scrollbars) follow the theme */
  [data-theme="dark"] { color-scheme: dark; }
  @keyframes flashSave {
    0% { background-color: var(--flash); }
    55% { background-color: var(--flash); }
    100% { background-color: transparent; }
  }
  .flash-save { animation: flashSave 900ms ease-out; }
</style>
</head>

}

/* ---------- Auth ----------
   Tokens live in localStorage purely as a session cache — they are not the
   data store. The access token expires (1h by default), so every authed
   request retries once through the refresh token before giving up. */
const AUTH_KEYS = { access: "studioco:auth:access", refresh: "studioco:auth:refresh", email: "studioco:auth:email" };

const Auth = {
  session() {
    const access = localStorage.getItem(AUTH_KEYS.access);
    const email = localStorage.getItem(AUTH_KEYS.email);
    return access && email ? { access, email } : null;
  },
  save(data, email) {
    localStorage.setItem(AUTH_KEYS.access, data.access_token);
    localStorage.setItem(AUTH_KEYS.refresh, data.refresh_token);
    localStorage.setItem(AUTH_KEYS.email, email || (data.user && data.user.email) || "");
  },
  clear() {
    Object.values(AUTH_KEYS).forEach((k) => localStorage.removeItem(k));
  },
  async signUp(email, password) {
    const res = await fetch(SUPABASE_URL + "/auth/v1/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.message || data.error_description || "Sign up failed");
    return data;
  },
  async signIn(email, password) {
    const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.message || data.error_description || "Log in failed");
    Auth.save(data, email);
    return data;
  },
  async refresh() {
    const refresh_token = localStorage.getItem(AUTH_KEYS.refresh);
    if (!refresh_token) return false;
    const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ refresh_token }),
    });
    if (!res.ok) return false;
    const data = await res.json();
    Auth.save(data, localStorage.getItem(AUTH_KEYS.email));
    return true;
  },
  signOut() {
    Auth.clear();
    window.location.reload();
  },
};

/* One fetch wrapper for every data call: attaches the token, and on a 401
   refreshes once and retries. Anything still failing throws to the caller. */
async function authedFetch(path, options) {
  const opts = options || {};
  const build = () => ({
    ...opts,
    headers: {
      ...(opts.headers || {}),
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + localStorage.getItem(AUTH_KEYS.access),
    },
  });
  let res = await fetch(SUPABASE_URL + path, build());
  if (res.status === 401 && (await Auth.refresh())) {
    res = await fetch(SUPABASE_URL + path, build());
  }
  return res;
}

/* ---------- Persistence ----------
   Everything the user creates is saved to the `app_state` table in Supabase,
   keyed by (user_id, key). Row Level Security scopes every read and write to
   the logged-in account, so the same data appears on a computer, iPad, or
   phone — any browser, not just one.

   The whole account's state is fetched in ONE request at load and held in a
   cache, so the app's existing get/set/delete calls stay synchronous-feeling
   and no board waits on its own round trip.

   Storage is probed exactly once at load. If it's unavailable, the app runs
   precisely as it did before, in memory, instead of white-screening on boot.

   Bump STORAGE_VERSION to deliberately invalidate saved data after a
   breaking change to any persisted shape. */
const STORAGE_VERSION = "v1";
const STORAGE_PREFIX = "studioco:" + STORAGE_VERSION + ":";
const PERSIST_KEYS = ["projects", "tasks", "boardContent", "contentLibrary", "campaignLibrary", "contacts", "theme"];

let storeCache = null;   // { key: rawJsonString }
let storeUserId = null;

async function probeStorageAvailable() {
  try {
    const res = await authedFetch("/rest/v1/app_state?select=key,value", { method: "GET" });
    if (!res.ok) return false;
    const rows = await res.json();
    storeCache = {};
    rows.forEach((r) => { storeCache[r.key] = r.value; });
    const me = await authedFetch("/auth/v1/user", { method: "GET" });
    if (!me.ok) return false;
    storeUserId = (await me.json()).id;
    return true;
  } catch (e) {
    return false;
  }
}

/* tasks[].date is a genuine Date object. JSON silently flattens it to a string,
   which would break every calendar comparison and .getMonth() call on reload,
   so it's revived explicitly on the way back in.

   Deliberately NOT a blanket "looks like a date, make it a Date" reviver: the
   other date-ish fields (project/contact dateAdded, listing dateListed, lead
   inquiryDate and followUp) are plain "YYYY-MM-DD" strings by design and are
   concatenated as strings elsewhere. Converting those would corrupt them. */
const PERSIST_REVIVERS = {
  tasks: (arr) => arr.map((t) => ({ ...t, date: new Date(t.date) })),
};

/* Reads straight from the cache filled by probeStorageAvailable — one network
   round trip for the whole account, not one per key. Returns { key: value }
   for whatever was found; callers fall back to their own seed for anything
   absent. */
async function loadAllPersisted() {
  const out = {};
  if (!storeCache) return out;
  for (const key of PERSIST_KEYS) {
    const raw = storeCache[key];
    if (raw === undefined) continue; // never saved yet — use the seed
    try {
      const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
      const revive = PERSIST_REVIVERS[key];
      out[key] = revive ? revive(parsed) : parsed;
    } catch (e) {
      // The row existed but its contents were corrupt/unparseable. That IS
      // worth a warning — fall back to the seed and let the user keep working.
      console.warn("StudioCo: discarding unreadable saved data for", key, e);
    }
  }
  return out;
}

/* Set once a reset is underway. Without this, clearing storage and reloading
   would trigger the pagehide flush below, which writes current in-memory state
   straight back to storage — instantly resurrecting the data the user just
   asked to delete. */
let suppressPersist = false;

async function savePersisted(key, value, keepalive) {
  if (suppressPersist || !storeUserId) return;
  try {
    const res = await authedFetch("/rest/v1/app_state?on_conflict=user_id,key", {
      method: "POST",
      keepalive: !!keepalive,
      headers: { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ user_id: storeUserId, key, value: JSON.stringify(value), updated_at: new Date().toISOString() }),
    });
    if (!res.ok) console.warn("StudioCo: could not save", key, await res.text());
  } catch (e) {
    console.warn("StudioCo: could not save", key, e);
  }
}

async function clearPersisted() {
  suppressPersist = true; // hold off all writes through the imminent reload
  for (const key of PERSIST_KEYS) {
    try {
      await authedFetch("/rest/v1/app_state?key=eq." + encodeURIComponent(key), { method: "DELETE" });
    } catch (e) {
      // Deleting an already-absent row is a no-op; keep going.
    }
  }
}

/* Drop-in replacement for useState that mirrors its value into storage.
   `initialValue` is the already-resolved value for this key (either what was
   loaded from storage, or the seed) — resolved once up front by
   loadAllPersisted, since window.storage is async and can't back a lazy
   useState initializer the way localStorage could.

   Writes are debounced so typing in a notes field doesn't hit storage on
   every keystroke. */
// Single source of truth for responsive breakpoints. The app is styled with
// inline JS style objects rather than CSS classes, so "responsive" here
// means components read live viewport info and branch their own layout —
// one hook, one set of breakpoints, used everywhere instead of scattering
// ad hoc width checks.
const BREAKPOINT_PHONE = 640;
const BREAKPOINT_TABLET = 1024;
function useViewport() {
  const [width, setWidth] = useState(() => (typeof window !== "undefined" ? window.innerWidth : 1280));
  React.useEffect(() => {
    const onResize = () => setWidth(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return {
    width,
    isPhone: width < BREAKPOINT_PHONE,
    isTablet: width >= BREAKPOINT_PHONE && width < BREAKPOINT_TABLET,
    isCompact: width < BREAKPOINT_TABLET, // phone OR tablet — the common "not full desktop" case
  };
}

function usePersistentState(key, initialValue) {
  const [value, setValue] = useState(initialValue);
  const latest = React.useRef(value);
  latest.current = value;

  React.useEffect(() => {
    const id = setTimeout(() => savePersisted(key, value), 300);
    return () => clearTimeout(id);
  }, [key, value]);

  // A debounced write can still be in flight when the tab closes, so flush
  // synchronously on pagehide — otherwise the last keystrokes are lost.
  React.useEffect(() => {
    const flush = () => savePersisted(key, latest.current, true);
    window.addEventListener("pagehide", flush);
    return () => window.removeEventListener("pagehide", flush);
  }, [key]);

  return [value, setValue];
}

  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      const available = await probeStorageAvailable();
      const persisted = available ? await loadAllPersisted() : {};
      if (cancelled) return;
      setStorageAvailable(available);
      setInitial({
        projects: persisted.projects ?? SEED_PROJECTS,

        campaignLibrary: persisted.campaignLibrary ?? CAMPAIGN_LIBRARY_SEED,

        theme: persisted.theme ?? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
      });
      setReady(true);
    })();
    return () => { cancelled = true; };
  }, []);

        onGoProject={(pid) => { goProject(pid); setNavOpen(false); }}
        storageAvailable={storageAvailable}
        onSignOut={onSignOut}
        email={email}
        viewport={viewport}
        onResetData={async () => {
          // Reloading after clearing is the one reliable way back to a pristine
          // seed state — no risk of a stale slice surviving in memory.
          if (window.confirm("Reset all data?\n\nThis permanently deletes every project, task, board note, contact and listing you've saved, on every device, and restores the original sample projects. This cannot be undone.")) {
            await clearPersisted();
            window.location.reload();
          }
        }}
      />
      {screen.name === "studio" && (
        <StudioScreen
          projects={projects}
          setProjects={setProjects}
          tasks={tasks}
          setTasks={setTasks}
          onOpenProject={goProject}
          tab={studioTab}
          setTab={setStudioTab}
          calMode={calMode}
          setCalMode={setCalMode}
          calCursor={calCursor}
          setCalCursor={setCalCursor}
          contentLibrary={contentLibrary}
          setContentLibrary={setContentLibrary}
          boardContent={boardContent}
          setBoardContent={setBoardContent}
          campaignLibrary={campaignLibrary}
          setCampaignLibrary={setCampaignLibrary}
          contacts={contacts}
          setContacts={setContacts}
        />
      )}
      {screen.name === "projectDashboard" && (
        <ProjectDashboard
          project={projects.find((p) => p.id === screen.projectId)}
          setProjects={setProjects}
          tasks={tasks}
          onBack={goStudio}
          onOpenBoard={goBoard}
          onOpenProduct={goProduct}
        />
      )}
      {screen.name === "product" && (
        <ProductPage
          project={projects.find((p) => p.id === screen.projectId)}
          content={normalizeProduct(boardContent[screen.projectId + ":product"])}
          setContent={(updater) => setBoardContent((prev) => {
            const key = screen.projectId + ":product";
            const current = normalizeProduct(prev[key]);
            const next = typeof updater === "function" ? updater(current) : updater;
            return { ...prev, [key]: next };
          })}
          onBack={() => goProject(screen.projectId)}
        />
      )}
      {screen.name === "board" && (
        <BoardScreen
          projectId={screen.projectId}
          boardKey={screen.boardKey}
          projects={projects}
          onBack={() => goProject(screen.projectId)}
          onSwitchProject={(pid) => goBoard(pid, screen.boardKey)}
          onSwitchBoard={(boardKey) => goBoard(screen.projectId, boardKey)}
          onOpenProduct={goProduct}
          boardContent={boardContent}
          setBoardContent={setBoardContent}
          tasks={tasks}
          setTasks={setTasks}
          contentLibrary={contentLibrary}
          setContentLibrary={setContentLibrary}
          campaignLibrary={campaignLibrary}
          setCampaignLibrary={setCampaignLibrary}
          contacts={contacts}
          setContacts={setContacts}
        />
      )}
    </div>
  );
}

function TopBar({ onLogoClick, breadcrumb, onMenuClick, theme, onToggleTheme, viewport }) {
  const compact = viewport && viewport.isCompact;
  const phone = viewport && viewport.isPhone;
  // On a phone there isn't room for the full trail, so only show where you
  // are now (the last crumb) rather than the whole path back to Home.
  const visibleCrumbs = phone && breadcrumb && breadcrumb.length > 1 ? [breadcrumb[breadcrumb.length - 1]] : breadcrumb;

  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: compact ? "12px 14px" : "16px 32px", borderBottom: `1px solid ${COLORS.ink}`, background: COLORS.paper, gap: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: compact ? 12 : 22, minWidth: 0 }}>
        <button
          onClick={onMenuClick}
          title="Menu"
          aria-label="Open navigation menu"
          style={{ background: "none", border: "none", cursor: "pointer", padding: 4, display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.ink, flexShrink: 0 }}
        >
          <i className="ti ti-menu-2" style={{ fontSize: 20 }} aria-hidden="true" />
        </button>
        <div onClick={onLogoClick} style={{ display: "flex", alignItems: "center", gap: 11, cursor: "pointer", userSelect: "none", flexShrink: 0 }}>
          <div style={{ width: 26, height: 26, background: COLORS.ink, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <div style={{ width: 10, height: 10, background: COLORS.lemon }} />
          </div>
          {!phone && (
            <span style={{ fontSize: 16, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>
              StudioCo
            </span>
          )}
        </div>

        {visibleCrumbs && visibleCrumbs.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 6, borderLeft: `1px solid ${COLORS.hairline}`, paddingLeft: compact ? 10 : 20, minWidth: 0, overflow: "hidden" }}>
            {visibleCrumbs.map((crumb, i) => {
              const isLast = i === visibleCrumbs.length - 1;
              return (
                <React.Fragment key={i}>
                  {i > 0 && <span style={{ fontSize: 11.5, color: COLORS.muted, flexShrink: 0 }}>/</span>}
                  <span
                    onClick={crumb.onClick || undefined}
                    style={{
                      fontSize: isLast ? 13 : 11.5,
                      fontWeight: isLast ? 700 : 500,
                      color: isLast ? COLORS.ink : COLORS.muted,
                      cursor: crumb.onClick ? "pointer" : "default",
                      whiteSpace: "nowrap",
                      overflow: "hidden",
                      textOverflow: "ellipsis",
                    }}
                  >
                    {crumb.label}
                  </span>
                </React.Fragment>
              );
            })}
          </div>
        )}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: compact ? 8 : 14, flexShrink: 0 }}>
        <button
          onClick={onToggleTheme}
          title={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
          aria-label={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
          style={{ background: "none", border: "none", cursor: "pointer", padding: 4, display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.ink }}
        >
          <i className={"ti " + (theme === "dark" ? "ti-sun" : "ti-moon")} style={{ fontSize: 18 }} aria-hidden="true" />
        </button>
        {!phone && <div style={{ width: 30, height: 30, borderRadius: "50%", border: `1px solid ${COLORS.ink}` }} />}
      </div>
    </div>
  );
}

  { key: "task", label: "Task View", icon: "ti-checklist" },
  { key: "library", label: "Content Library", icon: "ti-bookmarks" },
  { key: "contacts", label: "Contacts", icon: "ti-address-book" },

];

/* ---------- Nav Drawer ----------
   A slide-out sidebar (Option 1): hidden off-screen by default, slides in from
   the left when the hamburger button is tapped, and slides back out the moment
   any link is clicked — so it never has to be manually dismissed. Every Studio
   tab and every project is reachable in exactly one click from anywhere. */
function NavDrawer({ open, onClose, projects, studioTab, screen, onGoStudioTab, onGoProject, onResetData, storageAvailable, onSignOut, email }) {
  React.useEffect(() => {
    if (!open) return;
    const handleKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", handleKey);
    return () => document.removeEventListener("keydown", handleKey);
  }, [open, onClose]);

  const activeProjectId = (screen.name === "projectDashboard" || screen.name === "board") ? screen.projectId : null;

  const linkStyle = (active) => ({
    display: "flex",
    alignItems: "center",
    gap: 10,
    padding: "9px 12px",
    borderRadius: RADIUS,
    fontSize: 13,
    fontWeight: active ? 700 : 500,
    color: active ? COLORS.ink : COLORS.muted,
    background: active ? COLORS.cream : "transparent",
    cursor: "pointer",
  });

  return (
    <React.Fragment>
      <div
        onClick={onClose}
        style={{
          position: "fixed",
          inset: 0,
          background: COLORS.scrim,
          opacity: open ? 1 : 0,
          pointerEvents: open ? "auto" : "none",
          transition: "opacity 0.25s ease",
          zIndex: 40,
        }}
      />
      <div
        style={{
          position: "fixed",
          top: 0,
          left: 0,
          bottom: 0,
          width: 280,
          background: COLORS.paper,
          borderRight: `1px solid ${COLORS.ink}`,
          transform: open ? "translateX(0)" : "translateX(-100%)",
          transition: "transform 0.28s ease",
          zIndex: 41,
          overflowY: "auto",
          padding: "20px 16px 32px",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, padding: "0 4px" }}>
          <span style={{ fontSize: 14, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>Menu</span>
          <button onClick={onClose} title="Close" aria-label="Close navigation menu" style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 4 }}>
            <i className="ti ti-x" style={{ fontSize: 16 }} aria-hidden="true" />
          </button>
        </div>

        {STUDIO_NAV_TABS.map((t) => (
          <div key={t.key} onClick={() => onGoStudioTab(t.key)} style={{ ...linkStyle(screen.name === "studio" && studioTab === t.key), marginBottom: t.key === "home" ? 12 : 0 }}>
            <i className={"ti " + t.icon} style={{ fontSize: 15 }} aria-hidden="true" />
            {t.label}
          </div>
        ))}

        <div style={{ fontSize: 9.5, fontWeight: 600, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.04em", padding: "18px 12px 6px" }}>Projects</div>
        {[...projects].sort((a, b) => a.name.localeCompare(b.name)).map((p) => {
          const a = PROJECT_ACCENTS[p.accentIdx];
          return (
            <div key={p.id} onClick={() => onGoProject(p.id)} style={linkStyle(activeProjectId === p.id)}>
              <ProjectIcon icon={p.icon} color={a.hex} size={15} />
              <span style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</span>
            </div>
          );
        })}
        {projects.length === 0 && (
          <div style={{ fontSize: 11.5, color: COLORS.muted, fontStyle: "italic", padding: "0 12px" }}>No projects yet.</div>
        )}

        <div style={{ borderTop: `1px solid ${COLORS.hairline}`, marginTop: 22, paddingTop: 14 }}>
          {storageAvailable ? (
            <div style={{ fontSize: 10.5, color: COLORS.muted, padding: "0 12px 8px", lineHeight: 1.5 }}>
              Your work saves automatically and syncs across your devices.
            </div>
          ) : (
            <div style={{ fontSize: 10.5, color: COLORS.tomato, padding: "0 12px 8px", lineHeight: 1.5 }}>
              Saving is unavailable right now — work will be lost on refresh.
            </div>
          )}
          {email && (
            <div style={{ fontSize: 10.5, color: COLORS.muted, padding: "0 12px 8px", lineHeight: 1.5, wordBreak: "break-all" }}>
              Signed in as {email}
            </div>
          )}
          <div onClick={onSignOut} style={{ ...linkStyle(false), fontSize: 12 }}>
            <i className="ti ti-logout" style={{ fontSize: 14 }} aria-hidden="true" />
            Log out
          </div>
          <div onClick={onResetData} style={{ ...linkStyle(false), color: COLORS.tomato, fontSize: 12 }}>
            <i className="ti ti-trash" style={{ fontSize: 14 }} aria-hidden="true" />
            Reset all data
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------- Home (new landing screen — placeholder, not yet built out) ---------- */
function HomeLanding({ projects, tasks, setTasks, onOpenProject, boardContent, setBoardContent }) {
  const viewport = useViewport();
  const today = appToday();
  const weekEnd = addDays(today, 7);
  // Only one task editable at a time — same pattern as Task View, so the
  // interaction feels identical wherever a task shows up in the app.
  const [editingId, setEditingId] = useState(null);
  const editingRowRef = React.useRef(null);

  React.useEffect(() => {
    if (!editingId) return;
    const handleOutsideClick = (e) => {
      if (editingRowRef.current && !editingRowRef.current.contains(e.target)) {
        setEditingId(null);
      }
    };
    document.addEventListener("pointerdown", handleOutsideClick);
    return () => document.removeEventListener("pointerdown", handleOutsideClick);
  }, [editingId]);

  const todaysTasksAll = tasks
    .filter((t) => isSameDay(t.date, today))
    .sort((a, b) => a.startMinutes - b.startMinutes);
  const todaysTasks = todaysTasksAll.filter((t) => !t.completed);
  const todaysCompleted = todaysTasksAll.filter((t) => t.completed);
  const doneToday = todaysCompleted.length;

  const laterThisWeek = tasks
    .filter((t) => !t.completed && t.date > today && t.date < weekEnd)
    .sort((a, b) => a.date - b.date || a.startMinutes - b.startMinutes)
    .slice(0, 5);

  const toggleTask = (id) =>
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t)));

  const updateTaskField = (id, field, value) =>
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, [field]: value } : t)));

  const projectName = (id) => (projects.find((p) => p.id === id) || {}).name || "";
  const projectAccent = (id) => {
    const p = projects.find((x) => x.id === id);
    return p ? PROJECT_ACCENTS[p.accentIdx].hex : COLORS.muted;
  };

  // Same "completed" definition as Project View's deriveStatus: a project with
  // no tasks isn't done, it just hasn't started — only every task checked off counts.
  const supplyGroups = projects
    .map((p) => {
      const pTasks = tasks.filter((t) => t.projectId === p.id);
      const isCompleted = pTasks.length > 0 && pTasks.every((t) => t.completed);
      if (isCompleted) return null;
      const items = (boardContent[p.id + ":sourcing"] || []).filter((it) => !it.sourced);
      if (!items.length) return null;
      return { project: p, items };
    })
    .filter(Boolean);

  const toggleSupplySourced = (projectId, itemId) => {
    const key = projectId + ":sourcing";
    setBoardContent((prev) => ({
      ...prev,
      [key]: (prev[key] || []).map((it) => (it.id === itemId ? { ...it, sourced: !it.sourced } : it)),
    }));
  };

  const dateLine = `${DAY_NAMES[today.getDay()]}, ${MONTH_NAMES[today.getMonth()]} ${today.getDate()}`;

  // Shared row renderer for both the active and completed Today lists —
  // checkbox toggles completion only; clicking the title opens edit mode
  // (title + due date/time), exactly like Task View. Clicking the project
  // name navigates to that project instead of doing either.
  const renderTodayRow = (t) => {
    const isEditing = editingId === t.id;
    return (
      <div
        key={t.id}
        ref={isEditing ? editingRowRef : null}
        style={{ display: "flex", alignItems: "center", gap: 11, padding: "10px 16px", borderLeft: `3px solid ${projectAccent(t.projectId)}` }}
      >
        <div
          onClick={() => toggleTask(t.id)}
          style={{
            width: 15, height: 15, flexShrink: 0, cursor: "pointer",
            border: `1.5px solid ${t.completed ? projectAccent(t.projectId) : COLORS.hairline}`,
            background: t.completed ? projectAccent(t.projectId) : "transparent",
            borderRadius: 2,
            display: "flex", alignItems: "center", justifyContent: "center",
          }}
        >
          {t.completed && <i className="ti ti-check" style={{ fontSize: 10, color: COLORS.paper }} aria-hidden="true" />}
        </div>

        <div style={{ flex: 1, minWidth: 0 }}>
          {isEditing ? (
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
              <input
                autoFocus
                value={t.title}
                onChange={(e) => updateTaskField(t.id, "title", e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingId(null); }}
                style={{ fontSize: 13, fontFamily: "inherit", background: COLORS.cream, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "3px 6px", flex: 1, minWidth: 120 }}
              />
              <input
                type="date"
                value={dateToInputStr(t.date)}
                onChange={(e) => updateTaskField(t.id, "date", e.target.value ? new Date(e.target.value + "T00:00:00") : t.date)}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingId(null); }}
                style={{ fontSize: 11, fontFamily: "inherit", background: COLORS.cream, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "3px 5px" }}
              />
              <input
                type="time"
                value={minutesToTimeStr(t.startMinutes)}
                onChange={(e) => updateTaskField(t.id, "startMinutes", timeStrToMinutes(e.target.value))}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingId(null); }}
                style={{ fontSize: 11, fontFamily: "inherit", background: COLORS.cream, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "3px 5px" }}
              />
            </div>
          ) : (
            <span
              onClick={() => setEditingId(t.id)}
              style={{ fontSize: 13, fontWeight: 600, textDecoration: t.completed ? "line-through" : "none", color: t.completed ? COLORS.muted : COLORS.ink, cursor: "text" }}
            >
              {t.title}
            </span>
          )}
        </div>

        <span
          onClick={(e) => { e.stopPropagation(); onOpenProject(t.projectId); }}
          style={{ fontSize: 11, color: COLORS.muted, marginLeft: 8, whiteSpace: "nowrap", cursor: "pointer", textDecoration: "underline", textDecorationColor: "transparent" }}
          onMouseEnter={(e) => { e.currentTarget.style.textDecorationColor = COLORS.muted; }}
          onMouseLeave={(e) => { e.currentTarget.style.textDecorationColor = "transparent"; }}
          title={`Go to ${projectName(t.projectId)}`}
        >
          {projectName(t.projectId)}
        </span>
      </div>
    );
  };

  return (
    <div style={{ padding: viewport.isPhone ? "24px 16px 48px" : viewport.isTablet ? "32px 22px 56px" : "40px 32px 64px", maxWidth: 1100, margin: "0 auto" }}>
      {/* Greeting */}
      <div style={{ marginBottom: 32 }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: COLORS.royalBlue, marginBottom: 8 }}>
          {dateLine}
        </div>
        <div style={{ fontSize: viewport.isPhone ? 20 : 26, fontWeight: 700, letterSpacing: "0.01em", color: COLORS.tomato }}>
          {todaysTasksAll.length === 0
            ? "Nothing scheduled today."
            : doneToday === todaysTasksAll.length
            ? "Today's work is done."
            : `${todaysTasksAll.length - doneToday} ${todaysTasksAll.length - doneToday === 1 ? "thing" : "things"} to make today.`}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: viewport.isCompact ? "1fr" : "1fr 1fr", gap: viewport.isPhone ? 32 : 28, alignItems: "start" }}>
        {/* Left: today + week ahead */}
        <div>
          <SectionLabel color={COLORS.royalBlue}>Today</SectionLabel>
          <div style={{ marginTop: 10, background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: todaysTasks.length ? "6px 0" : 20 }}>
            {todaysTasks.length === 0 && (
              <div style={{ fontSize: 12.5, color: COLORS.muted, fontStyle: "italic" }}>
                {todaysTasksAll.length === 0 ? "No tasks scheduled — a good day to sketch something new." : "Everything for today is checked off."}
              </div>
            )}
            {todaysTasks.map(renderTodayRow)}
          </div>

          {todaysCompleted.length > 0 && (
            <div style={{ marginTop: 18 }}>
              <SectionLabel>Completed</SectionLabel>
              <div style={{ marginTop: 10, background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "6px 0" }}>
                {todaysCompleted.map(renderTodayRow)}
              </div>
            </div>
          )}

          <div style={{ marginTop: 26 }}>
            <SectionLabel color={COLORS.royalBlue}>Later this week</SectionLabel>
            <div style={{ marginTop: 10, background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: laterThisWeek.length ? "6px 0" : 20 }}>
              {laterThisWeek.length === 0 && (
                <div style={{ fontSize: 12.5, color: COLORS.muted, fontStyle: "italic" }}>Nothing else scheduled this week.</div>
              )}
              {laterThisWeek.map((t) => (
                <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 11, padding: "9px 16px", borderLeft: `3px solid ${projectAccent(t.projectId)}` }}>
                  <span style={{ fontSize: 12.5, flex: 1, minWidth: 0 }}>{t.title}</span>
                  <span
                    onClick={(e) => { e.stopPropagation(); onOpenProject(t.projectId); }}
                    style={{ fontSize: 11, color: COLORS.muted, whiteSpace: "nowrap", cursor: "pointer", textDecoration: "underline", textDecorationColor: "transparent" }}
                    onMouseEnter={(e) => { e.currentTarget.style.textDecorationColor = COLORS.muted; }}
                    onMouseLeave={(e) => { e.currentTarget.style.textDecorationColor = "transparent"; }}
                    title={`Go to ${projectName(t.projectId)}`}
                  >
                    {projectName(t.projectId)}
                  </span>
                  <span style={{ fontSize: 11, color: COLORS.muted, whiteSpace: "nowrap" }}>
                    {MONTH_NAMES[t.date.getMonth()].slice(0, 3)} {t.date.getDate()}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Right: projects */}
        <div>
          <SectionLabel color={COLORS.royalBlue}>Project Progress Tracker</SectionLabel>
          <div style={{ marginTop: 10, display: "grid", gap: 8 }}>
            {projects.length === 0 && (
              <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 20, fontSize: 12.5, color: COLORS.muted, fontStyle: "italic" }}>
                No projects yet — add one from Project View.
              </div>
            )}
            {projects.map((p) => {
              const a = PROJECT_ACCENTS[p.accentIdx];
              const pTasks = tasks.filter((t) => t.projectId === p.id);
              const done = pTasks.filter((t) => t.completed).length;
              const pct = pTasks.length ? Math.round((done / pTasks.length) * 100) : 0;
              const next = pTasks.filter((t) => !t.completed).sort((x, y) => x.date - y.date)[0];
              return (
                <div
                  key={p.id}
                  onClick={() => onOpenProject(p.id)}
                  style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderLeft: `3px solid ${a.hex}`, borderRadius: RADIUS, padding: "13px 16px", cursor: "pointer" }}
                >
                  <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 8 }}>
                    <ProjectIcon icon={p.icon} color={a.hex} size={16} />
                    <span style={{ fontSize: 13.5, fontWeight: 700 }}>{p.name}</span>
                    <span style={{ fontSize: 11, color: COLORS.muted, marginLeft: "auto" }}>{pct}%</span>
                  </div>
                  <div style={{ height: 3, background: COLORS.hairline, borderRadius: 2, marginBottom: 8 }}>
                    <div style={{ height: 3, width: `${pct}%`, background: a.hex, borderRadius: 2 }} />
                  </div>
                  <div style={{ fontSize: 11, color: COLORS.muted }}>
                    {next ? `Next: ${next.title}` : "All tasks complete"}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Supplies needed across every not-yet-completed project — pulls from
          each project's own Supplies list on the Making Of board, so there's
          nothing new to maintain here. */}
      <div style={{ marginTop: 28 }}>

/* ---------- Analytics ----------
   A cross-project rollup — nothing here is entered by hand. It reads live from
   each project's Content board (performance, from Marketing) and Sales board
   (listings), the same way the Marketing/Sales boards already do per-project.
   Three views: a leaderboard (what's working), a revenue trend (momentum over
   time, from Listings' Date listed field — the one place we have real dates),
   and a full computed table (everything, sortable). */
function buildAnalyticsRows(projects, boardContent) {
  const rows = [];
  projects.forEach((p) => {
    const contentData = boardContent[p.id + ":content"] || { pieces: [] };
    const marketingData = boardContent[p.id + ":marketing"] || { performance: {} };
    const salesData = boardContent[p.id + ":sales"] || { listings: [] };
    const performance = marketingData.performance || {};

    (contentData.pieces || []).forEach((piece) => {
      const perf = performance[piece.id] || {};
      rows.push({
        id: "content-" + piece.id,
        projectId: p.id,
        projectName: p.name,
        type: "Content",
        title: (piece.title && piece.title.trim()) || "Untitled content piece",
        platform: piece.type || "—",
        reach: Number(perf.reach) || 0,
        secondary: Number(perf.engagement) || 0,
        revenue: 0,
        date: null,
      });
    });

    (salesData.listings || []).forEach((listing) => {
      rows.push({
        id: "listing-" + listing.id,
        projectId: p.id,
        projectName: p.name,
        type: "Listing",
        title: (listing.title && listing.title.trim()) || "Untitled listing",
        platform: listing.platform || "—",
        reach: Number(listing.views) || 0,
        secondary: Number(listing.sales) || 0,
        revenue: Number(listing.revenue) || 0,
        date: listing.dateListed || null,
      });
    });
  });
  return rows;
}

const ANALYTICS_COLUMNS = "1fr 1.6fr 90px 100px 100px 100px 100px";

function AnalyticsView({ projects, boardContent, onOpenProject }) {
  const rows = useMemo(() => buildAnalyticsRows(projects, boardContent), [projects, boardContent]);
  const contentRows = rows.filter((r) => r.type === "Content");
  const listingRows = rows.filter((r) => r.type === "Listing");
  const hasAnyData = rows.length > 0;

  const [sortCol, setSortCol] = useState("Reach/Views");
  const [sortDir, setSortDir] = useState(-1);

  const handleHeaderClick = (col) => {
    if (sortCol === col) setSortDir((d) => d * -1);
    else { setSortCol(col); setSortDir(-1); }
  };

  const compare = (a, b) => {
    if (sortCol === "Project") return a.projectName.localeCompare(b.projectName);
    if (sortCol === "Title") return a.title.localeCompare(b.title);
    if (sortCol === "Type") return a.type.localeCompare(b.type);
    if (sortCol === "Reach/Views") return a.reach - b.reach;
    if (sortCol === "Eng./Sales") return a.secondary - b.secondary;
    if (sortCol === "Revenue") return a.revenue - b.revenue;
    return 0;
  };
  const sortedRows = [...rows].sort((a, b) => compare(a, b) * sortDir);

  const headerCellStyle = { fontSize: 9.5, fontWeight: 600, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.04em" };
  const sortableHeader = (label) => (
    <div onClick={() => handleHeaderClick(label)} style={{ ...headerCellStyle, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
      {label} {sortCol === label && <span style={{ fontSize: 9 }}>{sortDir === 1 ? "▼" : "▲"}</span>}
    </div>
  );

  if (!hasAnyData) {
    return (
      <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 40, textAlign: "center" }}>
        <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 6 }}>No analytics yet</div>
        <div style={{ fontSize: 12, color: COLORS.muted, maxWidth: 420, margin: "0 auto" }}>
          This view pulls live from each project's Content performance (Marketing board) and Listings (Sales board) — add some numbers there and they'll show up here automatically.
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 28, alignItems: "start" }}>
        <Leaderboard title="Top content by reach" rows={contentRows} metricKey="reach" metricLabel="reach" accentHex={COLORS.royalBlue} onOpenProject={onOpenProject} />
        <Leaderboard title="Top listings by revenue" rows={listingRows} metricKey="revenue" metricLabel="revenue" isCurrency accentHex={COLORS.tomato} onOpenProject={onOpenProject} />
      </div>

      <div style={{ marginBottom: 28 }}>
        <SectionLabel>Revenue over time</SectionLabel>
        <div style={{ marginTop: 10 }}>
          <RevenueTrendChart listingRows={listingRows} />
        </div>
      </div>

      <div>
        <SectionLabel>All content &amp; listings</SectionLabel>
        <div style={{ marginTop: 10, background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 20 }}>
          <div style={{ display: "grid", gridTemplateColumns: ANALYTICS_COLUMNS, gap: 12, padding: "0 4px 8px", borderBottom: `1px solid ${COLORS.ink}` }}>
            {sortableHeader("Project")}
            {sortableHeader("Title")}
            {sortableHeader("Type")}
            <div style={headerCellStyle}>Platform</div>
            {sortableHeader("Reach/Views")}
            {sortableHeader("Eng./Sales")}
            {sortableHeader("Revenue")}
          </div>
          {sortedRows.map((r) => (
            <div
              key={r.id}
              onClick={() => onOpenProject && onOpenProject(r.projectId)}
              style={{ display: "grid", gridTemplateColumns: ANALYTICS_COLUMNS, gap: 12, alignItems: "center", padding: "9px 4px", borderBottom: `1px solid ${COLORS.hairline}`, cursor: onOpenProject ? "pointer" : "default" }}
            >
              <span style={{ fontSize: 12, color: COLORS.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.projectName}</span>
              <span style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.title}</span>
              <span style={{ fontSize: 11, color: COLORS.muted }}>{r.type}</span>
              <span style={{ fontSize: 11, color: COLORS.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.platform}</span>
              <span style={{ fontSize: 12 }}>{r.reach.toLocaleString()}</span>
              <span style={{ fontSize: 12 }}>{r.secondary.toLocaleString()}</span>
              <span style={{ fontSize: 12 }}>{r.revenue ? "$" + r.revenue.toLocaleString() : "—"}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Leaderboard({ title, rows, metricKey, metricLabel, isCurrency, accentHex, onOpenProject }) {
  const top = [...rows].sort((a, b) => b[metricKey] - a[metricKey]).filter((r) => r[metricKey] > 0).slice(0, 5);
  const maxVal = top.length ? top[0][metricKey] : 0;

  return (
    <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 18 }}>
      <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 14 }}>{title}</div>
      {top.length === 0 && (
        <div style={{ fontSize: 11.5, color: COLORS.muted, fontStyle: "italic" }}>Nothing with {metricLabel} logged yet.</div>
      )}
      {top.map((r, i) => (
        <div
          key={r.id}
          onClick={() => onOpenProject && onOpenProject(r.projectId)}
          style={{ marginBottom: i === top.length - 1 ? 0 : 10, cursor: onOpenProject ? "pointer" : "default" }}
        >
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 3 }}>
            <span style={{ fontSize: 11.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: "75%" }}>
              <span style={{ color: COLORS.muted, marginRight: 6 }}>{i + 1}.</span>{r.title}
            </span>
            <span style={{ fontSize: 11, color: COLORS.muted, flexShrink: 0 }}>{isCurrency ? "$" : ""}{r[metricKey].toLocaleString()}</span>
          </div>
          <div style={{ height: 4, background: COLORS.hairline, borderRadius: 2 }}>
            <div style={{ height: 4, width: `${maxVal ? (r[metricKey] / maxVal) * 100 : 0}%`, background: accentHex, borderRadius: 2 }} />
          </div>
        </div>
      ))}
    </div>
  );
}

function RevenueTrendChart({ listingRows }) {
  const dated = listingRows.filter((r) => r.date && r.revenue > 0);

  if (dated.length === 0) {
    return (
      <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 24, textAlign: "center" }}>
        <div style={{ fontSize: 11.5, color: COLORS.muted, fontStyle: "italic" }}>
          No dated revenue yet — set a Date listed and Revenue on a listing (Sales board) to chart momentum here.
        </div>
      </div>
    );
  }

  // Bucket revenue by week (Sunday-start), using the same week convention as the Calendar.
  const buckets = {};
  dated.forEach((r) => {
    const d = new Date(r.date + "T00:00:00");
    const weekStart = startOfWeek(d);
    const key = weekStart.toISOString().slice(0, 10);
    buckets[key] = (buckets[key] || 0) + r.revenue;
  });
  const weeks = Object.keys(buckets).sort();
  const maxRevenue = Math.max(...weeks.map((k) => buckets[k]));

  return (
    <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "20px 24px 14px" }}>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 14, height: 140 }}>
        {weeks.map((k) => {
          const val = buckets[k];
          const h = maxRevenue ? Math.max((val / maxRevenue) * 120, 3) : 3;
          const d = new Date(k + "T00:00:00");
          return (
            <div key={k} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1 }}>
              <div style={{ fontSize: 10, color: COLORS.muted, marginBottom: 4 }}>${val.toLocaleString()}</div>
              <div style={{ width: "100%", maxWidth: 36, height: h, background: COLORS.royalBlue, borderRadius: "2px 2px 0 0" }} />
              <div style={{ fontSize: 9.5, color: COLORS.muted, marginTop: 6, whiteSpace: "nowrap" }}>{MONTH_NAMES[d.getMonth()].slice(0, 3)} {d.getDate()}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Content Library ----------
   Shared vocabulary for Content Board's Type and Series fields — reused across
   every project, so the same names mean the same thing everywhere. Also
   editable inline from the Content Board itself via "+ Add new…" in each dropdown. */
function ContentLibraryView({ contentLibrary, setContentLibrary, boardContent, setBoardContent }) {
  // Renaming a library entry must also update every content piece that currently
  // references the old value by name, or those pieces silently fall out of sync.
  const propagateRename = (field, oldVal, newVal) => {
    setBoardContent((prev) => {
      const next = { ...prev };
      for (const key of Object.keys(next)) {
        if (!key.endsWith(":content")) continue;
        const entry = next[key];
        if (!entry || !entry.pieces) continue;
        next[key] = {
          ...entry,
          pieces: entry.pieces.map((p) => (p[field] === oldVal ? { ...p, [field]: newVal } : p)),
        };
      }
      return next;
    });
  };

  return (
    <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 24 }}>
      <div style={{ fontSize: 11.5, color: COLORS.muted, marginBottom: 20, lineHeight: 1.5 }}>
        Shared across every project's Content board — rename or remove here, and it updates everywhere it's used.
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 32 }}>
        <LibraryListEditor
          title="Content types"
          items={contentLibrary.types}
          onAdd={(val) => setContentLibrary((prev) => ({ ...prev, types: [...prev.types, val] }))}
          onRemove={(val) => setContentLibrary((prev) => ({ ...prev, types: prev.types.filter((v) => v !== val) }))}
          onEdit={(oldVal, newVal) => {
            setContentLibrary((prev) => ({ ...prev, types: prev.types.map((v) => (v === oldVal ? newVal : v)) }));
            propagateRename("type", oldVal, newVal);
          }}
          placeholder="Add a content type…"
        />
        <LibraryListEditor
          title="Series"
          items={contentLibrary.series}
          onAdd={(val) => setContentLibrary((prev) => ({ ...prev, series: [...prev.series, val] }))}
          onRemove={(val) => setContentLibrary((prev) => ({ ...prev, series: prev.series.filter((v) => v !== val) }))}
          onEdit={(oldVal, newVal) => {
            setContentLibrary((prev) => ({ ...prev, series: prev.series.map((v) => (v === oldVal ? newVal : v)) }));
            propagateRename("series", oldVal, newVal);
          }}
          placeholder="Add a series…"
        />
      </div>
    </div>
  );
}

function LibraryListEditor({ title, items, onAdd, onRemove, onEdit, placeholder }) {
  const [newVal, setNewVal] = useState("");
  const [editingVal, setEditingVal] = useState(null);
  const [editDraft, setEditDraft] = useState("");

  const submit = () => {
    const val = newVal.trim();
    if (!val || items.includes(val)) return;
    onAdd(val);
    setNewVal("");
  };

  const startEdit = (val) => {
    setEditingVal(val);
    setEditDraft(val);
  };

  const commitEdit = () => {
    const val = editDraft.trim();
    if (val && val !== editingVal && !items.includes(val)) {
      onEdit(editingVal, val);
    }
    setEditingVal(null);
    setEditDraft("");
  };

  return (
    <div>
      <SectionLabel>{title}</SectionLabel>
      <div style={{ marginTop: 10, marginBottom: 10 }}>
        {items.length === 0 && (
          <div style={{ fontSize: 12, color: COLORS.muted, fontStyle: "italic" }}>None yet.</div>
        )}
        {items.map((val) => (
          <div key={val} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${COLORS.hairline}` }}>
            {editingVal === val ? (
              <input
                autoFocus
                value={editDraft}
                onChange={(e) => setEditDraft(e.target.value)}
                onBlur={commitEdit}
                onKeyDown={(e) => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") { setEditingVal(null); setEditDraft(""); } }}
                style={{
                  flex: 1,
                  background: COLORS.cream,
                  border: `1px solid ${COLORS.hairline}`,
                  borderRadius: RADIUS,
                  padding: "5px 8px",
                  fontSize: 13,
                  fontFamily: "inherit",
                  color: COLORS.ink,
                  marginRight: 8,
                }}
              />
            ) : (
              <span onClick={() => startEdit(val)} style={{ fontSize: 13, cursor: "text", flex: 1 }}>{val}</span>
            )}
            <button onClick={() => onRemove(val)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 0 }}>
              <i className="ti ti-x" style={{ fontSize: 13 }} aria-hidden="true" />
            </button>
          </div>
        ))}
      </div>
      <input
        value={newVal}
        onChange={(e) => setNewVal(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
        placeholder={placeholder}
        style={{
          width: "100%",
          background: COLORS.cream,
          border: `1px solid ${COLORS.hairline}`,
          borderRadius: RADIUS,
          padding: "9px 12px",
          fontSize: 13,
          fontFamily: "inherit",
          color: COLORS.ink,
        }}
      />
    </div>
  );
}

/* ---------- Campaign Library ----------
   Shared, reusable outreach templates (email/DM copy with [placeholder] fields) —
   used across every project's Marketing board, editable and copy-to-clipboard ready. */
function CampaignLibraryView({ campaignLibrary, setCampaignLibrary }) {
  const [newName, setNewName] = useState("");

  const addTemplate = () => {
    const name = newName.trim();
    if (!name) return;
    setCampaignLibrary((prev) => [...prev, { id: "tmpl-" + Date.now(), name, body: "" }]);
    setNewName("");
  };

  const updateTemplate = (id, field, value) => {
    setCampaignLibrary((prev) => prev.map((t) => (t.id === id ? { ...t, [field]: value } : t)));
  };

  const removeTemplate = (id) => {
    setCampaignLibrary((prev) => prev.filter((t) => t.id !== id));
  };

  return (
    <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 24 }}>
      <div style={{ fontSize: 11.5, color: COLORS.muted, marginBottom: 20, lineHeight: 1.5 }}>
        Reusable outreach templates — shared across every project's Marketing board. Fill in the [bracketed] parts before sending.
      </div>

      {campaignLibrary.map((t) => (
        <CampaignTemplateCard
          key={t.id}
          template={t}
          onUpdate={(field, value) => updateTemplate(t.id, field, value)}
          onRemove={() => removeTemplate(t.id)}
        />
      ))}

      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <input
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") addTemplate(); }}
          placeholder="New template name…"
          style={{
            flex: 1,
            background: COLORS.cream,
            border: `1px solid ${COLORS.hairline}`,
            borderRadius: RADIUS,
            padding: "9px 12px",
            fontSize: 13,
            fontFamily: "inherit",
            color: COLORS.ink,
          }}
        />
        <button
          onClick={addTemplate}
          style={{ background: COLORS.ink, color: COLORS.paper, border: `1px solid ${COLORS.ink}`, borderRadius: RADIUS, padding: "0 18px", fontSize: 13, fontWeight: 700, fontFamily: "inherit", cursor: "pointer" }}
        >
          Add
        </button>
      </div>
    </div>
  );
}

function CampaignTemplateCard({ template, onUpdate, onRemove }) {
  const [copied, setCopied] = useState(false);
  const [editingName, setEditingName] = useState(false);
  const [nameDraft, setNameDraft] = useState(template.name);

  const doCopy = async () => {
    try {
      await navigator.clipboard.writeText(template.body);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {
      // Clipboard API can be blocked in some contexts — fail quietly, the text is still visible to select manually.
    }
  };

  const commitName = () => {
    const val = nameDraft.trim();
    if (val) onUpdate("name", val);
    setEditingName(false);
  };

  return (
    <div style={{ border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 16, marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        {editingName ? (
          <input
            autoFocus
            value={nameDraft}
            onChange={(e) => setNameDraft(e.target.value)}
            onBlur={commitName}
            onKeyDown={(e) => { if (e.key === "Enter") commitName(); if (e.key === "Escape") { setNameDraft(template.name); setEditingName(false); } }}
            style={{
              fontSize: 13.5,
              fontWeight: 700,
              background: COLORS.cream,
              border: `1px solid ${COLORS.hairline}`,
              borderRadius: RADIUS,
              padding: "4px 8px",
              fontFamily: "inherit",
              color: COLORS.ink,
            }}
          />
        ) : (
          <span onClick={() => { setNameDraft(template.name); setEditingName(true); }} style={{ fontSize: 13.5, fontWeight: 700, cursor: "text" }}>
            {template.name}
          </span>
        )}

        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button
            onClick={doCopy}
            style={{
              background: "none",
              border: `1px solid ${COLORS.hairline}`,
              borderRadius: RADIUS,
              padding: "5px 12px",
              fontSize: 11.5,
              fontWeight: 600,
              fontFamily: "inherit",
              color: copied ? COLORS.ink : COLORS.muted,
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              gap: 5,
            }}
          >
            <i className={"ti " + (copied ? "ti-check" : "ti-copy")} style={{ fontSize: 12 }} aria-hidden="true" />
            {copied ? "Copied" : "Copy"}
          </button>
          <button onClick={onRemove} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 0 }}>
            <i className="ti ti-x" style={{ fontSize: 14 }} aria-hidden="true" />
          </button>
        </div>
      </div>

      <textarea
        value={template.body}
        onChange={(e) => onUpdate("body", e.target.value)}
        placeholder="Write the template — use [Client Name], [date], etc. for the parts you'll fill in each time…"
        style={{
          width: "100%",
          minHeight: 110,
          background: COLORS.cream,
          border: `1px solid ${COLORS.hairline}`,
          borderRadius: RADIUS,
          padding: "10px 12px",
          fontSize: 12.5,
          fontFamily: "inherit",
          color: COLORS.ink,
          resize: "vertical",
          lineHeight: 1.5,
        }}
      />
    </div>
  );
}

/* ---------- Contacts ----------
   Shared across every project — a customer, gallery, or shop you've dealt with
   isn't tied to one project's lifecycle, so this lives at the Studio level and
   is referenced (not duplicated) from Sales Leads on any project's Sales board. */
const CONTACT_RELATIONSHIPS = ["Customer", "Gallery", "Shop", "Collaborator", "Press", "Other"];

const CONTACT_COLUMNS = "1fr 1.3fr 1fr 90px 100px 1.3fr 20px";

function ContactsView({ contacts, setContacts }) {
  const [draft, setDraft] = useState({ name: "", email: "", phone: "", relationship: "Customer", notes: "" });
  const [editingId, setEditingId] = useState(null);
  const [justAddedId, setJustAddedId] = useState(null);
  // Default sort is always alphabetical by name — new entries auto-sort since we
  // re-sort the array on every render instead of relying on insertion order.
  const [sortCol, setSortCol] = useState("Name");
  const [sortDir, setSortDir] = useState(1);

  const fieldStyle = {
    background: COLORS.cream,
    border: `1px solid ${COLORS.hairline}`,
    borderRadius: RADIUS,
    padding: "7px 10px",
    fontSize: 12.5,
    fontFamily: "inherit",
    color: COLORS.ink,
    width: "100%",
  };

  const submitAdd = () => {
    if (!draft.name.trim()) return;
    const todayIso = appToday().toISOString().slice(0, 10);
    const id = "contact-" + Date.now();
    setContacts((prev) => [...prev, { id, ...draft, name: draft.name.trim(), dateAdded: todayIso }]);
    setDraft({ name: "", email: "", phone: "", relationship: "Customer", notes: "" });
    setJustAddedId(id);
  };

  const updateContact = (id, field, value) => {
    setContacts((prev) => prev.map((c) => (c.id === id ? { ...c, [field]: value } : c)));
  };

  const removeContact = (id) => {
    setContacts((prev) => prev.filter((c) => c.id !== id));
    if (editingId === id) setEditingId(null);
  };

  const handleHeaderClick = (col) => {
    if (sortCol === col) {
      setSortDir((d) => d * -1);
    } else {
      setSortCol(col);
      setSortDir(1);
    }
  };

  // dateAdded only has day-level precision, so same-day contacts would otherwise
  // tie and not reorder — fall back to the timestamp encoded in the id (creation order).
  const idTime = (c) => {
    const m = /(\d+)$/.exec(c.id || "");
    return m ? parseInt(m[1], 10) : 0;
  };

  const compare = (a, b) => {
    if (sortCol === "Name") return a.name.localeCompare(b.name);
    if (sortCol === "Date added") {
      const da = a.dateAdded ? new Date(a.dateAdded).getTime() : 0;
      const db = b.dateAdded ? new Date(b.dateAdded).getTime() : 0;
      if (da !== db) return db - da; // base order: most recent day first
      return idTime(b) - idTime(a); // same day — most recently created first
    }
    return 0;
  };

  const sorted = [...contacts].sort((a, b) => compare(a, b) * sortDir);

  const headerCellStyle = { fontSize: 9.5, fontWeight: 600, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.04em" };

  return (
    <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 24 }}>
      <div style={{ fontSize: 11.5, color: COLORS.muted, lineHeight: 1.5, marginBottom: 16 }}>
        Shared across every project — reference these from Sales Leads instead of retyping contact info each time.
      </div>

      <div style={{ border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 14, marginBottom: 16 }}>
        <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>New contact</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 120px", gap: 8, marginBottom: 8 }}>
          <input value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} placeholder="Name" style={fieldStyle} />
          <input value={draft.email} onChange={(e) => setDraft({ ...draft, email: e.target.value })} placeholder="Email" style={fieldStyle} />
          <input value={draft.phone} onChange={(e) => setDraft({ ...draft, phone: e.target.value })} placeholder="Phone" style={fieldStyle} />
          <select value={draft.relationship} onChange={(e) => setDraft({ ...draft, relationship: e.target.value })} style={{ ...fieldStyle, cursor: "pointer" }}>
            {CONTACT_RELATIONSHIPS.map((r) => <option key={r} value={r}>{r}</option>)}
          </select>
        </div>
        <textarea value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} placeholder="Notes…" style={{ ...fieldStyle, minHeight: 44, resize: "vertical", marginBottom: 8 }} />
        <div style={{ display: "flex", justifyContent: "flex-end" }}>
          <button onClick={submitAdd} style={{ ...navBtnStyle, background: COLORS.ink, color: COLORS.paper, border: `1px solid ${COLORS.ink}` }}>+ Add contact</button>
        </div>
      </div>

      {contacts.length === 0 && (
        <div style={{ fontSize: 12.5, color: COLORS.muted, fontStyle: "italic" }}>No contacts yet.</div>
      )}

      {contacts.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: CONTACT_COLUMNS, gap: 12, padding: "0 4px 8px", borderBottom: `1px solid ${COLORS.ink}` }}>
          <div onClick={() => handleHeaderClick("Name")} style={{ ...headerCellStyle, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
            Name {sortCol === "Name" && <span style={{ fontSize: 9 }}>{sortDir === 1 ? "▼" : "▲"}</span>}
          </div>
          <div style={headerCellStyle}>Email</div>
          <div style={headerCellStyle}>Number</div>
          <div style={headerCellStyle}>Type</div>
          <div onClick={() => handleHeaderClick("Date added")} style={{ ...headerCellStyle, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
            Date added {sortCol === "Date added" && <span style={{ fontSize: 9 }}>{sortDir === 1 ? "▼" : "▲"}</span>}
          </div>
          <div style={headerCellStyle}>Quick notes</div>
          <div />
        </div>
      )}

      {sorted.map((c) => (
        <ContactRow
          key={c.id}
          contact={c}
          isEditing={editingId === c.id}
          onEdit={() => setEditingId(c.id)}
          onDone={() => setEditingId(null)}
          onUpdate={(field, value) => updateContact(c.id, field, value)}
          onRemove={() => removeContact(c.id)}
          justAdded={justAddedId === c.id}
        />
      ))}
    </div>
  );
}

function ContactRow({ contact, isEditing, onEdit, onDone, onUpdate, onRemove, justAdded }) {
  const fieldStyle = {
    background: COLORS.cream,
    border: `1px solid ${COLORS.hairline}`,
    borderRadius: RADIUS,
    padding: "5px 8px",
    fontSize: 12,
    fontFamily: "inherit",
    color: COLORS.ink,
    width: "100%",
  };

  const fmtShortIso = (iso) => {
    if (!iso) return "—";
    const d = new Date(iso + "T00:00:00");
    return `${MONTH_NAMES[d.getMonth()].slice(0, 3).toUpperCase()} ${String(d.getDate()).padStart(2, "0")}, ${d.getFullYear()}`;
  };

  if (isEditing) {
    return (
      <div style={{ border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 14, marginBottom: 8 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 120px", gap: 8, marginBottom: 8 }}>
          <input value={contact.name} onChange={(e) => onUpdate("name", e.target.value)} style={fieldStyle} />
          <input value={contact.email} onChange={(e) => onUpdate("email", e.target.value)} style={fieldStyle} />
          <input value={contact.phone} onChange={(e) => onUpdate("phone", e.target.value)} style={fieldStyle} />
          <select value={contact.relationship} onChange={(e) => onUpdate("relationship", e.target.value)} style={{ ...fieldStyle, cursor: "pointer" }}>
            {CONTACT_RELATIONSHIPS.map((r) => <option key={r} value={r}>{r}</option>)}
          </select>
        </div>
        <textarea value={contact.notes} onChange={(e) => onUpdate("notes", e.target.value)} style={{ ...fieldStyle, minHeight: 40, resize: "vertical", marginBottom: 8 }} />
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button onClick={onRemove} style={{ ...navBtnStyle, color: COLORS.tomato }}>Delete</button>
          <button onClick={onDone} style={{ ...navBtnStyle, background: COLORS.ink, color: COLORS.paper, border: `1px solid ${COLORS.ink}` }}>Done</button>
        </div>
      </div>
    );
  }

  return (
    <div
      onClick={onEdit}
      className={justAdded ? "flash-save" : ""}
      style={{ display: "grid", gridTemplateColumns: CONTACT_COLUMNS, gap: 12, alignItems: "center", padding: "10px 4px", borderBottom: `1px solid ${COLORS.hairline}`, cursor: "pointer" }}
    >
      <span style={{ fontSize: 13, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{contact.name}</span>
      <span style={{ fontSize: 11.5, color: COLORS.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{contact.email || "—"}</span>
      <span style={{ fontSize: 11.5, color: COLORS.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{contact.phone || "—"}</span>
      <span style={{ fontSize: 11.5, color: COLORS.muted }}>{contact.relationship || "—"}</span>
      <span style={{ fontSize: 11.5, color: COLORS.muted }}>{fmtShortIso(contact.dateAdded)}</span>
      <span style={{ fontSize: 11.5, color: COLORS.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{contact.notes || "—"}</span>
      <span />
    </div>
  );
}

/* ---------- Calendar View ---------- */
function CalendarView({ projects, tasks, setTasks, onOpenProject, mode, setMode, cursor, setCursor }) {
  const viewport = useViewport();
  const [projectFilter, setProjectFilter] = useState("All");
  const today = appToday();

  const filteredTasks = useMemo(
    () => (projectFilter === "All" ? tasks : tasks.filter((t) => t.projectId === projectFilter)),
    [tasks, projectFilter]
  );
  const projectAccent = (projectId) => {
    const p = projects.find((pp) => pp.id === projectId);
    return p ? PROJECT_ACCENTS[p.accentIdx] : PROJECT_ACCENTS[0];
  };

  const shiftCursor = (dir) => {
    const r = new Date(cursor);
    if (mode === "Year") r.setFullYear(r.getFullYear() + dir);
    else if (mode === "Month") r.setMonth(r.getMonth() + dir);
    else if (mode === "Week") r.setDate(r.getDate() + dir * 7);
    else r.setDate(r.getDate() + dir);
    setCursor(r);
  };

  const headerLabel = () => {
    if (mode === "Year") return `${cursor.getFullYear()}`;
    if (mode === "Month") return `${MONTH_NAMES[cursor.getMonth()]} ${cursor.getFullYear()}`;
    if (mode === "Week") {
      const s = startOfWeek(cursor);
      const e = addDays(s, 6);
      return `${MONTH_NAMES[s.getMonth()]} ${s.getDate()} – ${e.getMonth() !== s.getMonth() ? MONTH_NAMES[e.getMonth()] + " " : ""}${e.getDate()}, ${e.getFullYear()}`;
    }
    return `${DAY_NAMES[cursor.getDay()]}, ${MONTH_NAMES[cursor.getMonth()]} ${cursor.getDate()}, ${cursor.getFullYear()}`;
  };

  return (
    <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: 24 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 22, flexWrap: "wrap", gap: 14 }}>
        {mode === "Year" ? (
          <div />
        ) : (
          <FilterDropdown
            label="Project"
            value={projectFilter}
            onChange={setProjectFilter}
            options={["All", ...projects.map((p) => p.id)]}
            renderOption={(v) => (v === "All" ? "All" : projects.find((p) => p.id === v)?.name)}
          />
        )}

        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button style={navBtnStyle} onClick={() => setCursor(today)}>Today</button>
          <button style={navBtnStyle} onClick={() => shiftCursor(-1)}>‹</button>
          <span style={{ fontSize: 14, fontWeight: 700, minWidth: 220, textAlign: "center", letterSpacing: "0.01em" }}>
            {headerLabel()}
          </span>
          <button style={navBtnStyle} onClick={() => shiftCursor(1)}>›</button>
        </div>

        <div style={{ display: "flex", border: `1px solid ${COLORS.hairline}` }}>
          {["Day", "Week", "Month", "Year"].map((m, i) => (
            <button
              key={m}
              onClick={() => setMode(m)}
              style={{
                border: "none",
                borderLeft: i > 0 ? `1px solid ${COLORS.hairline}` : "none",
                background: mode === m ? COLORS.ink : COLORS.paper,
                color: mode === m ? COLORS.paper : COLORS.ink,
                padding: "7px 15px",
                fontSize: 12,
                fontWeight: 600,
                fontFamily: "inherit",
                letterSpacing: "0.05em",
                textTransform: "uppercase",
                cursor: "pointer",
              }}
            >
              {m}
            </button>
          ))}
        </div>
      </div>

      {mode === "Year" && <YearGrid cursor={cursor} today={today} onPickMonth={(d) => { setCursor(d); setMode("Month"); }} viewport={viewport} />}
      {mode === "Month" && <MonthGrid cursor={cursor} today={today} tasks={filteredTasks} projects={projects} projectAccent={projectAccent} onPickDay={(d) => { setCursor(d); setMode("Day"); }} onCursorMonthChange={setCursor} onOpenProject={onOpenProject} />}
      {mode === "Week" && <WeekGrid cursor={cursor} today={today} tasks={filteredTasks} setTasks={setTasks} projects={projects} projectAccent={projectAccent} onOpenProject={onOpenProject} />}
      {mode === "Day" && <WeekGrid cursor={cursor} today={today} tasks={filteredTasks} setTasks={setTasks} projects={projects} projectAccent={projectAccent} onOpenProject={onOpenProject} setCursor={setCursor} singleDay />}
    </div>
  );
}

function DropdownArrow() {

    <svg width="9" height="6" viewBox="0 0 9 6" fill="none" style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" }}>
