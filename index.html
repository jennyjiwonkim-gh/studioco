const PLATFORM_CONNECT_INFO = {
  Shopify: "Real Shopify integration needs OAuth and a connected backend server — not available in this prototype yet.",
  Etsy: "Real Etsy integration needs OAuth and a connected backend server — not available in this prototype yet.",
  Direct: null,
  Other: null,
};

function ListingCard({ listing, isExpanded, onToggle, onUpdate, onRemove, contentPieces, accentHex, justAdded, productContent, onOpenProduct }) {
  const [showConnectInfo, setShowConnectInfo] = useState(false);
  const [showAutofill, setShowAutofill] = useState(false);
  const connectInfo = PLATFORM_CONNECT_INFO[listing.platform];

  const fieldStyle = {
    background: COLORS.cream,
    border: `1px solid ${COLORS.hairline}`,
    borderRadius: RADIUS,
    padding: "6px 9px",
    fontSize: 12,
    fontFamily: "inherit",
    color: COLORS.ink,
    width: "100%",
  };
  const labelStyle = { fontSize: 9.5, fontWeight: 600, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 4 };
  const displayTitle = (listing.title && listing.title.trim()) || "Untitled listing";

  // Quantity/sold are no longer edited here — the Product page is the one
  // source of truth for physical inventory (the same pieces might be listed
  // on several platforms at once, so there's only ever one real count).
  // We still mirror the derived numbers into listing.quantity/sales so the
  // Analytics dashboard, which reads those fields directly, keeps working
  // without needing its own copy of this logic.
  const units = (productContent && productContent.units) || [];
  const qty = units.length;
  const sold = units.filter((u) => u.sold).length;

  React.useEffect(() => {
    if (String(listing.quantity) !== String(qty)) onUpdate("quantity", String(qty));
    if (String(listing.sales) !== String(sold)) onUpdate("sales", String(sold));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [qty, sold]);

  const applyAutofill = (piece) => {
    onUpdate("description", piece.caption || piece.voiceover || "");
    setShowAutofill(false);
  };

  return (
    <div className={justAdded ? "flash-save" : ""} style={{ border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, marginBottom: 10, overflow: "hidden" }}>
      <div
        onClick={onToggle}
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "12px 16px",
          cursor: "pointer",
          background: isExpanded ? COLORS.cream : COLORS.paper,
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          <i className={"ti " + (isExpanded ? "ti-chevron-down" : "ti-chevron-right")} style={{ fontSize: 14, color: COLORS.muted, flexShrink: 0 }} aria-hidden="true" />
          <span style={{ fontSize: 13.5, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{displayTitle}</span>
          {listing.price && <span style={{ fontSize: 11, color: COLORS.muted, flexShrink: 0 }}>${listing.price}</span>}
          {qty > 0 && <span style={{ fontSize: 11, color: COLORS.muted, flexShrink: 0 }}>{sold} of {qty} sold</span>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
          <span style={{ fontSize: 10.5, color: COLORS.muted }}>{listing.platform}</span>
          <span style={{ fontSize: 10.5, fontWeight: 600, color: accentHex, textTransform: "uppercase", letterSpacing: "0.04em" }}>{listing.status}</span>
          <button
            onClick={(e) => { e.stopPropagation(); onRemove(); }}
            title="Remove listing"
            style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 0, lineHeight: 1 }}
          >
            <i className="ti ti-x" style={{ fontSize: 14 }} aria-hidden="true" />
          </button>
        </div>
      </div>

      {isExpanded && (
        <div style={{ padding: "16px 16px 14px", borderTop: `1px solid ${COLORS.hairline}` }}>
          <div style={{ display: "grid", gridTemplateColumns: "1.3fr 90px 110px 100px 100px", gap: 10, marginBottom: 14 }}>
            <div>
              <div style={labelStyle}>Title</div>
              <input value={listing.title} onChange={(e) => onUpdate("title", e.target.value)} style={fieldStyle} />
            </div>
            <div>
              <div style={labelStyle}>Price</div>
              <input type="number" value={listing.price} onChange={(e) => onUpdate("price", e.target.value)} style={fieldStyle} placeholder="$" />
            </div>
            <div>
              <div style={labelStyle}>Date listed</div>
              <input type="date" value={listing.dateListed || ""} onChange={(e) => onUpdate("dateListed", e.target.value)} style={fieldStyle} />
            </div>
            <div>
              <div style={labelStyle}>Platform</div>
              <select value={listing.platform} onChange={(e) => onUpdate("platform", e.target.value)} style={{ ...fieldStyle, cursor: "pointer" }}>
                {LISTING_PLATFORMS.map((p) => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <div>
              <div style={labelStyle}>Status</div>
              <select value={listing.status} onChange={(e) => onUpdate("status", e.target.value)} style={{ ...fieldStyle, cursor: "pointer" }}>
                {LISTING_STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
            <div style={labelStyle}>Description</div>
            {contentPieces && contentPieces.length > 0 && (
              <div style={{ position: "relative" }}>
                <button
                  onClick={() => setShowAutofill((v) => !v)}
                  style={{ background: "none", border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "3px 9px", fontSize: 10.5, fontWeight: 600, fontFamily: "inherit", color: COLORS.muted, cursor: "pointer" }}
                >
                  Autofill from Content
                </button>
                {showAutofill && (
                  <div style={{ position: "absolute", right: 0, top: "100%", marginTop: 4, background: COLORS.paper, border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, boxShadow: "0 4px 14px rgba(0,0,0,0.1)", zIndex: 10, minWidth: 180 }}>
                    {contentPieces.map((piece) => (
                      <div
                        key={piece.id}
                        onClick={() => applyAutofill(piece)}
                        style={{ padding: "8px 12px", fontSize: 12, cursor: "pointer", borderBottom: `1px solid ${COLORS.hairline}` }}
                      >
                        {(piece.title && piece.title.trim()) || "Untitled content piece"}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
          <textarea value={listing.description} onChange={(e) => onUpdate("description", e.target.value)} style={{ ...fieldStyle, minHeight: 50, resize: "vertical", marginBottom: 12 }} placeholder="Listing description…" />

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <div style={labelStyle}>Analytics</div>
            {connectInfo && (
              <button
                onClick={() => setShowConnectInfo((v) => !v)}
                style={{ background: "none", border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "3px 9px", fontSize: 10.5, fontWeight: 600, fontFamily: "inherit", color: COLORS.muted, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}
              >
                <i className="ti ti-plug-connected" style={{ fontSize: 11 }} aria-hidden="true" />
                Connect {listing.platform}
              </button>
            )}
          </div>
          {showConnectInfo && connectInfo && (
            <div style={{ fontSize: 10.5, color: COLORS.muted, fontStyle: "italic", marginBottom: 8 }}>{connectInfo}</div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 14 }}>
            <div>
              <div style={labelStyle}>Views</div>
              <input type="number" value={listing.views} onChange={(e) => onUpdate("views", e.target.value)} style={fieldStyle} placeholder="0" />
            </div>
            <div>
              <div style={labelStyle}>Quantity</div>
              <div style={{ ...fieldStyle, background: "none", color: COLORS.muted, display: "flex", alignItems: "center" }} title="Set on the Product page">{qty}</div>
            </div>
            <div>
              <div style={labelStyle}>Revenue</div>
              <input type="number" value={listing.revenue} onChange={(e) => onUpdate("revenue", e.target.value)} style={fieldStyle} placeholder="$" />
            </div>
          </div>

          <div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
              <div style={labelStyle}>Sold — {sold} of {qty} <span style={{ textTransform: "none", fontWeight: 400 }}>(synced from Product page)</span></div>
              {onOpenProduct && (
                <button
                  onClick={(e) => { e.stopPropagation(); onOpenProduct(); }}
                  style={{ background: "none", border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, padding: "3px 9px", fontSize: 10.5, fontWeight: 600, fontFamily: "inherit", color: COLORS.muted, cursor: "pointer" }}
                >
                  Manage inventory →
                </button>
              )}
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 4 }}>
              {Array.from({ length: qty }).map((_, i) => (
                <div
                  key={i}
                  title={i < sold ? "Sold" : "Available"}
                  style={{
                    width: 20,
                    height: 20,
                    borderRadius: "50%",
                    border: `1.5px solid ${accentHex}`,
                    background: i < sold ? accentHex : "transparent",
                  }}
                />
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- Inspiration and Planning Board ---------- */
function PlanningBoard({ content, setContent, accentHex }) {
  const canvasItems = content.canvasItems || [];
  const ideas = content.ideas || [];
  const [newIdeaText, setNewIdeaText] = useState("");

  const setCanvasItems = (updater) => {
    setContent((prev) => ({
      ...prev,
      canvasItems: typeof updater === "function" ? updater(prev.canvasItems || []) : updater,
    }));
  };

  const addIdea = () => {
    const text = newIdeaText.trim();
    if (!text) return;
    setContent((prev) => ({
      ...prev,
      ideas: [...(prev.ideas || []), { id: "idea-" + Date.now(), text, done: false }],
    }));
    setNewIdeaText("");
  };

  const toggleIdea = (id) => {
    setContent((prev) => ({
      ...prev,
      ideas: (prev.ideas || []).map((idea) => (idea.id === id ? { ...idea, done: !idea.done } : idea)),
    }));
  };

  const removeIdea = (id) => {
    setContent((prev) => ({
      ...prev,
      ideas: (prev.ideas || []).filter((idea) => idea.id !== id),
    }));
  };

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 260px" }}>
      <div style={{ borderRight: `1px solid ${COLORS.hairline}` }}>
        <FreeformCanvas
          items={canvasItems}
          setItems={setCanvasItems}
          accentHex={accentHex}
          placeholderTitle="Sketch, write text, or drop in inspiration"
          placeholderSub="Pick a tool on the left to get started"
          height={520}
        />
      </div>

      <div style={{ padding: "18px 16px", display: "flex", flexDirection: "column" }}>
        <SectionLabel>Notes</SectionLabel>
        <div style={{ marginTop: 12, flex: 1, overflowY: "auto" }}>
          {ideas.length === 0 && (
            <div style={{ fontSize: 12, color: COLORS.muted, fontStyle: "italic" }}>No notes yet — add one below.</div>
          )}
          {ideas.map((idea, i) => (
            <div key={idea.id} style={{ display: "flex", alignItems: "flex-start", gap: 8, marginBottom: 10 }}>
              <span style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.muted, marginTop: 1, minWidth: 14 }}>
                {String(i + 1).padStart(2, "0")}
              </span>
              <span
                onClick={() => toggleIdea(idea.id)}
                style={{
                  flex: 1,
                  fontSize: 12.5,
                  cursor: "pointer",
                  textDecoration: idea.done ? "line-through" : "none",
                  opacity: idea.done ? 0.45 : 1,
                }}
              >
                {idea.text}
              </span>
              <button
                onClick={() => removeIdea(idea.id)}
                title="Remove"
                style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 0, lineHeight: 1 }}
              >
                <i className="ti ti-x" style={{ fontSize: 13 }} aria-hidden="true" />
              </button>
            </div>
          ))}
        </div>

        <input
          value={newIdeaText}
          onChange={(e) => setNewIdeaText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") addIdea(); }}
          placeholder="Add a note…"
          style={{
            width: "100%",
            background: COLORS.cream,
            border: `1px solid ${COLORS.hairline}`,
            borderRadius: RADIUS,
            padding: "8px 11px",
            fontSize: 12.5,
            fontFamily: "inherit",
            color: COLORS.ink,
            marginTop: 8,
          }}
        />
      </div>
    </div>
  );
}

/* ---------- Craft Board ----------
   Craft tasks live directly in the app-wide `tasks` array (tagged category:
   "craft"), so they automatically appear on the Master Calendar back in Studio —
   there is no separate local copy to keep in sync. The supply list above it
   (formerly its own "Sourcing" board) is separate, per-project board content —
   what you'll need before you can start making, kept right above the task
   list it feeds into. */
function MakingOfBoard({ allTasks, setAllTasks, currentProjectId, accentHex, projects, sourcingItems, setSourcingItems }) {
  const projectCraftTasks = allTasks.filter((t) => t.projectId === currentProjectId && t.category === "craft");
  const [newSupplyName, setNewSupplyName] = useState("");
  const [newSupplyNote, setNewSupplyNote] = useState("");

  const addSupply = () => {
    const name = newSupplyName.trim();
    if (!name) return;
    setSourcingItems((prev) => [...prev, { id: "supply-" + Date.now(), name, note: newSupplyNote.trim(), sourced: false }]);
    setNewSupplyName("");
    setNewSupplyNote("");
  };

  const toggleSourced = (id) => {
    setSourcingItems((prev) => prev.map((it) => (it.id === id ? { ...it, sourced: !it.sourced } : it)));
  };

  const removeSupply = (id) => {
    setSourcingItems((prev) => prev.filter((it) => it.id !== id));
  };

  const sourcedCount = sourcingItems.filter((it) => it.sourced).length;
  // Sourced items sink to the bottom, same pattern as completed tasks
  // elsewhere in the app — the active items you still need stay up top.
  const sortedSupplies = [
    ...sourcingItems.filter((it) => !it.sourced),
    ...sourcingItems.filter((it) => it.sourced),
  ];

  return (
    <div style={{ padding: "24px 28px" }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 16 }}>
        <SectionLabel>Supplies needed</SectionLabel>
        {sourcingItems.length > 0 && (
          <span style={{ fontSize: 11, color: COLORS.muted }}>{sourcedCount} of {sourcingItems.length} sourced</span>
        )}
      </div>

      {sourcingItems.length === 0 && (
        <div style={{ fontSize: 12.5, color: COLORS.muted, fontStyle: "italic", marginBottom: 16 }}>
          No supplies listed yet — add what you'll need below.
        </div>
      )}

      <div style={{ marginBottom: 16 }}>
        {sortedSupplies.map((it) => (
          <div
            key={it.id}
            style={{
              display: "grid",
              gridTemplateColumns: "20px 1fr auto 24px",
              alignItems: "center",
              gap: 12,
              padding: "9px 10px",
              borderBottom: `1px solid ${COLORS.hairline}`,
            }}
          >
            <input
              type="checkbox"
              checked={it.sourced}
              onChange={() => toggleSourced(it.id)}
              style={{ accentColor: accentHex, cursor: "pointer" }}
            />
            <span
              style={{
                fontSize: 13,
                textDecoration: it.sourced ? "line-through" : "none",
                opacity: it.sourced ? 0.45 : 1,
              }}
            >
              {it.name}
            </span>
            <span style={{ fontSize: 11.5, color: COLORS.muted, whiteSpace: "nowrap" }}>{it.note}</span>
            <button
              onClick={() => removeSupply(it.id)}
              title="Remove"
              style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 0, lineHeight: 1, justifySelf: "end" }}
            >
              <i className="ti ti-x" style={{ fontSize: 14 }} aria-hidden="true" />
            </button>
          </div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 200px auto", gap: 8, marginBottom: 28 }}>
        <input
          value={newSupplyName}
          onChange={(e) => setNewSupplyName(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") addSupply(); }}
          placeholder="Type new supply…"
          style={{
            background: COLORS.cream,
            border: `1px solid ${COLORS.hairline}`,
            borderRadius: RADIUS,
            padding: "9px 12px",
            fontSize: 13,
            fontFamily: "inherit",
            color: COLORS.ink,
          }}
        />
        <input
          value={newSupplyNote}
          onChange={(e) => setNewSupplyNote(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") addSupply(); }}
          placeholder="Quantity / notes"
          style={{
            background: COLORS.cream,
            border: `1px solid ${COLORS.hairline}`,
            borderRadius: RADIUS,
            padding: "9px 12px",
            fontSize: 13,
            fontFamily: "inherit",
            color: COLORS.ink,
          }}
        />
        <button
          onClick={addSupply}
          style={{ background: COLORS.ink, color: COLORS.paper, border: `1px solid ${COLORS.ink}`, borderRadius: RADIUS, padding: "0 18px", fontSize: 13, fontWeight: 700, fontFamily: "inherit", cursor: "pointer" }}
        >
          Add
        </button>
      </div>

      <CategoryTaskTable
        tasks={projectCraftTasks}
        setAllTasks={setAllTasks}
        currentProjectId={currentProjectId}
        accentHex={accentHex}
        projects={projects}
        allTasks={allTasks}
        category="craft"
        columnLabel="Task: Craft"
      />
    </div>
  );
}

// Formats minutes-since-midnight as 12-hour time with AM/PM, e.g. 870 -> "2:30 PM"
function fmtMinutesAmPm(mins) {
  if (mins == null) return "—";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  const period = h >= 12 ? "PM" : "AM";
  let hr = h % 12;
  if (hr === 0) hr = 12;
  return hr + ":" + String(m).padStart(2, "0") + " " + period;
}

// Converts an "HH:MM" (24hr, from a <input type="time">) into minutes-since-midnight
function timeStrToMinutes(str) {
  if (!str) return null;
  const [h, m] = str.split(":").map(Number);
  return h * 60 + m;
}

// Converts minutes-since-midnight back into "HH:MM" for a <input type="time"> value
function minutesToTimeStr(mins) {
  if (mins == null) return "00:00";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

// Converts a Date to "YYYY-MM-DD" for a <input type="date"> value
function dateToInputStr(d) {
  if (!d) return "";
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function CategoryTaskTable({ tasks, setAllTasks, currentProjectId, accentHex, projects, allTasks, category, columnLabel, extraFields }) {
  const [newTitle, setNewTitle] = useState("");
  const [newDate, setNewDate] = useState("");
  const [newStart, setNewStart] = useState("");
  const [newEnd, setNewEnd] = useState("");
  const [copyHint, setCopyHint] = useState(null); // preview of a pending copy-from-project command
  const [editingId, setEditingId] = useState(null);
  const editingRowRef = React.useRef(null);

  // Clicking anywhere outside the row currently being edited commits and closes
  // it, the same as pressing Enter — matches how the individual field key
  // handlers already behave, just triggered by an outside click instead.
  React.useEffect(() => {
    if (!editingId) return;
    const handleOutsideClick = (e) => {
      if (editingRowRef.current && !editingRowRef.current.contains(e.target)) {
        setEditingId(null);
      }
    };
    document.addEventListener("pointerdown", handleOutsideClick);
    return () => document.removeEventListener("pointerdown", handleOutsideClick);
  }, [editingId]);

  const active = tasks.filter((t) => !t.completed);
  const completed = tasks.filter((t) => t.completed);

  // Always sorted by date, earliest to latest — not user-toggleable. Newly added
  // or edited tasks fall into place automatically since this runs on every render.
  const sortedActive = [...active].sort((a, b) => {
    const dateDiff = a.date - b.date;
    if (dateDiff !== 0) return dateDiff;
    return (a.startMinutes ?? 0) - (b.startMinutes ?? 0);
  });

  const toggleTask = (id) => {
    setAllTasks((prev) => prev.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t)));
  };

  const removeTask = (id) => {
    setAllTasks((prev) => prev.filter((t) => t.id !== id));
  };

  const updateTaskField = (id, field, value) => {
    setAllTasks((prev) => prev.map((t) => (t.id === id ? { ...t, [field]: value } : t)));
  };

  // AI copy-task syntax: "copy tasks [1,2,3] from project [name]" pulls named
  // same-category task numbers from that project's list into this one.
  // NOTE: this is a literal text-pattern match for now, not a real LLM interpretation —
  // see the held-for-later list for the planned upgrade to natural-language parsing.
  const COPY_PATTERN = /^copy tasks ([\d,\s]+) from project (.+)$/i;

  const tryParseCopyCommand = (text) => {
    const match = text.trim().match(COPY_PATTERN);
    if (!match) return null;
    const taskNumbers = match[1].split(",").map((n) => parseInt(n.trim(), 10)).filter((n) => !isNaN(n));
    const projectName = match[2].trim();
    const sourceProject = projects.find((p) => p.name.toLowerCase() === projectName.toLowerCase());
    if (!sourceProject) return { error: `No project named "${projectName}"` };
    const sourceTasks = allTasks.filter((t) => t.projectId === sourceProject.id && t.category === category);
    const picked = taskNumbers.map((n) => sourceTasks[n - 1]).filter(Boolean);
    if (picked.length === 0) return { error: "No matching tasks found" };
    return { tasksToImport: picked, projectName: sourceProject.name };
  };

  const handleTitleChange = (val) => {
    setNewTitle(val);
    const parsed = tryParseCopyCommand(val);
    setCopyHint(parsed);
  };

  const submitRow = () => {
    if (copyHint && copyHint.tasksToImport) {
      const imported = copyHint.tasksToImport.map((t) => ({
        id: "task-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
        projectId: currentProjectId,
        title: t.title,
        date: t.date,
        startMinutes: t.startMinutes,
        durationMinutes: t.durationMinutes,
        completed: false,
        category,
        ...(extraFields || {}),
      }));
      setAllTasks((prev) => [...prev, ...imported]);
      setNewTitle("");
      setCopyHint(null);
      return;
    }
    const title = newTitle.trim();
    if (!title) return;
    const startMin = timeStrToMinutes(newStart) ?? 9 * 60;
    const endMin = timeStrToMinutes(newEnd) ?? startMin + 60;
    setAllTasks((prev) => [...prev, {
      id: "task-" + Date.now(),
      projectId: currentProjectId,
      title,
      date: newDate ? new Date(newDate + "T00:00:00") : appToday(),
      startMinutes: startMin,
      durationMinutes: Math.max(endMin - startMin, 15),
      completed: false,
      category,
      ...(extraFields || {}),
    }]);
    setNewTitle("");
    setNewDate("");
    setNewStart("");
    setNewEnd("");
    setCopyHint(null);
  };

  const rowStyle = {
    display: "grid",
    gridTemplateColumns: "20px 1fr 130px 100px 100px 22px",
    alignItems: "center",
    gap: 10,
    padding: "7px 0",
    borderBottom: `1px solid ${COLORS.hairline}`,
  };

  const fieldInputStyle = {
    background: COLORS.cream,
    border: `1px solid ${COLORS.hairline}`,
    borderRadius: RADIUS,
    padding: "5px 7px",
    fontSize: 11.5,
    fontFamily: "inherit",
    color: COLORS.ink,
    width: "100%",
  };

  const renderRow = (t, faded) => {
    const isEditing = editingId === t.id;
    const endMinutes = (t.startMinutes ?? 0) + (t.durationMinutes ?? 0);
    return (
      <div key={t.id} ref={isEditing ? editingRowRef : null} style={{ ...rowStyle, opacity: faded ? 0.4 : 1 }}>
        <input type="checkbox" checked={t.completed} onChange={() => toggleTask(t.id)} style={{ accentColor: accentHex, cursor: "pointer" }} />

        {isEditing ? (
          <input
            autoFocus
            value={t.title}
            onChange={(e) => updateTaskField(t.id, "title", e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingId(null); }}
            style={fieldInputStyle}
          />
        ) : (
          <span
            onClick={() => setEditingId(t.id)}
            style={{ fontSize: 12.5, textDecoration: t.completed ? "line-through" : "none", cursor: "text" }}
          >
            {t.title}
          </span>
        )}

        {isEditing ? (
          <input
            type="date"
            value={dateToInputStr(t.date)}
            onChange={(e) => updateTaskField(t.id, "date", e.target.value ? new Date(e.target.value + "T00:00:00") : t.date)}
            onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingId(null); }}
            style={fieldInputStyle}
          />
        ) : (
          <span onClick={() => setEditingId(t.id)} style={{ fontSize: 11, color: COLORS.muted, cursor: "text" }}>{dateToInputStr(t.date) || "—"}</span>
        )}

        {isEditing ? (
          <input
            type="time"
            value={minutesToTimeStr(t.startMinutes)}
            onChange={(e) => {
              const newStartMin = timeStrToMinutes(e.target.value);
              const currentDuration = t.durationMinutes ?? 60;
              updateTaskField(t.id, "startMinutes", newStartMin);
            }}
            onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingId(null); }}
            style={fieldInputStyle}
          />
        ) : (
          <span onClick={() => setEditingId(t.id)} style={{ fontSize: 11, color: COLORS.muted, cursor: "text" }}>{fmtMinutesAmPm(t.startMinutes)}</span>
        )}

        {isEditing ? (
          <input
            type="time"
            value={minutesToTimeStr(endMinutes)}
            onChange={(e) => {
              const newEndMin = timeStrToMinutes(e.target.value);
              const newDuration = Math.max(newEndMin - (t.startMinutes ?? 0), 15);
              updateTaskField(t.id, "durationMinutes", newDuration);
            }}
            onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Escape") setEditingId(null); }}
            style={fieldInputStyle}
          />
        ) : (
          <span onClick={() => setEditingId(t.id)} style={{ fontSize: 11, color: COLORS.muted, cursor: "text" }}>{fmtMinutesAmPm(endMinutes)}</span>
        )}

        {isEditing ? (
          <button onClick={() => setEditingId(null)} title="Done editing" style={{ background: "none", border: "none", cursor: "pointer", color: accentHex, padding: 0 }}>
            <i className="ti ti-check" style={{ fontSize: 14 }} aria-hidden="true" />
          </button>
        ) : (
          <button onClick={() => removeTask(t.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 0 }}>
            <i className="ti ti-x" style={{ fontSize: 12 }} aria-hidden="true" />
          </button>
        )}
      </div>
    );
  };

  return (
    <div>
      <div style={{ ...rowStyle, borderBottom: `1px solid ${COLORS.ink}`, paddingBottom: 6 }}>
        <div />
        {[
          { key: "title", label: columnLabel },
          { key: "date", label: "Date" },
          { key: "startMinutes", label: "Start" },
          { key: "endMinutes", label: "End" },
        ].map((col) => (
          <div
            key={col.key}
            style={{
              fontSize: 9.5,
              fontWeight: 600,
              color: COLORS.muted,
              textTransform: "uppercase",
              letterSpacing: "0.04em",
            }}
          >
            {col.label}
          </div>
        ))}
        <div />
      </div>

      {sortedActive.map((t) => renderRow(t, false))}
      {completed.map((t) => renderRow(t, true))}

      <div style={{ ...rowStyle, borderBottom: "none", marginTop: 4 }}>
        <div style={{ width: 14, height: 14, borderRadius: "50%", border: `1px solid ${COLORS.hairline}` }} />
        <input
          value={newTitle}
          onChange={(e) => handleTitleChange(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submitRow(); }}
          placeholder="Type new task…"
          style={fieldInputStyle}
        />
        <input
          type="date"
          value={newDate}
          onChange={(e) => setNewDate(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submitRow(); }}
          style={fieldInputStyle}
        />
        <input
          type="time"
          value={newStart || "00:00"}
          onChange={(e) => setNewStart(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submitRow(); }}
          style={fieldInputStyle}
        />
        <input
          type="time"
          value={newEnd || "00:00"}
          onChange={(e) => setNewEnd(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submitRow(); }}
          style={fieldInputStyle}
        />
        <div />
      </div>

      {!newTitle && (
        <div style={{ fontSize: 10, color: COLORS.muted, fontStyle: "italic", marginTop: 6 }}>
          Tip: type "copy tasks [1,2,3] from project [name]" to pull tasks from another project's Making Of list. Click any task, date, or time to edit it. These tasks also appear on the Master Calendar, tagged Craft.
        </div>
      )}
      {copyHint && copyHint.error && (
        <div style={{ fontSize: 10.5, color: COLORS.tomato, marginTop: 6 }}>{copyHint.error}</div>
      )}
      {copyHint && copyHint.tasksToImport && (
        <div style={{ fontSize: 10.5, color: accentHex, marginTop: 6 }}>
          Press Enter to copy {copyHint.tasksToImport.length} task{copyHint.tasksToImport.length !== 1 ? "s" : ""} from "{copyHint.projectName}".
        </div>
      )}
    </div>
  );
}

/* ---------- Content Board ----------
   A project can have multiple content pieces (e.g. "Making-of Reel" and
   "Reveal Carousel" for the same physical piece) — each is its own record
   with its own metadata and its own task list, shown as an accordion so you
   can work on one at a time without losing sight of the others. */
function ContentBoard({ boardData, setBoardData, allTasks, setAllTasks, currentProjectId, accentHex, projects, contentLibrary, setContentLibrary }) {
  const pieces = boardData.pieces || [];
  // Every piece is expanded by default; a piece only collapses when its own
  // toggle is explicitly clicked, and multiple pieces can stay open at once.
  const [collapsedIds, setCollapsedIds] = useState(() => new Set());
  const [justAddedId, setJustAddedId] = useState(null);

  const togglePiece = (id) => {
    setCollapsedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const addPiece = () => {
    const newPiece = { id: "piece-" + Date.now(), title: "", series: "", episode: "", type: "", trend: "", music: "", voiceover: "", caption: "", notes: "" };
    setBoardData((prev) => ({ ...prev, pieces: [...(prev.pieces || []), newPiece] }));
    setJustAddedId(newPiece.id);
  };

  const removePiece = (id) => {
    setBoardData((prev) => ({ ...prev, pieces: (prev.pieces || []).filter((p) => p.id !== id) }));
    // Content tasks tied to a deleted piece become orphaned reference-wise; leave them in
    // the global task list (still visible on the Calendar) rather than silently delete real work.
    setCollapsedIds((prev) => {
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
  };

  const updatePiece = (id, field, value) => {
    setBoardData((prev) => ({
      ...prev,
      pieces: (prev.pieces || []).map((p) => (p.id === id ? { ...p, [field]: value } : p)),
    }));
  };

  return (
    <div style={{ padding: "24px 28px" }}>
      {pieces.length === 0 && (
        <div style={{ fontSize: 12.5, color: COLORS.muted, fontStyle: "italic", marginBottom: 16 }}>
          No content pieces yet — add one to start planning a post, reel, or carousel for this project.
        </div>
      )}

      <div style={{ marginBottom: 16 }}>
        {pieces.map((piece) => (
          <ContentPieceAccordionItem
            key={piece.id}
            piece={piece}
            isExpanded={!collapsedIds.has(piece.id)}
            onToggle={() => togglePiece(piece.id)}
            onUpdate={(field, value) => updatePiece(piece.id, field, value)}
            onRemove={() => removePiece(piece.id)}
            allTasks={allTasks}
            setAllTasks={setAllTasks}
            currentProjectId={currentProjectId}
            accentHex={accentHex}
            projects={projects}
            contentLibrary={contentLibrary}
            setContentLibrary={setContentLibrary}
            justAdded={justAddedId === piece.id}
          />
        ))}
      </div>

      <button
        onClick={addPiece}
        style={{
          background: "none",
          border: `1px dashed ${COLORS.hairline}`,
          borderRadius: RADIUS,
          padding: "10px 16px",
          fontSize: 12.5,
          fontWeight: 600,
          fontFamily: "inherit",
          color: COLORS.muted,
          cursor: "pointer",
          width: "100%",
          textAlign: "center",
        }}
      >
        + Add content piece
      </button>
    </div>
  );
}

function ContentPieceAccordionItem({ piece, isExpanded, onToggle, onUpdate, onRemove, allTasks, setAllTasks, currentProjectId, accentHex, projects, contentLibrary, setContentLibrary, justAdded }) {
  const pieceTasks = allTasks.filter((t) => t.projectId === currentProjectId && t.category === "content" && t.contentPieceId === piece.id);
  const displayTitle = piece.title.trim() || "Untitled content piece";

  return (
    <div className={justAdded ? "flash-save" : ""} style={{ border: `1px solid ${COLORS.hairline}`, borderRadius: RADIUS, marginBottom: 10, overflow: "hidden" }}>
      <div
        onClick={onToggle}
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "12px 16px",
          cursor: "pointer",
          background: isExpanded ? COLORS.cream : COLORS.paper,
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <i className={"ti " + (isExpanded ? "ti-chevron-down" : "ti-chevron-right")} style={{ fontSize: 14, color: COLORS.muted }} aria-hidden="true" />
          <span style={{ fontSize: 13.5, fontWeight: 700 }}>{displayTitle}</span>
          {piece.type && <span style={{ fontSize: 10.5, color: COLORS.muted }}>{piece.type}</span>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          {pieceTasks.length > 0 && (
            <span style={{ fontSize: 10.5, color: COLORS.muted }}>
              {pieceTasks.filter((t) => t.completed).length} of {pieceTasks.length} tasks
            </span>
          )}
          <button
            onClick={(e) => { e.stopPropagation(); onRemove(); }}
            title="Remove content piece"
            style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 0, lineHeight: 1 }}
          >
            <i className="ti ti-x" style={{ fontSize: 14 }} aria-hidden="true" />
          </button>
        </div>
      </div>

      {isExpanded && (
        <div style={{ padding: "20px 16px", borderTop: `1px solid ${COLORS.hairline}` }}>
          <ContentPieceForm
            piece={piece}
            onUpdate={onUpdate}
            contentLibrary={contentLibrary}
            setContentLibrary={setContentLibrary}
          />

          <div style={{ borderTop: `1px solid ${COLORS.hairline}`, marginTop: 20, paddingTop: 16 }}>
            <CategoryTaskTable
              tasks={pieceTasks}
              setAllTasks={setAllTasks}
              currentProjectId={currentProjectId}
              accentHex={accentHex}
              projects={projects}
              allTasks={allTasks}
              category="content"
              columnLabel="Task: Content"
              extraFields={{ contentPieceId: piece.id }}
            />
          </div>
        </div>
      )}
    </div>
  );
}

function ContentPieceForm({ piece, onUpdate, contentLibrary, setContentLibrary }) {
  const fieldStyle = {
    background: COLORS.cream,
    border: `1px solid ${COLORS.hairline}`,
    borderRadius: RADIUS,
    padding: "7px 10px",
    fontSize: 12.5,
    fontFamily: "inherit",
    color: COLORS.ink,
    width: "100%",
  };
  const labelStyle = { fontSize: 10, fontWeight: 600, color: COLORS.muted, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 5 };

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, marginBottom: 16 }}>
        <div>
          <div style={labelStyle}>Title</div>
          <input value={piece.title || ""} onChange={(e) => onUpdate("title", e.target.value)} style={fieldStyle} placeholder="Content title…" />
        </div>
        <div>
          <div style={labelStyle}>Series</div>
          <LibraryPickerField
            value={piece.series}
            onChange={(val) => onUpdate("series", val)}
            options={contentLibrary.series}
            onAddOption={(val) => setContentLibrary((prev) => ({ ...prev, series: [...prev.series, val] }))}
            placeholder="Select series…"
          />
        </div>
        <div>
          <div style={labelStyle}>Episode</div>
          <input value={piece.episode || ""} onChange={(e) => onUpdate("episode", e.target.value)} style={fieldStyle} placeholder="e.g. 1" />
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, marginBottom: 20 }}>
        <div>
          <div style={labelStyle}>Type</div>
          <LibraryPickerField
            value={piece.type}
            onChange={(val) => onUpdate("type", val)}
            options={contentLibrary.types}
            onAddOption={(val) => setContentLibrary((prev) => ({ ...prev, types: [...prev.types, val] }))}
            placeholder="Select type…"
          />
        </div>
        <div>
          <div style={labelStyle}>Trend</div>
          <input value={piece.trend || ""} onChange={(e) => onUpdate("trend", e.target.value)} style={fieldStyle} placeholder="Trend reference…" />
        </div>
        <div>
          <div style={labelStyle}>Music</div>
          <input value={piece.music || ""} onChange={(e) => onUpdate("music", e.target.value)} style={fieldStyle} placeholder="Track / artist…" />
        </div>
      </div>

      <div style={{ marginBottom: 12 }}>
        <div style={labelStyle}>Voiceover</div>
        <textarea value={piece.voiceover || ""} onChange={(e) => onUpdate("voiceover", e.target.value)} style={{ ...fieldStyle, minHeight: 56, resize: "vertical", fontFamily: "inherit" }} placeholder="Voiceover script…" />
      </div>
      <div style={{ marginBottom: 12 }}>
        <div style={labelStyle}>Caption</div>
        <textarea value={piece.caption || ""} onChange={(e) => onUpdate("caption", e.target.value)} style={{ ...fieldStyle, minHeight: 56, resize: "vertical", fontFamily: "inherit" }} placeholder="Post caption…" />
      </div>
      <div>
        <div style={labelStyle}>Notes</div>
        <textarea value={piece.notes || ""} onChange={(e) => onUpdate("notes", e.target.value)} style={{ ...fieldStyle, minHeight: 44, resize: "vertical", fontFamily: "inherit" }} placeholder="Notes…" />
      </div>
    </div>
  );
}

// A dropdown backed by a shared Content Library list (Type or Series), with an
// inline "+ Add new…" option that adds to the shared library AND selects it —
// so the vocabulary grows without leaving the project.
function LibraryPickerField({ value, onChange, options, onAddOption, placeholder }) {
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState("");

  const commitNew = () => {
    const val = draft.trim();
    if (val) {
      if (!options.includes(val)) onAddOption(val);
      onChange(val);
    }
    setAdding(false);
    setDraft("");
  };

  if (adding) {
    return (
      <input
        autoFocus
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        onBlur={commitNew}
        onKeyDown={(e) => { if (e.key === "Enter") commitNew(); if (e.key === "Escape") { setAdding(false); setDraft(""); } }}
        placeholder="Type a new value…"
        style={{
          background: COLORS.cream,
          border: `1px solid ${COLORS.hairline}`,
          borderRadius: RADIUS,
          padding: "7px 10px",
          fontSize: 12.5,
          fontFamily: "inherit",
          color: COLORS.ink,
          width: "100%",
        }}
      />
    );
  }

  return (
    <div style={{ position: "relative" }}>
      <select
        value={options.includes(value) ? value : ""}
        onChange={(e) => { if (e.target.value === "__add") { setAdding(true); } else { onChange(e.target.value); } }}
        style={{
          background: COLORS.cream,
          border: `1px solid ${COLORS.hairline}`,
          borderRadius: RADIUS,
          padding: "7px 28px 7px 10px",
          fontSize: 12.5,
          fontFamily: "inherit",
          color: COLORS.ink,
          width: "100%",
          appearance: "none",
          WebkitAppearance: "none",
          cursor: "pointer",
        }}
      >
        <option value="" disabled>{value && !options.includes(value) ? value : placeholder}</option>
        {options.map((opt) => (
          <option key={opt} value={opt}>{opt}</option>
        ))}
        <option value="__add">+ Add new…</option>
      </select>
      <DropdownArrow />
    </div>
  );
}

function ToolButton({ active, onClick, title, children }) {
  return (
    <button
      onClick={onClick}
      title={title}
      style={{
        width: 34,
        height: 34,
        borderRadius: RADIUS,
        border: active ? `1px solid ${COLORS.ink}` : "1px solid transparent",
        background: active ? COLORS.ink : "transparent",
        color: active ? COLORS.paper : COLORS.ink,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        cursor: "pointer",
      }}
    >
      {children}
    </button>
  );
}

/* ---------- Auth screens ----------
   Public face of StudioCo. Deliberately in the same editorial language as the
   app itself — Inter, 3px radius, cream paper, one accent — so signing in
   doesn't feel like a different product from the studio behind it. */
function AuthShell({ children, maxWidth }) {
  return (
    <div style={{ fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, Arial, sans-serif', background: COLORS.cream, color: COLORS.ink, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ width: "100%", maxWidth: maxWidth || 420 }}>{children}</div>
    </div>
  );
}

function LandingScreen({ onLogIn, onSignUp }) {
  return (
    <AuthShell maxWidth={560}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 28 }}>
        <div style={{ width: 30, height: 30, background: COLORS.ink, borderRadius: RADIUS, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <ProjectIcon icon="urn" color={COLORS.lemon} size={17} />
        </div>
        <span style={{ fontSize: 13, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase" }}>StudioCo</span>
      </div>

      <h1 style={{ fontSize: 40, lineHeight: 1.1, fontWeight: 700, margin: "0 0 16px", letterSpacing: "-0.02em" }}>
        The quiet half of a<br />making practice.
      </h1>
      <p style={{ fontSize: 16, lineHeight: 1.6, color: COLORS.muted, margin: "0 0 32px", maxWidth: 460 }}>
        A private studio workspace for people who make things by hand. Track a piece
        from first sketch through glaze, filming, listing and sale — eight stages,
        one place, no spreadsheets.
      </p>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <button onClick={onLogIn} style={{ padding: "11px 22px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", background: COLORS.ink, color: COLORS.cream, border: "none", borderRadius: RADIUS, cursor: "pointer" }}>
          Log in
        </button>
        <button onClick={onSignUp} style={{ padding: "11px 22px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", background: "transparent", color: COLORS.ink, border: "1px solid " + COLORS.ink, borderRadius: RADIUS, cursor: "pointer" }}>
          Create an account
        </button>
      </div>

      <div style={{ marginTop: 44, paddingTop: 24, borderTop: "1px solid " + COLORS.hairline, display: "flex", gap: 28, flexWrap: "wrap" }}>
        {[
          ["Eight stages", "Inspiration to learnings"],
          ["Every device", "Your studio syncs everywhere"],
          ["Private by default", "Only you can see your work"],
        ].map(([title, sub]) => (
          <div key={title} style={{ minWidth: 130 }}>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 5 }}>{title}</div>
            <div style={{ fontSize: 13, color: COLORS.muted, lineHeight: 1.45 }}>{sub}</div>
          </div>
        ))}
      </div>
    </AuthShell>
  );
}

function AuthScreen({ mode, onBack, onAuthed }) {
  const isSignUp = mode === "signup";
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");

  const inputStyle = {
    width: "100%", padding: "10px 12px", fontSize: 14, fontFamily: "inherit",
    color: COLORS.ink, background: COLORS.paper,
    border: "1px solid " + COLORS.hairline, borderRadius: RADIUS,
  };
  const labelStyle = { display: "block", fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 6 };

  const submit = async () => {
    setError(""); setNotice(""); setBusy(true);
    try {
      if (isSignUp) {
        await Auth.signUp(email, password);
        setNotice("Check your email for a confirmation link, then log in.");
      } else {
        await Auth.signIn(email, password);
        onAuthed();
      }
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const onKeyDown = (e) => { if (e.key === "Enter" && !busy) submit(); };

  return (
    <AuthShell>
      <button onClick={onBack} style={{ background: "none", border: "none", padding: 0, marginBottom: 22, fontSize: 13, fontFamily: "inherit", color: COLORS.muted, cursor: "pointer" }}>
        ← Back
      </button>

      <h2 style={{ fontSize: 26, fontWeight: 700, margin: "0 0 22px", letterSpacing: "-0.01em" }}>
        {isSignUp ? "Create your studio" : "Welcome back"}
      </h2>

      <div style={{ marginBottom: 14 }}>
        <label style={labelStyle} htmlFor="auth-email">Email</label>
        <input id="auth-email" type="email" value={email} autoComplete="email"
          onChange={(e) => setEmail(e.target.value)} onKeyDown={onKeyDown} style={inputStyle} />
      </div>

      <div style={{ marginBottom: 20 }}>
        <label style={labelStyle} htmlFor="auth-password">Password</label>
        <input id="auth-password" type="password" value={password}
          autoComplete={isSignUp ? "new-password" : "current-password"}
          onChange={(e) => setPassword(e.target.value)} onKeyDown={onKeyDown} style={inputStyle} />
        {isSignUp && <div style={{ fontSize: 12, color: COLORS.muted, marginTop: 6 }}>At least 6 characters.</div>}
      </div>

      {error && (
        <div style={{ padding: "10px 12px", marginBottom: 14, borderRadius: RADIUS, fontSize: 13, lineHeight: 1.45, color: COLORS.tomato, border: "1px solid " + COLORS.tomato }}>
          {error}
        </div>
      )}
      {notice && (
        <div style={{ padding: "10px 12px", marginBottom: 14, borderRadius: RADIUS, fontSize: 13, lineHeight: 1.45, color: COLORS.ink, border: "1px solid " + COLORS.hairline, background: COLORS.todayTint }}>
          {notice}
        </div>
      )}

      <button onClick={submit} disabled={busy} style={{ width: "100%", padding: "12px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", background: COLORS.ink, color: COLORS.cream, border: "none", borderRadius: RADIUS, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1 }}>
        {busy ? "Working…" : isSignUp ? "Create account" : "Log in"}
      </button>
    </AuthShell>
  );
}

/* The gate. Nothing in StudioApp — or any board under it — ever mounts
   without a session, so every persistence call below it can assume a token. */
function App() {
  const [session, setSession] = useState(() => Auth.session());
  const [view, setView] = useState("landing"); // landing | login | signup

  if (session) return <StudioApp onSignOut={() => { Auth.signOut(); }} email={session.email} />;

  if (view === "landing") {
    return <LandingScreen onLogIn={() => setView("login")} onSignUp={() => setView("signup")} />;
  }
  return (
    <AuthScreen
      mode={view}
      onBack={() => setView("landing")}
      onAuthed={() => setSession(Auth.session())}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
