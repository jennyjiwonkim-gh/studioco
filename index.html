<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudioCo — Creative Business Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --cream: #F8F6F1;
    --ink: #111111;
    --paper: #FFFFFF;
    --hairline: #DEDACD;
    --muted: #8A8579;
    --accent-navy: #102A43;
    --accent-royal: #120A8F;
    --accent-cobalt: #1D4ED8;
    --accent-lemon: #8F7300;
    --accent-tomato: #F24A3D;
  }
  [data-theme="dark"] {
    --cream: #16150F;
    --ink: #F2EFE6;
    --paper: #201E17;
    --hairline: #38352B;
    --muted: #9A9483;
    --accent-navy: #6FA0CC;
    --accent-royal: #8C8AF0;
    --accent-cobalt: #7FA9FF;
    --accent-lemon: #FFF176;
    --accent-tomato: #FF7A6E;
  }
  html, body { 
    margin: 0; 
    padding: 0; 
    background: var(--cream);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const SUPABASE_URL = 'https://hvqjpoqamxalitydrega.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2cWpwb3FhbXhhbGl0eWRyZWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MjE2OTcsImV4cCI6MjEwMTI5NzY5N30.fWDNqRDXanEMLrSjFkRXuVv9CPyXbU276KO_zrB1g8w';

const COLORS = {
  navy: "var(--accent-navy)",
  tomato: "var(--accent-tomato)",
  cream: "var(--cream)",
  ink: "var(--ink)",
  paper: "var(--paper)",
  hairline: "var(--hairline)",
  muted: "var(--muted)",
};

const RADIUS = 3;

// Supabase Auth via REST API
const SupabaseAuth = {
  async signUp(email, password) {
    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/signup`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ email, password }),
      }
    );
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || 'Signup failed');
    return data;
  },

  async signIn(email, password) {
    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ email, password }),
      }
    );
    const data = await response.json();
    if (!response.ok) throw new Error(data.error_description || 'Login failed');
    localStorage.setItem('supabase_token', data.access_token);
    localStorage.setItem('supabase_user_email', email);
    return data;
  },

  async signOut() {
    localStorage.removeItem('supabase_token');
    localStorage.removeItem('supabase_user_email');
  },

  getUser() {
    const token = localStorage.getItem('supabase_token');
    const email = localStorage.getItem('supabase_user_email');
    return token && email ? { email } : null;
  },
};

// ============ LANDING PAGE ============
function LandingPage({ onLoginClick, onSignupClick }) {
  return (
    <div style={{
      minHeight: '100vh',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      padding: '24px',
      background: COLORS.cream,
    }}>
      <div style={{ maxWidth: '600px', textAlign: 'center' }}>
        <h1 style={{
          fontSize: '48px',
          fontWeight: 700,
          marginTop: 0,
          marginBottom: '12px',
          color: COLORS.ink,
        }}>
          StudioCo
        </h1>
        <p style={{
          fontSize: '18px',
          color: COLORS.muted,
          marginBottom: '32px',
          lineHeight: 1.6,
        }}>
          A private studio management dashboard for ceramic artists. Track projects, manage content, and grow your creative business — all in one place.
        </p>
        <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
          <button onClick={onLoginClick} style={{
            padding: '12px 24px',
            fontSize: '14px',
            fontWeight: 600,
            backgroundColor: COLORS.navy,
            color: '#FFF',
            border: 'none',
            borderRadius: RADIUS,
            cursor: 'pointer',
          }}>
            Log In
          </button>
          <button onClick={onSignupClick} style={{
            padding: '12px 24px',
            fontSize: '14px',
            fontWeight: 600,
            backgroundColor: 'transparent',
            color: COLORS.navy,
            border: `2px solid ${COLORS.navy}`,
            borderRadius: RADIUS,
            cursor: 'pointer',
          }}>
            Sign Up
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ AUTH FORM ============
function AuthForm({ isSignUp, onBack, onSuccess }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    setLoading(true);

    try {
      if (isSignUp) {
        await SupabaseAuth.signUp(email, password);
        onSuccess('Check your email to confirm your account');
      } else {
        await SupabaseAuth.signIn(email, password);
        onSuccess('Logged in successfully!');
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{
      minHeight: '100vh',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      padding: '24px',
      background: COLORS.cream,
    }}>
      <div style={{ maxWidth: '400px', width: '100%' }}>
        <button onClick={onBack} style={{
          background: 'none',
          border: 'none',
          color: COLORS.muted,
          cursor: 'pointer',
          marginBottom: '24px',
          fontSize: '14px',
          fontWeight: 500,
        }}>
          ← Back
        </button>

        <h2 style={{
          fontSize: '28px',
          fontWeight: 700,
          marginTop: 0,
          marginBottom: '24px',
          color: COLORS.ink,
        }}>
          {isSignUp ? 'Create Account' : 'Log In'}
        </h2>

        <form onSubmit={handleSubmit}>
          <div style={{ marginBottom: '16px' }}>
            <label style={{
              display: 'block',
              fontSize: '12px',
              fontWeight: 600,
              marginBottom: '6px',
              color: COLORS.ink,
              textTransform: 'uppercase',
              letterSpacing: '0.5px',
            }}>
              Email
            </label>
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              required
              disabled={loading}
              style={{
                width: '100%',
                padding: '10px 12px',
                fontSize: '14px',
                border: `1px solid ${COLORS.hairline}`,
                borderRadius: RADIUS,
                backgroundColor: COLORS.paper,
                color: COLORS.ink,
                fontFamily: 'inherit',
              }}
            />
          </div>

          <div style={{ marginBottom: '24px' }}>
            <label style={{
              display: 'block',
              fontSize: '12px',
              fontWeight: 600,
              marginBottom: '6px',
              color: COLORS.ink,
              textTransform: 'uppercase',
              letterSpacing: '0.5px',
            }}>
              Password
            </label>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              required
              disabled={loading}
              style={{
                width: '100%',
                padding: '10px 12px',
                fontSize: '14px',
                border: `1px solid ${COLORS.hairline}`,
                borderRadius: RADIUS,
                backgroundColor: COLORS.paper,
                color: COLORS.ink,
                fontFamily: 'inherit',
              }}
            />
          </div>

          {error && (
            <div style={{
              padding: '12px',
              marginBottom: '16px',
              backgroundColor: '#FEE2E2',
              color: '#991B1B',
              borderRadius: RADIUS,
              fontSize: '13px',
            }}>
              {error}
            </div>
          )}

          <button type="submit" disabled={loading} style={{
            width: '100%',
            padding: '12px',
            fontSize: '14px',
            fontWeight: 600,
            backgroundColor: COLORS.navy,
            color: '#FFF',
            border: 'none',
            borderRadius: RADIUS,
            cursor: loading ? 'not-allowed' : 'pointer',
            opacity: loading ? 0.6 : 1,
          }}>
            {loading ? 'Please wait...' : (isSignUp ? 'Sign Up' : 'Log In')}
          </button>
        </form>
      </div>
    </div>
  );
}

// ============ MAIN APP ============
export default function App() {
  const [user, setUser] = useState(null);
  const [authView, setAuthView] = useState(null);
  const [message, setMessage] = useState('');
  const messageTimeoutRef = useRef(null);

  useEffect(() => {
    const currentUser = SupabaseAuth.getUser();
    setUser(currentUser);
  }, []);

  const showMessage = (msg) => {
    setMessage(msg);
    if (messageTimeoutRef.current) clearTimeout(messageTimeoutRef.current);
    messageTimeoutRef.current = setTimeout(() => setMessage(''), 4000);
  };

  if (!user) {
    if (authView === 'login') {
      return (
        <AuthForm
          isSignUp={false}
          onBack={() => setAuthView(null)}
          onSuccess={(msg) => {
            showMessage(msg);
            const currentUser = SupabaseAuth.getUser();
            setUser(currentUser);
          }}
        />
      );
    }
    if (authView === 'signup') {
      return (
        <AuthForm
          isSignUp={true}
          onBack={() => setAuthView(null)}
          onSuccess={showMessage}
        />
      );
    }
    return (
      <LandingPage
        onLoginClick={() => setAuthView('login')}
        onSignupClick={() => setAuthView('signup')}
      />
    );
  }

  return (
    <div>
      <div style={{
        position: 'fixed',
        top: '16px',
        right: '16px',
        zIndex: 9999,
      }}>
        <button onClick={() => {
          SupabaseAuth.signOut();
          setUser(null);
        }} style={{
          padding: '8px 16px',
          fontSize: '12px',
          fontWeight: 600,
          backgroundColor: COLORS.tomato,
          color: '#FFF',
          border: 'none',
          borderRadius: RADIUS,
          cursor: 'pointer',
          textTransform: 'uppercase',
          letterSpacing: '0.5px',
        }}>
          Log Out
        </button>
      </div>

      {message && (
        <div style={{
          position: 'fixed',
          top: '16px',
          left: '16px',
          padding: '12px 16px',
          backgroundColor: COLORS.navy,
          color: '#FFF',
          borderRadius: RADIUS,
          fontSize: '12px',
          zIndex: 10000,
        }}>
          {message}
        </div>
      )}

      <div style={{
        paddingTop: '60px',
        textAlign: 'center',
        padding: '60px 24px 24px',
        minHeight: '100vh',
        background: COLORS.cream,
      }}>
        <h1 style={{
          fontSize: '32px',
          fontWeight: 700,
          color: COLORS.ink,
          marginBottom: '12px',
        }}>
          Welcome to StudioCo
        </h1>
        <p style={{
          fontSize: '14px',
          color: COLORS.muted,
          marginBottom: '32px',
        }}>
          Logged in as: <strong>{user.email}</strong>
        </p>
        <p style={{
          fontSize: '14px',
          color: COLORS.muted,
          maxWidth: '500px',
          margin: '0 auto',
          lineHeight: 1.6,
        }}>
          The full dashboard is being integrated. For now, you're successfully authenticated with Supabase. 
          <br /><br />
          Next: integrate your v49 dashboard and wire up data sync.
        </p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
